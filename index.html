/* ============================================================
   Wine Study Lab — sistema visual
   Papel, tinta, bordô. Serifa para títulos, sans para interface.
   O modo degustação (.tasting-mode) usa uma paleta escura própria.
   ============================================================ */
:root {
  --bg: #f5f0e8;
  --paper: #fbf8f3;
  --paper-2: #f1eadf;
  --ink: #2b1f20;
  --ink-2: #4a3b3a;
  --muted: #86766f;
  --line: #e3d8ca;
  --line-2: #d4c5b3;
  --wine: #6d1f2c;
  --wine-2: #8f2d3d;
  --wine-soft: #f3e4e2;
  --gold: #a8844c;
  --gold-soft: #f3eadb;
  --hit: #3f7350;  --hit-soft: #e5efe5;
  --near: #b3832a; --near-soft: #f6ecd6;
  --miss: #a13b35; --miss-soft: #f5e1de;
  --info: #56697a; --info-soft: #e6ecf0;
  --shadow: 0 1px 2px rgba(43,31,32,.05), 0 8px 24px -12px rgba(43,31,32,.18);
  --radius: 10px;
  --serif: 'Cormorant Garamond', 'Iowan Old Style', Georgia, serif;
  --sans: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --nav-w: 248px;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #1a1415; --paper: #221a1b; --paper-2: #2a2021; --ink: #f1e8e1; --ink-2: #d9ccc4; --muted: #a39088;
    --line: #3a2e2e; --line-2: #4a3a3a; --wine: #d27a86; --wine-2: #e39aa4; --wine-soft: #3a2126;
    --gold: #d0ae78; --gold-soft: #3a3024; --hit: #7fb58d; --hit-soft: #20312a; --near: #e0b25c; --near-soft: #3a3020;
    --miss: #e08079; --miss-soft: #3c2322; --info: #9fb4c6; --info-soft: #232c33;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px -12px rgba(0,0,0,.6);
  }
}

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--sans); font-size: 15px; line-height: 1.55;
  -webkit-font-smoothing: antialiased; font-feature-settings: 'tnum' 1, 'ss01' 1;
}
a { color: var(--wine); text-decoration: none; }
a:hover { text-decoration: underline; text-underline-offset: 3px; }
h1, h2, h3, .serif { font-family: var(--serif); font-weight: 500; letter-spacing: .005em; color: var(--ink); }
h1 { font-size: 2.6rem; line-height: 1.05; margin: 0 0 .3rem; }
h2 { font-size: 1.65rem; margin: 2.2rem 0 .8rem; }
h3 { font-size: 1.25rem; margin: 1.4rem 0 .5rem; }
.eyebrow { font-size: .72rem; letter-spacing: .16em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.muted { color: var(--muted); }
.small { font-size: .85rem; }
.nowrap { white-space: nowrap; }
hr.rule { border: 0; border-top: 1px solid var(--line); margin: 1.6rem 0; }

/* ---------- Layout ---------- */
.shell { display: grid; grid-template-columns: var(--nav-w) 1fr; min-height: 100vh; }
.nav {
  position: sticky; top: 0; height: 100vh; overflow-y: auto; padding: 28px 18px 24px;
  border-right: 1px solid var(--line); background: var(--paper);
}
.brand { display: flex; align-items: center; gap: 10px; margin: 0 6px 22px; }
.brand .mark { width: 30px; height: 30px; }
.brand .name { font-family: var(--serif); font-size: 1.35rem; line-height: 1; }
.brand .name small { display: block; font-family: var(--sans); font-size: .62rem; letter-spacing: .2em; text-transform: uppercase; color: var(--muted); margin-top: 4px; }
.nav .search { margin: 0 4px 18px; }
.nav-group { margin: 16px 0 4px; padding: 0 10px; }
.nav a.item {
  display: flex; align-items: center; gap: 10px; padding: 7px 10px; border-radius: 8px; color: var(--ink-2);
  font-size: .92rem; text-decoration: none;
}
.nav a.item:hover { background: var(--paper-2); }
.nav a.item.active { background: var(--wine-soft); color: var(--wine); font-weight: 600; }
.nav a.item .badge { margin-left: auto; background: var(--wine); color: #fff; font-size: .7rem; font-weight: 600; border-radius: 999px; padding: 1px 7px; }
.nav a.item svg { width: 17px; height: 17px; flex: none; opacity: .75; }
.nav .foot { margin-top: 28px; padding: 12px 10px 0; border-top: 1px solid var(--line); font-size: .78rem; color: var(--muted); }

main.view { padding: 44px 56px 90px; max-width: 1180px; width: 100%; }
.page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 20px; flex-wrap: wrap; margin-bottom: 26px; }
.page-head .sub { color: var(--muted); margin: 0; }

.topbar { display: none; }
@media (max-width: 900px) {
  .shell { grid-template-columns: 1fr; }
  .nav { position: fixed; z-index: 40; left: 0; top: 0; width: 280px; transform: translateX(-100%); transition: transform .25s ease; box-shadow: var(--shadow); }
  .nav.open { transform: none; }
  .topbar { display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; border-bottom: 1px solid var(--line); background: var(--paper); position: sticky; top: 0; z-index: 30; }
  main.view { padding: 26px 16px 80px; }
  h1 { font-size: 2rem; }
}
.scrim { display: none; }
.nav.open + .scrim { display: block; position: fixed; inset: 0; background: rgba(0,0,0,.25); z-index: 35; }

/* ---------- Superfícies ---------- */
.panel { background: var(--paper); border: 1px solid var(--line); border-radius: var(--radius); padding: 22px 24px; }
.panel + .panel { margin-top: 16px; }
.grid { display: grid; gap: 16px; }
.grid.two { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.grid.three { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.grid.auto { grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); }
@media (max-width: 760px) { .grid.two, .grid.three { grid-template-columns: 1fr; } }

/* Linha de indicadores: tipográfica, não "cards" */
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); border-top: 1px solid var(--line-2); border-bottom: 1px solid var(--line); }
.stat { padding: 18px 18px 16px 0; }
.stat + .stat { padding-left: 18px; border-left: 1px solid var(--line); }
.stat .v { font-family: var(--serif); font-size: 2.6rem; line-height: 1; color: var(--ink); }
.stat .v small { font-size: 1.1rem; color: var(--muted); }
.stat .l { font-size: .78rem; color: var(--muted); margin-top: 6px; letter-spacing: .02em; }
@media (max-width: 600px) { .stat + .stat { border-left: 0; padding-left: 0; } .stats { grid-template-columns: repeat(2, 1fr); } }

/* ---------- Controles ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: 1px solid var(--line-2); background: var(--paper);
  color: var(--ink); padding: 9px 16px; border-radius: 999px; font: 500 .9rem var(--sans); cursor: pointer; text-decoration: none;
  transition: background .15s, border-color .15s, transform .05s;
}
.btn:hover { background: var(--paper-2); text-decoration: none; }
.btn:active { transform: translateY(1px); }
.btn.primary { background: var(--wine); border-color: var(--wine); color: #fff; }
.btn.primary:hover { background: var(--wine-2); }
.btn.ghost { border-color: transparent; background: transparent; }
.btn.small { padding: 5px 12px; font-size: .82rem; }
.btn[disabled] { opacity: .5; cursor: not-allowed; }
.btn-row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }

label.f { display: block; font-size: .8rem; color: var(--muted); margin-bottom: 5px; font-weight: 500; }
input.in, select.in, textarea.in {
  width: 100%; font: .95rem var(--sans); color: var(--ink); background: var(--paper); border: 1px solid var(--line-2);
  border-radius: 8px; padding: 9px 11px; outline: none;
}
textarea.in { min-height: 90px; resize: vertical; line-height: 1.5; }
input.in:focus, select.in:focus, textarea.in:focus { border-color: var(--wine); box-shadow: 0 0 0 3px var(--wine-soft); }
.form-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 14px 18px; }
.form-grid .wide { grid-column: 1 / -1; }
.search-in { position: relative; }
.search-in input { padding-left: 32px; border-radius: 999px; background: var(--bg); }
.search-in svg { position: absolute; left: 11px; top: 50%; transform: translateY(-50%); width: 15px; height: 15px; color: var(--muted); }

/* Segmentado (escalas) */
.seg { display: inline-flex; flex-wrap: wrap; border: 1px solid var(--line-2); border-radius: 999px; padding: 3px; gap: 2px; background: var(--paper); }
.seg button { border: 0; background: transparent; padding: 6px 13px; border-radius: 999px; font: 500 .85rem var(--sans); color: var(--ink-2); cursor: pointer; }
.seg button:hover { background: var(--paper-2); }
.seg button.on { background: var(--wine); color: #fff; }

.chip { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 999px; border: 1px solid var(--line-2); font-size: .82rem; color: var(--ink-2); background: var(--paper); cursor: default; }
button.chip { cursor: pointer; font-family: var(--sans); }
button.chip:hover { border-color: var(--wine); }
.chip.on { background: var(--wine); color: #fff; border-color: var(--wine); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }

/* Selo de origem do dado */
.src { display: inline-flex; align-items: center; gap: 5px; font-size: .68rem; letter-spacing: .04em; padding: 1px 8px; border-radius: 999px; white-space: nowrap; vertical-align: middle; font-weight: 600; }
.src::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: currentColor; opacity: .8; }
.src.usuario, .src.rotulo, .src.planilha { color: var(--hit); background: var(--hit-soft); }
.src.pesquisado, .src.ia_revisada { color: var(--info); background: var(--info-soft); }
.src.ia, .src.ia_nao_verificada { color: var(--near); background: var(--near-soft); }
.src.sistema { color: var(--muted); background: var(--paper-2); }

/* Estados de acerto */
.state { display: inline-flex; align-items: center; gap: 6px; font-weight: 600; font-size: .78rem; letter-spacing: .06em; text-transform: uppercase; padding: 3px 10px; border-radius: 999px; }
.state::before { content: ''; width: 8px; height: 8px; border-radius: 50%; background: currentColor; }
.state.hit { color: var(--hit); background: var(--hit-soft); }
.state.near { color: var(--near); background: var(--near-soft); }
.state.miss { color: var(--miss); background: var(--miss-soft); }
.state.no_ref { color: var(--muted); background: var(--paper-2); }

/* Campo com "Informação não cadastrada" */
.fields { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 16px 24px; }
.field .k { font-size: .75rem; color: var(--muted); letter-spacing: .03em; margin-bottom: 2px; display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.field .v { color: var(--ink); white-space: pre-line; }
.field.wide { grid-column: 1 / -1; }
.missing { color: var(--muted); font-style: italic; font-size: .88rem; }

/* Escala sensorial */
.scales { display: grid; gap: 10px; }
.scale-row { display: grid; grid-template-columns: 120px 1fr 110px; align-items: center; gap: 14px; }
.scale-row .name { font-size: .88rem; color: var(--ink-2); }
.scale-row .val { font-size: .82rem; color: var(--muted); text-align: right; }
.bar { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 3px; height: 10px; }
.bar i { display: block; border-radius: 2px; background: var(--line); }
.bar i.on { background: var(--wine); }
.bar i.band { background: color-mix(in srgb, var(--wine) 45%, transparent); }
@media (max-width: 600px) { .scale-row { grid-template-columns: 90px 1fr; } .scale-row .val { grid-column: 2; text-align: left; } }

/* Listas */
.list { border-top: 1px solid var(--line); }
.list .row { display: grid; grid-template-columns: 1fr auto; gap: 12px; align-items: center; padding: 14px 4px; border-bottom: 1px solid var(--line); text-decoration: none; color: inherit; }
a.row:hover { background: var(--paper); text-decoration: none; }
.row .t { font-family: var(--serif); font-size: 1.2rem; line-height: 1.2; }
.row .m { font-size: .84rem; color: var(--muted); }

table.tbl { width: 100%; border-collapse: collapse; font-size: .9rem; }
.tbl th { text-align: left; font-weight: 600; font-size: .72rem; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); padding: 8px 10px; border-bottom: 1px solid var(--line-2); }
.tbl td { padding: 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
.tbl-wrap { overflow-x: auto; }

.empty { text-align: center; padding: 46px 20px; color: var(--muted); }
.empty .serif { font-size: 1.4rem; color: var(--ink-2); display: block; margin-bottom: 6px; }

/* Garrafinhas */
.cellar { display: grid; grid-template-columns: repeat(auto-fill, minmax(62px, 1fr)); gap: 14px 8px; }
.btl { display: flex; flex-direction: column; align-items: center; gap: 4px; background: none; border: 0; padding: 4px 0; cursor: pointer; color: var(--ink); border-radius: 8px; font-family: var(--sans); }
.btl:hover { background: var(--paper); }
.btl.sel { background: var(--wine-soft); }
.btl svg { width: 34px; height: 78px; }
.btl .n { font-size: .78rem; font-weight: 600; letter-spacing: .03em; }
.btl .w { font-size: .66rem; color: var(--muted); max-width: 70px; text-align: center; line-height: 1.2; }
.btl.dim { opacity: .38; }

/* Progresso/sparkline */
.spark { width: 100%; height: 120px; }
.meter { height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; }
.meter i { display: block; height: 100%; background: var(--wine); }

/* Modal */
.modal-bg { position: fixed; inset: 0; background: rgba(26,18,19,.45); display: flex; align-items: center; justify-content: center; z-index: 80; padding: 16px; animation: fade .15s ease; }
.modal { background: var(--paper); border-radius: 14px; max-width: 720px; width: 100%; max-height: 90vh; overflow: auto; padding: 26px 28px; box-shadow: var(--shadow); }
.modal h2 { margin-top: 0; }
@keyframes fade { from { opacity: 0 } to { opacity: 1 } }

.toast { position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%); background: var(--ink); color: var(--paper); padding: 10px 18px; border-radius: 999px; font-size: .9rem; z-index: 99; box-shadow: var(--shadow); animation: fade .2s; max-width: 90vw; }
.toast.err { background: var(--miss); color: #fff; }
.loading { padding: 60px 0; text-align: center; color: var(--muted); font-family: var(--serif); font-size: 1.2rem; font-style: italic; }
.callout { border-left: 3px solid var(--gold); background: var(--gold-soft); padding: 12px 16px; border-radius: 0 8px 8px 0; font-size: .9rem; color: var(--ink-2); }
.callout.warn { border-color: var(--near); background: var(--near-soft); }

/* Aromas */
.aroma-cats { display: grid; gap: 14px; }
.aroma-cat .h { font-size: .74rem; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); margin-bottom: 6px; font-weight: 600; }

/* ============================================================
   MODO DEGUSTAÇÃO — escuro, imersivo
   ============================================================ */
.tasting-mode {
  --t-bg: #140e0f; --t-ink: #f3e9e1; --t-muted: #a8958c; --t-line: #3a2c2d; --t-card: #1d1516; --t-wine: #c24d5f; --t-gold: #d4b07a;
  position: fixed; inset: 0; z-index: 60; overflow-y: auto; color: var(--t-ink);
  background: radial-gradient(1200px 600px at 50% -10%, #3b1820 0%, transparent 60%), var(--t-bg);
  font-family: var(--sans);
}
.tasting-mode h1, .tasting-mode h2, .tasting-mode h3, .tasting-mode .serif { color: var(--t-ink); }
.tasting-mode .muted { color: var(--t-muted); }
.t-wrap { max-width: 980px; margin: 0 auto; padding: 22px 20px 120px; }
.t-top { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.t-top .eyebrow { color: var(--t-gold); }
.t-exit { color: var(--t-muted); background: none; border: 1px solid var(--t-line); border-radius: 999px; padding: 6px 14px; cursor: pointer; font: .85rem var(--sans); }
.t-exit:hover { color: var(--t-ink); border-color: var(--t-muted); }
.t-rail { display: flex; gap: 10px; justify-content: center; margin: 22px 0 8px; flex-wrap: wrap; }
.t-rail button { background: none; border: 1px solid transparent; border-radius: 12px; padding: 6px 10px 4px; cursor: pointer; color: var(--t-muted); display: flex; flex-direction: column; align-items: center; font: 600 .72rem var(--sans); letter-spacing: .06em; }
.t-rail button svg { width: 18px; height: 42px; }
.t-rail button.cur { border-color: var(--t-line); color: var(--t-ink); background: rgba(255,255,255,.03); }
.t-rail button.done { color: var(--t-gold); }
.t-hero { text-align: center; margin: 18px 0 8px; }
.t-hero svg.big { width: 92px; height: 220px; filter: drop-shadow(0 20px 30px rgba(0,0,0,.5)); animation: rise .6s ease; }
.t-hero .round { font-size: .78rem; letter-spacing: .3em; text-transform: uppercase; color: var(--t-gold); margin-top: 16px; }
.t-hero .num { font-family: var(--serif); font-size: 3.4rem; line-height: 1; margin: 4px 0; }
.t-hero .motto { font-family: var(--serif); font-style: italic; color: var(--t-muted); font-size: 1.25rem; }
@keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
.t-steps { display: flex; justify-content: center; gap: 4px; margin: 26px 0 18px; flex-wrap: wrap; }
.t-steps button { background: none; border: 0; border-bottom: 2px solid var(--t-line); color: var(--t-muted); padding: 8px 12px; cursor: pointer; font: 500 .85rem var(--sans); }
.t-steps button .i { font-family: var(--serif); font-size: 1rem; margin-right: 6px; color: var(--t-gold); }
.t-steps button.cur { color: var(--t-ink); border-color: var(--t-wine); }
.t-card { background: var(--t-card); border: 1px solid var(--t-line); border-radius: 16px; padding: 26px 28px; animation: rise .35s ease; }
.t-card h2 { margin: 0 0 4px; font-size: 1.9rem; }
.t-card .lead { color: var(--t-muted); margin: 0 0 22px; font-family: var(--serif); font-style: italic; font-size: 1.1rem; }
.t-q { margin: 20px 0; }
.t-q > .l { font-size: .74rem; letter-spacing: .14em; text-transform: uppercase; color: var(--t-muted); margin-bottom: 8px; font-weight: 600; }
.tasting-mode .seg { background: transparent; border-color: var(--t-line); }
.tasting-mode .seg button { color: var(--t-muted); }
.tasting-mode .seg button:hover { background: rgba(255,255,255,.05); color: var(--t-ink); }
.tasting-mode .seg button.on { background: var(--t-wine); color: #fff; }
.tasting-mode .chip { background: transparent; border-color: var(--t-line); color: var(--t-muted); }
.tasting-mode button.chip:hover { border-color: var(--t-wine); color: var(--t-ink); }
.tasting-mode .chip.on { background: var(--t-wine); border-color: var(--t-wine); color: #fff; }
.tasting-mode .in { background: #120c0d; border-color: var(--t-line); color: var(--t-ink); }
.tasting-mode .in:focus { border-color: var(--t-wine); box-shadow: 0 0 0 3px rgba(194,77,95,.2); }
.tasting-mode label.f { color: var(--t-muted); }
.tasting-mode .btn { background: transparent; color: var(--t-ink); border-color: var(--t-line); }
.tasting-mode .btn:hover { background: rgba(255,255,255,.05); }
.tasting-mode .btn.primary { background: var(--t-wine); border-color: var(--t-wine); }
.tasting-mode .btn.gold { background: var(--t-gold); border-color: var(--t-gold); color: #1a1213; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; padding: 13px 28px; }
.t-nav { display: flex; justify-content: space-between; margin-top: 22px; gap: 10px; }
.t-summary { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 10px 22px; }
.t-summary .k { font-size: .72rem; letter-spacing: .1em; text-transform: uppercase; color: var(--t-muted); }
.t-summary .v { font-size: .95rem; }
.t-reveal { text-align: center; margin-top: 40px; padding-top: 30px; border-top: 1px solid var(--t-line); }
.tasting-mode .aroma-cat .h { color: var(--t-gold); }
.tasting-mode .modal { background: var(--t-card); color: var(--t-ink); border: 1px solid var(--t-line); }
.tasting-mode .callout { background: rgba(212,176,122,.08); color: var(--t-ink); border-color: var(--t-gold); }

/* Relatório */
.score-hero { text-align: center; padding: 30px 0 10px; }
.score-hero .big { font-family: var(--serif); font-size: 5.4rem; line-height: 1; }
.score-hero .big small { font-size: 1.8rem; color: var(--muted); }
.tally { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px 26px; margin: 18px 0 6px; }
.tally div { font-size: .95rem; }
.tally b { font-family: var(--serif); font-size: 1.3rem; font-weight: 500; }
.reveal-card { border: 1px solid var(--line); border-radius: 14px; background: var(--paper); overflow: hidden; margin-top: 18px; }
.reveal-card .hd { display: grid; grid-template-columns: 56px 1fr auto; gap: 18px; align-items: center; padding: 18px 22px; background: var(--paper-2); border-bottom: 1px solid var(--line); }
.reveal-card .hd svg { width: 40px; height: 92px; }
.reveal-card .bd { padding: 8px 22px 18px; }
.cmp td.hl { font-weight: 600; }
.leaflet-container { font-family: var(--sans); background: var(--paper-2); }
.leaflet-tooltip { font-family: var(--sans); }

/* Foto do rótulo */
.label-scan { border: 1px dashed var(--line-2); border-radius: var(--radius); padding: 14px; margin-bottom: 18px; background: var(--paper-2); }
.label-scan-body { display: flex; gap: 16px; align-items: flex-start; margin-top: 14px; }
.label-thumb { width: 140px; max-height: 220px; object-fit: contain; border-radius: 8px; background: var(--paper); flex: none; }
.label-scan-main { flex: 1; min-width: 0; }
.label-row { display: grid; grid-template-columns: auto 150px minmax(0, 1fr); gap: 4px 10px; align-items: center; padding: 6px 0; border-bottom: 1px solid var(--line); }
.label-row .in { padding: 6px 8px; }
.label-row-name { font-weight: 600; font-size: .85rem; }
.label-row-ev { grid-column: 3; }
.label-text { white-space: pre-wrap; font-size: .8rem; max-height: 220px; overflow: auto; background: var(--paper); padding: 10px; border-radius: 8px; }
@media (max-width: 640px) {
  .label-scan-body { flex-direction: column; }
  .label-thumb { width: 100%; max-height: 200px; }
  .label-row { grid-template-columns: auto minmax(0, 1fr); }
  .label-row > :nth-child(3), .label-row-ev { grid-column: 1 / -1; }
}

/* Login (site) */
.login-screen { position: fixed; inset: 0; z-index: 200; display: grid; place-items: center; padding: 16px; background: var(--bg); }
.login-card { max-width: 420px; width: 100%; text-align: center; background: var(--paper); border: 1px solid var(--line); border-radius: 16px; padding: 32px 24px; }
.login-card .mark { width: 48px; height: 48px; color: var(--ink); }
.login-card h1 { margin: 8px 0 6px; font-size: 2.2rem; }
.login-btn { display: flex; justify-content: center; margin: 22px 0 8px; min-height: 44px; }
.nav-user { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; color: var(--ink-2); font-size: .85rem; }
.nav-user img { width: 26px; height: 26px; border-radius: 50%; }
.nav-user span { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* O que aprender (resultado da degustação) */
.lessons { margin-top: 16px; border-top: 1px solid var(--line); padding-top: 14px; }
.lesson { border-left: 3px solid var(--line-2); padding: 6px 12px; margin: 10px 0; background: var(--paper-2); border-radius: 0 8px 8px 0; }
.lesson p { margin: 4px 0 0; }
.lesson.confusao, .lesson.parentesco { border-left-color: var(--near); }
.lesson.faz-sentido, .lesson.dica { border-left-color: var(--hit); }
.lesson.reconhecer, .lesson.clima, .lesson.regiao { border-left-color: var(--info); }
.ean-box { margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--line); }
.pick-grid { display: flex; flex-wrap: wrap; gap: 8px; }
.pick-btl { min-width: 54px; padding: 8px 10px; border-radius: 999px; border: 1px solid var(--line-2); background: var(--paper); color: var(--ink); font-weight: 600; cursor: pointer; }
.pick-btl.on { background: var(--wine); border-color: var(--wine); color: #fff; }
.quiz-options { display: grid; gap: 10px; }
.quiz-opt { text-align: left; padding: 14px 16px; border-radius: 12px; border: 1px solid var(--line-2); background: var(--paper); color: var(--ink); font: inherit; cursor: pointer; }
.quiz-opt:hover:not(:disabled) { border-color: var(--wine); }
.quiz-opt.right { border-color: var(--hit); background: var(--hit-soft); }
.quiz-opt.wrong { border-color: var(--miss, #b4232c); background: var(--miss-soft, #f6dede); }
.quiz-opt:disabled { cursor: default; }
</style>

<body>
  <div class="topbar">
    <button class="btn ghost small" data-action="nav-toggle" aria-label="Menu">☰</button>
    <span class="serif" style="font-size:1.2rem">Wine Study Lab</span>
    <span style="width:40px"></span>
  </div>
  <div class="shell">
    <nav class="nav" id="nav">
      <div class="brand">
        <svg class="mark" viewBox="0 0 32 32" aria-hidden="true"><path d="M9 3h14c0 7-2 12-7 13-5-1-7-6-7-13Z" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M10.2 8h11.6c-.5 4.3-2.4 6.7-5.8 7.3-3.4-.6-5.3-3-5.8-7.3Z" fill="var(--wine)"/><path d="M16 16v10M11 28h10" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
        <div class="name">Wine Study Lab<small>laboratório de degustação</small></div>
      </div>
      <form class="search search-in" data-action="global-search">
        <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="9" cy="9" r="6"/><path d="m14 14 4 4" stroke-linecap="round"/></svg>
        <input class="in" name="q" placeholder="Buscar uva, vinho, região…" autocomplete="off">
      </form>
      <div id="nav-items"></div>
      <div class="foot" id="nav-foot"></div>
    </nav>
    <div class="scrim" data-action="nav-toggle"></div>
    <main class="view" id="view"><div class="loading">Abrindo a adega…</div></main>
  </div>
  <div id="layer"></div>

  <script>
/* ============================================================
   Núcleo do front-end: API, estado, roteador, utilidades.
   Páginas se registram em Pages[nome] = { render(params), mount?(root, params), actions? }.
   ============================================================ */

/**
 * Chamadas ao servidor.
 * - Site (GitHub Pages): window.WSL_CONFIG.apiUrl → POST para o Apps Script (doPost) com o token da sessão.
 * - Dentro do Apps Script (interface antiga / demonstração): google.script.run.api.
 */
var SessionStore = {
  KEY: 'wsl-session',
  token: function () { try { return localStorage.getItem(SessionStore.KEY) || ''; } catch (e) { return ''; } },
  set: function (t) { try { if (t) localStorage.setItem(SessionStore.KEY, t); else localStorage.removeItem(SessionStore.KEY); } catch (e) { /* sem armazenamento */ } }
};

var API = {
  remote: function () { return !!(window.WSL_CONFIG && window.WSL_CONFIG.apiUrl); },
  // Leituras recentes ficam 60 s na memória do navegador (voltar a uma tela é instantâneo);
  // qualquer gravação limpa tudo, para nunca mostrar dado velho depois de salvar.
  cache: {},
  READS: /^(lookups|dashboard|search|game\.data|settings\.get|regions\.\w+|[a-z]+\.(list|get|batches|status|compare|genealogy|pending))$/,
  TTL: 60000,
  prime: function (method, args, data) { API.cache[method + '|' + JSON.stringify(args || {})] = { t: Date.now(), data: JSON.stringify(data) }; },
  call: function (method, args) {
    var key = method + '|' + JSON.stringify(args || {});
    var isRead = API.READS.test(method);
    if (isRead) {
      var hit = API.cache[key];
      if (hit && Date.now() - hit.t < API.TTL) return Promise.resolve(JSON.parse(hit.data));
    } else if (!/^auth\./.test(method)) API.cache = {};
    return API.raw_(method, args).then(function (data) {
      if (isRead) API.cache[key] = { t: Date.now(), data: JSON.stringify(data) };
      return data;
    });
  },
  raw_: function (method, args) {
    if (API.remote()) return API.post_(method, args);
    return new Promise(function (resolve, reject) {
      google.script.run
        .withSuccessHandler(function (s) {
          var r;
          try { r = JSON.parse(s); } catch (e) { return reject(new Error('Resposta inválida do servidor.')); }
          if (r.ok) resolve(r.data); else reject(new Error(r.error));
        })
        .withFailureHandler(function (e) { reject(e instanceof Error ? e : new Error(String(e && e.message || e))); })
        .api(method, args || {});
    });
  },
  post_: function (method, args) {
    // text/plain evita a checagem prévia de CORS (o Apps Script não responde a OPTIONS).
    return fetch(window.WSL_CONFIG.apiUrl, {
      method: 'POST', redirect: 'follow', headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ method: method, args: args || {}, token: SessionStore.token() })
    }).then(function (res) {
      if (!res.ok) throw new Error('Servidor indisponível (' + res.status + '). Tente de novo.');
      return res.json();
    }, function () { throw new Error('Sem conexão com o servidor.'); }).then(function (r) {
      if (r.ok) return r.data;
      if (r.auth) { SessionStore.set(''); Login.show(r.error); }
      throw new Error(r.error || 'Erro no servidor.');
    });
  }
};

/** Tela de login (só no site). Usa o botão oficial "Fazer login com o Google". */
var Login = {
  shown: false,
  show: function (msg) {
    if (Login.shown) { Login.message(msg); return; }
    Login.shown = true;
    var el = document.createElement('div');
    el.id = 'login';
    el.className = 'login-screen';
    el.innerHTML = '<div class="login-card"><svg class="mark" viewBox="0 0 32 32" aria-hidden="true"><path d="M9 3h14c0 7-2 12-7 13-5-1-7-6-7-13Z" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M10.2 8h11.6c-.5 4.3-2.4 6.7-5.8 7.3-3.4-.6-5.3-3-5.8-7.3Z" fill="var(--wine)"/><path d="M16 16v10M11 28h10" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>' +
      '<h1 class="serif">Wine Study Lab</h1><p class="muted">Laboratório de degustação e estudo de vinhos. Entre com a sua conta Google: suas garrafinhas, degustações e anotações ficam só para você.</p>' +
      '<div id="login-btn" class="login-btn"></div><p class="small muted" id="login-msg"></p>' +
      '<p class="small muted">Não guardamos senha. Usamos só seu nome e e-mail do Google para identificar sua conta.</p></div>';
    document.body.appendChild(el);
    Login.message(msg);
    Login.loadGis_().then(function () {
      google.accounts.id.initialize({ client_id: window.WSL_CONFIG.clientId, callback: Login.onCredential_, ux_mode: 'popup' });
      google.accounts.id.renderButton(document.getElementById('login-btn'), { theme: 'outline', size: 'large', text: 'signin_with', shape: 'pill', locale: 'pt-BR' });
    }).catch(function () { Login.message('Não consegui carregar o login do Google. Verifique a conexão.'); });
  },
  message: function (msg) { var m = document.getElementById('login-msg'); if (m) m.textContent = msg || ''; },
  loadGis_: function () {
    if (window.google && google.accounts && google.accounts.id) return Promise.resolve();
    return new Promise(function (resolve, reject) {
      var sc = document.createElement('script');
      sc.src = 'https://accounts.google.com/gsi/client';
      sc.async = true; sc.onload = resolve; sc.onerror = reject;
      document.head.appendChild(sc);
    });
  },
  onCredential_: function (resp) {
    Login.message('Entrando…');
    API.call('auth.login', { credential: resp.credential, user_agent: navigator.userAgent.slice(0, 200) }).then(function (r) {
      SessionStore.set(r.token);
      var el = document.getElementById('login');
      if (el) el.remove();
      Login.shown = false;
      App.start();
    }).catch(function (e) { Login.message(e.message); });
  },
  logout: function () {
    var t = SessionStore.token();
    SessionStore.set('');
    if (API.remote() && t) {
      fetch(window.WSL_CONFIG.apiUrl, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ method: 'auth.logout', token: t }) }).catch(function () {});
    }
    try { google.accounts.id.disableAutoSelect(); } catch (e) { /* sem GIS */ }
    location.hash = '';
    location.reload();
  }
};

/** País → regiões → sub-regiões (listas em cascata nos formulários). */
var Geo = {
  byId: function (id) { var L = Store.lookups.regions; for (var i = 0; i < L.length; i++) if (L[i].id === id) return L[i]; return null; },
  isSub: function (id) { var r = id && Geo.byId(id); return !!(r && r.parent_id); },
  top: function (id) { var r = id && Geo.byId(id); return r ? (r.parent_id || r.id) : ''; },
  regions: function (countryId) {
    return Store.lookups.regions.filter(function (r) { return !r.parent_id && (!countryId || r.country_id === countryId); });
  },
  subs: function (regionId, countryId) {
    return Store.lookups.regions.filter(function (r) { return r.parent_id && (regionId ? r.parent_id === regionId : (!countryId || r.country_id === countryId)); });
  },
  label_: function (r, withCountry) { return { id: r.id, name: r.name + (withCountry ? ' (' + Store.name('countries', r.country_id) + ')' : '') }; },
  regionOptions: function (countryId, sel) {
    var regs = Geo.regions(countryId);
    return Components.options(regs.map(function (r) { return Geo.label_(r, !countryId); }), sel, regs.length ? '—' : 'Nenhuma região cadastrada');
  },
  subOptions: function (regionId, sel, countryId) {
    if (!regionId) return '<option value="">Escolha a região primeiro</option>';
    var subs = Geo.subs(regionId, countryId);
    return Components.options(subs.map(function (r) { return Geo.label_(r, false); }), sel, subs.length ? '—' : 'Sem sub-regiões cadastradas');
  }
};

/** Estado compartilhado: dados de apoio (listas para selects) carregados uma vez. */
var Store = {
  lookups: null,
  app: {},
  dashboard: null,
  refreshLookups: function () {
    return API.call('lookups').then(function (l) { Store.lookups = l; return l; });
  },
  name: function (kind, id) {
    var list = Store.lookups && Store.lookups[kind] || [];
    for (var i = 0; i < list.length; i++) if (list[i].id === id) return list[i].name;
    return '';
  },
  scale: function (name) { return (Store.lookups && Store.lookups.scales[name]) || []; },
  scaleLabel: function (name, key) {
    var s = Store.scale(name);
    for (var i = 0; i < s.length; i++) if (s[i].key === key) return s[i].label;
    return key || '';
  }
};

var Pages = {};

var Router = {
  routes: [
    [/^\/?$/, 'dashboard'],
    [/^\/dashboard$/, 'dashboard'],
    [/^\/busca$/, 'search'],
    [/^\/vinhos$/, 'wines'],
    [/^\/vinhos\/novo$/, 'wineEdit'],
    [/^\/vinhos\/([A-Z]{3}_[0-9A-Z]+)\/editar$/, 'wineEdit', ['id']],
    [/^\/vinhos\/([A-Z]{3}_[0-9A-Z]+)$/, 'wine', ['id']],
    [/^\/uvas$/, 'grapes'],
    [/^\/uvas\/nova$/, 'grapeEdit'],
    [/^\/uvas\/comparar$/, 'grapeCompare'],
    [/^\/genealogia$/, 'genealogy'],
    [/^\/regioes$/, 'regions'],
    [/^\/regioes\/pais\/([A-Z]{3}_[0-9A-Z]+)$/, 'country', ['id']],
    [/^\/regioes\/([A-Z]{3}_[0-9A-Z]+)$/, 'region', ['id']],
    [/^\/uvas\/([A-Z]{3}_[0-9A-Z]+)\/editar$/, 'grapeEdit', ['id']],
    [/^\/uvas\/([A-Z]{3}_[0-9A-Z]+)$/, 'grape', ['id']],
    [/^\/adega$/, 'cellar'],
    [/^\/adega\/fracionar$/, 'fractionate'],
    [/^\/degustacao\/nova$/, 'tastingNew'],
    [/^\/degustacao\/historico$/, 'tastingHistory'],
    [/^\/degustacao\/([A-Z]{3}_[0-9A-Z]+)\/resultado$/, 'tastingReport', ['id']],
    [/^\/degustacao\/([A-Z]{3}_[0-9A-Z]+)$/, 'tastingPlay', ['id']],
    [/^\/caderno$/, 'notes'],
    [/^\/usuarios$/, 'users'],
    [/^\/quiz$/, 'quiz'],
    [/^\/config$/, 'settings'],
    [/^\/revisao$/, 'review']
  ],
  current: null,
  parse: function () {
    var h = Router.hash || '';
    var parts = h.split('?');
    var path = parts[0] || '/';
    var query = {};
    (parts[1] || '').split('&').forEach(function (kv) {
      if (!kv) return;
      var p = kv.split('=');
      query[decodeURIComponent(p[0])] = decodeURIComponent((p[1] || '').replace(/\+/g, ' '));
    });
    for (var i = 0; i < Router.routes.length; i++) {
      var r = Router.routes[i], m = path.match(r[0]);
      if (m) {
        var params = { query: query };
        (r[2] || []).forEach(function (k, j) { params[k] = m[j + 1]; });
        return { page: r[1], params: params, path: path };
      }
    }
    return { page: 'dashboard', params: { query: query }, path: '/' };
  },
  // No Apps Script o app roda num iframe: a navegação usa google.script.history
  // (atualiza a URL da janela principal e o botão Voltar). Fora dele, usa o hash.
  hash: '/',
  gas: !!(window.google && google.script && google.script.history),
  go: function (path) {
    if (Router.gas) {
      Router.hash = path;
      google.script.history.push({ path: path }, null, path);
      Router.render();
    } else {
      location.hash = '#' + path;
    }
  },
  init: function () {
    if (Router.gas) {
      google.script.history.setChangeHandler(function (e) {
        Router.hash = (e.state && e.state.path) || (e.location && e.location.hash) || '/';
        Router.render();
      });
      google.script.url.getLocation(function (loc) {
        Router.hash = loc.hash || '/';
        Router.render();
      });
    } else {
      var sync = function () { Router.hash = location.hash.replace(/^#/, '') || '/'; Router.render(); };
      window.addEventListener('hashchange', sync);
      sync();
    }
  },
  render: function () {
    var route = Router.parse();
    var page = Pages[route.page];
    Router.current = { name: route.page, page: page, params: route.params };
    UI.closeLayer();
    UI.closeModal();
    Nav.highlight(route.path);
    document.getElementById('nav').classList.remove('open');
    var view = document.getElementById('view');
    var token = Router.token = (Router.token || 0) + 1;
    if (!page.fullscreen) view.innerHTML = '<div class="loading">Carregando…</div>';
    Promise.resolve(page.render(route.params)).then(function (html) {
      if (token !== Router.token) return;           // o usuário navegou antes de terminar
      if (page.fullscreen) { UI.openLayer(html); }
      else { view.innerHTML = html; window.scrollTo(0, 0); }
      if (page.mount) page.mount(page.fullscreen ? document.getElementById('layer') : view, route.params);
    }).catch(function (e) {
      if (token !== Router.token) return;
      view.innerHTML = '<div class="empty"><span class="serif">Algo deu errado.</span>' + esc(e.message) + '</div>';
    });
  }
};

/* ---------- Utilidades ---------- */
function esc(s) {
  if (s === null || s === undefined) return '';
  return String(s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; });
}
function blank(v) { return v === null || v === undefined || String(v).trim() === '' || (Array.isArray(v) && !v.length); }
function fmtDate(iso, withTime) {
  if (!iso) return '';
  var d = new Date(iso);
  if (isNaN(d)) return esc(iso);
  var s = d.toLocaleDateString('pt-BR', { day: '2-digit', month: 'short', year: 'numeric' });
  return withTime ? s + ' · ' + d.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' }) : s;
}
function fmtNum(n, digits) {
  if (n === null || n === undefined || n === '') return '';
  return Number(n).toLocaleString('pt-BR', { maximumFractionDigits: digits === undefined ? 1 : digits });
}
function plural(n, one, many) { return n + ' ' + (n === 1 ? one : many); }
function formData(form) {
  var o = {};
  Array.prototype.forEach.call(form.elements, function (el) {
    if (!el.name || el.disabled) return;
    if (el.type === 'checkbox') o[el.name] = el.checked;
    else if (el.type === 'radio') { if (el.checked) o[el.name] = el.value; }
    else if (el.multiple) o[el.name] = Array.prototype.filter.call(el.options, function (op) { return op.selected; }).map(function (op) { return op.value; });
    else o[el.name] = el.value;
  });
  return o;
}

var UI = {
  toast: function (msg, isErr) {
    var t = document.createElement('div');
    t.className = 'toast' + (isErr ? ' err' : '');
    t.textContent = msg;
    document.body.appendChild(t);
    setTimeout(function () { t.remove(); }, isErr ? 6000 : 2800);
  },
  error: function (e) { UI.toast(e && e.message ? e.message : String(e), true); },
  openLayer: function (html) {
    var l = document.getElementById('layer');
    l.innerHTML = html;
    document.body.style.overflow = 'hidden';
  },
  closeLayer: function () {
    document.getElementById('layer').innerHTML = '';
    document.body.style.overflow = '';
  },
  /** Modal simples. Retorna o elemento; fecha com UI.closeModal(). */
  modal: function (html, opts) {
    UI.closeModal();
    var bg = document.createElement('div');
    bg.className = 'modal-bg';
    bg.id = 'modal';
    bg.innerHTML = '<div class="modal" role="dialog" aria-modal="true">' + html + '</div>';
    bg.addEventListener('click', function (e) { if (e.target === bg && !(opts && opts.sticky)) UI.closeModal(); });
    var host = document.querySelector('.tasting-mode') || document.body;
    host.appendChild(bg);
    return bg;
  },
  closeModal: function () { var m = document.getElementById('modal'); if (m) m.remove(); },
  confirm: function (title, text, okLabel) {
    return new Promise(function (resolve) {
      var m = UI.modal('<h2>' + esc(title) + '</h2><p>' + esc(text || '') + '</p>' +
        '<div class="btn-row" style="justify-content:flex-end;margin-top:22px">' +
        '<button class="btn" data-x="no">Cancelar</button><button class="btn primary" data-x="yes">' + esc(okLabel || 'Confirmar') + '</button></div>', { sticky: true });
      m.addEventListener('click', function (e) {

var GlobalActions = {
  'nav-toggle': function () { document.getElementById('nav').classList.toggle('open'); },
  'go': function (el) { Router.go(el.getAttribute('data-to')); },
  'close-modal': function () { UI.closeModal(); },
  'logout': function () { Login.logout(); }
};

function dispatch(el, ev) {
  var name = el.getAttribute('data-action');
  var page = Router.current && Router.current.page;
  var fn = (page && page.actions && page.actions[name]) || GlobalActions[name] || (Components.actions && Components.actions[name]);
  if (!fn) return false;
  ev.preventDefault();
  var r = fn(el, ev);
  if (r && r.catch) r.catch(UI.error);
  return true;
}

document.addEventListener('click', function (ev) {
  // Links internos ("#/vinhos") passam pelo roteador em vez de navegar a página.
  var link = ev.target.closest('a[href^="#/"]');
  if (link && !ev.metaKey && !ev.ctrlKey) {
    ev.preventDefault();
    Router.go(link.getAttribute('href').slice(1));
    return;
  }
  var el = ev.target.closest('[data-action]');
  if (el && el.tagName !== 'FORM') dispatch(el, ev);
});
document.addEventListener('submit', function (ev) {
  var el = ev.target.closest('form[data-action]');
  if (el) dispatch(el, ev);
});
document.addEventListener('change', function (ev) {
  var el = ev.target.closest('[data-change]');
  if (!el) return;
  var name = el.getAttribute('data-change');
  var page = Router.current && Router.current.page;
  var fn = page && page.actions && page.actions[name];
  if (fn) { var r = fn(el, ev); if (r && r.catch) r.catch(UI.error); }
});
document.addEventListener('input', function (ev) {
  var el = ev.target.closest('[data-input]');
  if (!el) return;
  var name = el.getAttribute('data-input');
  var page = Router.current && Router.current.page;
  var fn = (page && page.actions && page.actions[name]) || (Components.actions && Components.actions[name]);
  if (fn) fn(el, ev);
});

GlobalActions['global-search'] = function (form) {
  var q = form.q.value.trim();
  if (q) Router.go('/busca?q=' + encodeURIComponent(q));
};

var App = {

      document.getElementById('view').innerHTML = '<div class="empty"><span class="serif">Não foi possível abrir o laboratório.</span>' + esc(e.message) + '</div>';
    });
  }
};

        '<p class="sub">' + (c.tastings ? 'Seu caderno de degustação tem ' + plural(c.tastings, 'sessão revelada', 'sessões reveladas') + '.' : 'Seu laboratório está pronto para a primeira degustação às cegas.') + '</p></div>' +
        '<div class="btn-row"><a class="btn primary" href="#/degustacao/nova">Nova degustação às cegas</a></div></div>';

      if (d.in_progress.length) {
        var t = d.in_progress[0];
        html += '<div class="callout" style="margin-bottom:22px">Degustação em andamento: <b>' + esc(t.title) + '</b> · ' + fmtDate(t.date) +
          ' — <a href="#/degustacao/' + t.id + '">continuar</a></div>';
      }

      html += '<div class="stats">' +
        stat(c.wines, 'vinhos estudados') +
        stat(c.grapes, 'uvas no caderno') +
        stat(c.regions, 'regiões estudadas') +
        stat(c.tastings, 'degustações') +
        stat(d.avg_score === null ? '—' : fmtNum(d.avg_score, 0) + '<small>%</small>', 'precisão média') +
        stat(c.bottles_available, 'garrafinhas disponíveis') +
        '</div>';

      html += '<div class="grid two" style="margin-top:34px">';
      html += '<section><h2 style="margin-top:0">Onde você está</h2>';
      if (d.groups.length) {
        var G = { identificacao: 'Identificação (uva, região, país, safra)', nariz: 'Aromas', estrutura: 'Estrutura em boca', visual: 'Visual' };
        html += '<div class="grid two" style="margin-bottom:18px">' +
          '<div><div class="eyebrow">Melhor categoria</div><div class="serif" style="font-size:1.6rem">' + esc(G[d.best.group] || d.best.group) + '</div><div class="muted small">' + fmtNum(d.best.rate, 0) + '% de aproveitamento</div></div>' +
          (d.worst ? '<div><div class="eyebrow">Preciso estudar</div><div class="serif" style="font-size:1.6rem">' + esc(G[d.worst.group] || d.worst.group) + '</div><div class="muted small">' + fmtNum(d.worst.rate, 0) + '% de aproveitamento</div></div>' : '') +
          '</div>';
        html += '<div class="scales">' + d.criteria.map(function (a) {
          return '<div class="scale-row"><div class="name">' + esc(a.label) + '</div>' + Components.meter(a.rate) + '<div class="val">' + fmtNum(a.rate, 0) + '% · ' + a.total + '</div></div>';
        }).join('') + '</div>';
      } else {
        html += '<p class="muted">Seus pontos fortes e fracos aparecem aqui depois da primeira degustação revelada. ' +
          'Eles são calculados a partir de cada critério corrigido — uva, região, acidez, aromas…</p>';
      }
      html += '</section>';

      html += '<section><h2 style="margin-top:0">Evolução</h2>';
      if (d.series.length >= 2) html += Components.sparkline(d.series) + '<div class="muted small">Pontuação por degustação (0–100), em ordem cronológica.</div>';
      else html += '<p class="muted">O gráfico de evolução aparece a partir da segunda degustação revelada.</p>';
      html += '<h3>Últimas degustações</h3>';
      if (d.recent.length) {
        html += '<div class="list">' + d.recent.map(function (t) {
          var href = t.status === 'revelada' ? '#/degustacao/' + t.id + '/resultado' : '#/degustacao/' + t.id;
          return '<a class="row" href="' + href + '"><div><div class="t">' + esc(t.title) + '</div><div class="m">' + fmtDate(t.date) + ' · ' + plural(t.count, 'vinho', 'vinhos') + '</div></div>' +
            '<div class="serif" style="font-size:1.4rem">' + (t.status === 'revelada' ? fmtNum(t.score, 0) : '<span class="small muted">' + statusLabel(t.status) + '</span>') + '</div></a>';
        }).join('') + '</div>';
      } else {
        html += '<p class="muted">Nenhuma degustação ainda.</p>';
      }
      html += '</section></div>';

      if (!c.wines) {
        html += '<div class="callout warn" style="margin-top:30px">Ainda não há vinhos no sistema. Vá em <a href="#/config">Configurações</a> e clique em <b>Sincronizar</b> para importar sua planilha.</div>';
      }
      return html;
    });

    function stat(v, l) { return '<div class="stat"><div class="v">' + v + '</div><div class="l">' + esc(l) + '</div></div>'; }
  }
};

function statusLabel(s) {
  return { em_andamento: 'em andamento', aguardando_revelacao: 'aguardando revelação', revelada: 'revelada', cancelada: 'cancelada' }[s] || s;
}

Pages.search = {
  render: function (p) {
    var q = p.query.q || '';
    document.querySelector('.nav .search input').value = q;
    return API.call('search', { q: q }).then(function (hits) {
      var TYPES = { grape: ['Uvas', '#/uvas/'], wine: ['Vinhos', '#/vinhos/'], region: ['Regiões', null], country: ['Países', null],
        producer: ['Produtores', null], appellation: ['Denominações', null], aroma: ['Aromas', null], note: ['Notas', '#/caderno?id='], tasting: ['Degustações', '#/degustacao/'] };
      var html = '<div class="page-head"><div><div class="eyebrow">Busca</div><h1>“' + esc(q) + '”</h1><p class="sub">' + plural(hits.length, 'resultado', 'resultados') + '</p></div></div>';
      if (!hits.length) return html + Components.empty('Nada encontrado.', 'Tente outro termo — a busca ignora acentos e maiúsculas.');
      var by = {};
      hits.forEach(function (h) { (by[h.type] = by[h.type] || []).push(h); });
      Object.keys(TYPES).forEach(function (t) {
        if (!by[t]) return;
        html += '<h2>' + TYPES[t][0] + '</h2><div class="list">' + by[t].map(function (h) {
          var inner = '<div><div class="t">' + esc(h.title) + '</div><div class="m">' + esc(h.why) + '</div></div><div></div>';
          return TYPES[t][1] ? '<a class="row" href="' + TYPES[t][1] + h.id + '">' + inner + '</a>' : '<div class="row">' + inner + '</div>';
        }).join('') + '</div>';
      });
      return html;
    });
  }
};

Pages.settings = {

        '<p class="muted" style="margin-top:14px">Regiões: ' + (enc.region_packs || []).map(function (p) { return esc(p.country) + ' (' + p.regions + ' regiões, v' + p.version + ')'; }).join(' · ') +
        ' — com sub-regiões, castas, produtores e mapas. Fontes: Wikipedia, contornos ISTAT/openpolis (Itália), IGN/Etalab (França, aproximados por departamento), click_that_hood (Espanha, Áustria; Portugal aproximado por distrito), GADM (Alemanha, aproximada por distrito), Natural Earth (demais países, por província), pontos do OpenStreetMap.</p>' +
        '<button class="btn" data-action="seed-regions">Reimportar regiões</button></section>';

      html += '<section class="panel"><h2 style="margin-top:0">Pontuação da degustação</h2>' +

    function setting(key, label, value, hint) {
      return '<form data-action="save-setting"><input type="hidden" name="key" value="' + key + '"><label class="f">' + esc(label) + '</label>' +

        '<div class="small muted" style="margin-top:4px">' + esc(hint) + '</div></form>';
    }
    function compareLabel(r) {
      var p = r.params || {};
      switch (r.compare) {
        case 'hypothesis': return '1º palpite = acerto; palpite secundário = próximo';
        case 'hierarchical': return 'mesma região = acerto; mesmo país = próximo';
        case 'exact': return 'exato';
        case 'numeric': return '±' + fmtNum(p.hit) + ' acerto; ±' + fmtNum(p.near) + ' próximo';
        case 'ordinal': return 'mesmo nível = acerto; ' + (p.near || 1) + ' nível = próximo';
        case 'set_overlap': return '≥' + Math.round((p.hit || .6) * 100) + '% acerto; ≥' + Math.round((p.near || .3) * 100) + '% próximo';
      }
      return r.compare;

      }).catch(function (e) { UI.busy(btn, false); throw e; });
    },
    'routine-run': function (btn) {
      UI.busy(btn, true);
      return API.call('routine.run').then(function (r) {
        UI.toast(r.checked + ' vinho(s) verificado(s): ' + r.barcode_fields + ' campo(s) pelo código, ' + r.ai_proposals + ' sugestão(ões) da IA para revisar.');
        Router.render();
      }).catch(function (e) { UI.busy(btn, false); throw e; });
    },
    'sync': function (btn) {
      UI.busy(btn, true);
      return API.call('sync.run').then(function (r) {
        UI.toast('Sincronizado: ' + r.stats.wines_new + ' vinhos novos, ' + r.stats.bottles_new + ' garrafinhas novas.');
        return Store.refreshLookups();
      }).then(Router.render).catch(function (e) { UI.busy(btn, false); UI.error(e); });
    },
    'sum-weights': function () {
      var f = document.querySelector('form[data-action="save-rules"]');
      var t = 0;
      f.querySelectorAll('input[type=number]').forEach(function (i) {
        var id = i.name.slice(2);
        if (f.querySelector('[name="a_' + id + '"]').checked) t += Number(i.value || 0);
      });
      document.getElementById('w-total').textContent = t;
    },
    'save-rules': function (form) {
      var rules = [];
      form.querySelectorAll('input[type=number]').forEach(function (i) {
        var id = i.name.slice(2);
        rules.push({ id: id, weight: i.value, active: form.querySelector('[name="a_' + id + '"]').checked });
      });
      return API.call('settings.saveRules', { rules: rules }).then(function () {
        UI.toast('Pesos salvos. Degustações já reveladas mantêm os pesos da época.');
        return Store.refreshLookups();
      });
    },
    'seed-regions': function (btn) {
      UI.busy(btn, true);
      var sum = { regions_new: 0, subregions_new: 0, producers_new: 0 };
      function step(resume) {
        return API.call('seed.regions', { resume: resume }).then(function (r) {
          Object.keys(sum).forEach(function (k) { sum[k] += r[k] || 0; });
          if (r.remaining > 0) { UI.toast('Importando… faltam ' + r.remaining + ' países.'); return step(true); }
          Store.lookups = r.lookups;
          UI.toast('Regiões: ' + sum.regions_new + ' novas, ' + sum.subregions_new + ' sub-regiões novas, ' + sum.producers_new + ' produtores novos.');
          UI.busy(btn, false);
        });
      }
      return step(false).catch(function (e) { UI.busy(btn, false); throw e; });
    },
    'seed-grapes': function (btn) {
      UI.busy(btn, true);

function ruleLabel(criterion) {
  var r = (Store.lookups.rules || []).filter(function (x) { return x.criterion === criterion; })[0];
  return r ? r.label : criterion;
}

/** Editor de perfil sensorial (vinho = gabarito; uva = perfil típico, aceita faixas). */
var ProfileEditor = {
  open: function (entityType, entityId, profile, aromas, done) {
    profile = profile || {};
    var isGrape = entityType === 'grape';
    var fields = Components.PALATE.concat([['color_intensity', 'Intensidade da cor'], ['color_hue', 'Tonalidade']]);
    var html = '<h2>' + (isGrape ? 'Perfil típico da uva' : 'Perfil de referência (gabarito)') + '</h2>' +
      '<p class="muted small">' + (isGrape ? 'Selecione um nível, ou dois para indicar uma faixa (ex.: média a alta).' : 'Selecione um nível por característica. Deixe em branco o que você não souber.') + '</p>' +
      '<form data-profile>' + fields.map(function (f) {
        var v = profile[f[0]] || '';
        var sel = String(v).split('..').filter(Boolean);
        return '<div style="margin:12px 0"><label class="f">' + esc(f[1]) + '</label>' +
          Components.seg(f[0], f[0], isGrape ? sel : sel[0], { multi: isGrape }) + '</div>';
      }).join('') +
      '<div class="form-grid" style="margin-top:16px">' +
      '<div class="wide"><label class="f">Visual</label><textarea class="in" name="visual_text">' + esc(profile.visual_text || '') + '</textarea></div>' +
      '<div class="wide"><label class="f">Nariz</label><textarea class="in" name="nose_text">' + esc(profile.nose_text || '') + '</textarea></div>' +
      '<div class="wide"><label class="f">Boca</label><textarea class="in" name="palate_text">' + esc(profile.palate_text || '') + '</textarea></div>' +
      '</div><h3>Aromas</h3>' + Components.aromaPicker('aromas', (aromas || []).map(function (a) { return a.id; })) +
      '<div class="form-grid" style="margin-top:18px">' +
      '<div><label class="f">Origem destes dados</label><select class="in" name="source">' +
      Components.options([{ v: 'usuario', t: 'Minha avaliação' }, { v: 'rotulo', t: 'Rótulo / ficha técnica do produtor' }, { v: 'pesquisado', t: 'Pesquisado (fonte citada)' }, { v: 'ia_revisada', t: 'IA, revisado por mim' }, { v: 'ia_nao_verificada', t: 'Não verificado' }],
        profile.source && profile.source !== 'ia_nao_verificada' ? profile.source : 'usuario') + '</select></div>' +
      '<div><label class="f">Referência (link, livro, ficha…)</label><input class="in" name="source_ref" value="' + esc(profile.source_ref || '') + '"></div>' +
      '</div><div class="btn-row" style="justify-content:flex-end;margin-top:22px"><button type="button" class="btn" data-action="close-modal">Cancelar</button><button class="btn primary">Salvar perfil</button></div></form>';
    var m = UI.modal(html, { sticky: true });
    // Nas uvas, no máximo 2 níveis por escala (faixa).
    m.addEventListener('segchange', function (e) {
      var seg = e.target;
      if (!isGrape) return;
      var on = seg.querySelectorAll('button.on');
      if (on.length > 2) on[0].classList.remove('on');
    });
    m.querySelector('form').addEventListener('submit', function (e) {
      e.preventDefault();
      var form = e.target;
      var data = formData(form);
      fields.forEach(function (f) {
        var v = Components.readSeg(form, f[0]);
        if (Array.isArray(v)) {
          var levels = Store.scale(f[0]).map(function (l) { return l.key; });
          v.sort(function (a, b) { return levels.indexOf(a) - levels.indexOf(b); });
          data[f[0]] = v.length === 2 ? v[0] + '..' + v[1] : (v[0] || '');
        } else data[f[0]] = v;
      });
      data.aroma_ids = Components.readAromas(form);
      var btn = form.querySelector('button.primary');
      UI.busy(btn, true);
      API.call('profiles.save', { entity_type: entityType, entity_id: entityId, profile: data }).then(function () {
        UI.closeModal();
        UI.toast('Perfil salvo.');
        done && done();
      }).catch(function (err) { UI.busy(btn, false); UI.error(err); });
    });
  }
};

        inp('aging', 'Estágio / maturação', w.aging) + inp('oak', 'Madeira', w.oak) + inp('aging_time', 'Tempo de envelhecimento', w.aging_time) +

        '</div><h3>Estudo</h3><div class="form-grid">' +

    if (form && form.elements.country) {
      var key = function (s) { return String(s || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().trim(); };
      var find = function (list, name) { var k = key(name); for (var i = 0; i < list.length; i++) if (key(list[i].name) === k) return list[i]; return null; };
      var opt = function (r) { return '<option value="' + esc(r.name) + '">'; };

        var country = find(Store.lookups.countries, form.elements.country.value);
        var regs = Geo.regions(country ? country.id : '');
        document.getElementById('dl-regions').innerHTML = regs.map(opt).join('');
        var region = find(regs, form.elements.region.value);
        document.getElementById('dl-subregions').innerHTML = (region ? Geo.subs(region.id) : Geo.subs('', country ? country.id : '')).map(opt).join('');
      };
      form.elements.country.addEventListener('input', refresh);
      form.elements.region.addEventListener('input', refresh);
      form.addEventListener('labelapplied', refresh);
      refresh();
    }
    // Campo preenchido pela foto e depois editado à mão volta a ser "informado por você".
    if (form) form.addEventListener('input', function (e) { LabelScan.touched(form, e.target); });
    // Enter no campo do código busca a ficha (em vez de salvar o formulário).
    if (form) form.addEventListener('keydown', function (e) {
      if (e.key === 'Enter' && e.target.id === 'ean-code') { e.preventDefault(); LabelScan.eanSearch().catch(UI.error); }
    });
  },
  actions: {
    'label-photo': function (input) { return LabelScan.photo(input); },
    'label-apply': function (btn) { LabelScan.apply(btn); },
    'label-ai': function (btn) { return LabelScan.ai(btn); },
    'label-name': function (btn) { LabelScan.setName(btn); },
    'ean-open': function () { LabelScan.eanOpen(); },
    'ean-search': function (btn) { return LabelScan.eanSearch(btn); },
    'ean-photo': function (input) { return LabelScan.eanPhoto(input); },
    'add-grape': function () { document.getElementById('grape-rows').insertAdjacentHTML('beforeend', grapeRow({})); },
    'remove-grape': function (btn) { btn.closest('.grape-row').remove(); },
    'save': function (form) {
      var d = formData(form);
      var grapes = [];
      form.querySelectorAll('.grape-row').forEach(function (r) {
        var name = r.querySelector('[data-g=name]').value.trim();
        if (name) grapes.push({ name: name, percent: r.querySelector('[data-g=percent]').value, source: r.getAttribute('data-source') || '' });
      });
      Object.keys(d).forEach(function (k) { if (/^g_/.test(k)) delete d[k]; });
      d.grapes = grapes;
      d.origins = Pages.wineEdit.scan.origins;
      d.refs = Pages.wineEdit.scan.refs;
      if (!d.id) delete d.id;
      var btn = form.querySelector('button.primary');
      UI.busy(btn, true);
      return API.call('wines.save', { wine: d }).then(function (w) {
        UI.toast('Vinho salvo.');
        // A resposta já traz o vinho completo: abre direto, e as listas atualizam em segundo plano.
        API.prime('wines.get', { id: w.id }, w);
        Store.refreshLookups().catch(function () {});
        Router.go('/vinhos/' + w.id);
      }).catch(function (e) { UI.busy(btn, false); throw e; });
    }
  }
};
