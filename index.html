    var links = (n.links || []).map(function (l) { return { entity_type: l.entity_type, entity_id: l.entity_id, name: l.name }; });
    function drawLinks() {
      m.querySelector('#lk-list').innerHTML = links.map(function (l, i) { return '<button type="button" class="chip" data-i="' + i + '">' + esc(l.name) + ' ✕</button>'; }).join('');
    }
    function fillItems() {
      var t = m.querySelector('#lk-type').value;
      var list = linkOpts.filter(function (o) { return o[0] === t; })[0][2];
      m.querySelector('#lk-item').innerHTML = Components.options(list, '');
    }
    var ready = Pages.notes.wines ? Promise.resolve() : API.call('wines.list').then(function (ws) {
      Pages.notes.wines = ws.map(function (w) { return { id: w.id, name: w.name + (w.vintage ? ' ' + w.vintage : '') }; });
      linkOpts[0][2] = Pages.notes.wines;
    });
    ready.then(fillItems);
    drawLinks();
    m.querySelector('#lk-type').addEventListener('change', fillItems);
    m.querySelector('#lk-add').addEventListener('click', function () {
      var sel = m.querySelector('#lk-item');
      if (!sel.value) return;
      links.push({ entity_type: m.querySelector('#lk-type').value, entity_id: sel.value, name: sel.options[sel.selectedIndex].text });
      drawLinks();
    });
    m.querySelector('#lk-list').addEventListener('click', function (e) {
      var b = e.target.closest('[data-i]');
      if (b) { links.splice(+b.getAttribute('data-i'), 1); drawLinks(); }
    });
    var del = m.querySelector('#note-del');
    if (del) del.addEventListener('click', function () {
      UI.confirm('Excluir nota?', 'Esta ação não pode ser desfeita.', 'Excluir').then(function (ok) {
        if (ok) API.call('notes.remove', { id: n.id }).then(function () { UI.toast('Nota excluída.'); Router.render(); }).catch(UI.error);
      });
    });
    m.querySelector('form').addEventListener('submit', function (e) {
      e.preventDefault();
      var d = formData(e.target);
      d.id = n.id;
      d.links = links.map(function (l) { return { entity_type: l.entity_type, entity_id: l.entity_id }; });
      API.call('notes.save', { note: d }).then(function () { UI.closeModal(); UI.toast('Nota salva.'); Router.render(); }).catch(UI.error);
    });
  }
};
</script>

  <script>
/* ============================== FOTO DO RÓTULO ==============================
 * No formulário de vinho: tirar/escolher a foto → leitura grátis (OCR do Google + enciclopédia)
 * → revisão das sugestões → aplicar. Opcional: IA lê a foto e busca a ficha técnica na web.
 * Cada campo aplicado guarda a origem ("rótulo", "pesquisado" ou "IA · não verificado");
 * se você editar o campo depois, ele passa a ser "informado por você".
 */
var LabelScan = (function () {
  var LABELS = {
    name: 'Nome', producer: 'Produtor', country: 'País', region: 'Região', subregion: 'Sub-região', appellation: 'Denominação',
    vintage: 'Safra', abv: 'Teor alcoólico (%)', color: 'Cor', type: 'Tipo', classification: 'Classificação',
    residual_sugar: 'Açúcar residual', acidity_gl: 'Acidez total', production_method: 'Método de produção',
    aging: 'Estágio / maturação', oak: 'Madeira', aging_time: 'Tempo de envelhecimento', serving_temp: 'Temperatura de serviço',
    pairing: 'Harmonização', curiosities: 'Curiosidades'
  };
  var ORDER = Object.keys(LABELS);
  var MAX_SIDE = 1600;
  var photo = null;   // { b64, mime, dataUrl, text }

  function state() { return Pages.wineEdit.scan; }
  function form() { return document.querySelector('form[data-action=save]'); }

  function html() {
    photo = null;
    return '<section id="label-scan" class="label-scan">' +
      '<div class="btn-row">' +
      '<label class="btn primary">📷&nbsp; Fotografar rótulo<input type="file" accept="image/*" capture="environment" data-change="label-photo" hidden></label>' +
      '<label class="btn">Escolher imagem<input type="file" accept="image/*" data-change="label-photo" hidden></label>' +
      '<button type="button" class="btn" data-action="ean-open">▥&nbsp; Código de barras</button>' +
      '<span class="small muted">Leituras grátis. A foto não fica guardada.</span></div>' +
      '<div id="ean-box" class="ean-box" hidden><div class="btn-row">' +
      '<input class="in" id="ean-code" inputmode="numeric" autocomplete="off" placeholder="EAN / UPC (8 a 14 números)" style="max-width:240px">' +
      '<button type="button" class="btn small" data-action="ean-search">Buscar ficha</button>' +
      '<label class="btn small">Ler da foto<input type="file" accept="image/*" capture="environment" data-change="ean-photo" hidden></label></div>' +
      '<p class="small muted" style="margin:6px 0 0">Consulta a base pública Open Food Facts e cruza com a enciclopédia. ' +
      'Se não achar, salve mesmo assim: a rotina de fichas técnicas tenta de novo e, se ligada, pesquisa com IA.</p></div>' +
      '<div id="label-out"></div></section>';
  }

  /** Reduz a foto no navegador (lado maior 1600 px, JPEG) antes de enviar. */
  function shrink(file) {
    return new Promise(function (resolve, reject) {
      var url = URL.createObjectURL(file);
      var img = new Image();
      img.onload = function () {
        var s = Math.min(1, MAX_SIDE / Math.max(img.naturalWidth, img.naturalHeight));
        var c = document.createElement('canvas');
        c.width = Math.round(img.naturalWidth * s);
        c.height = Math.round(img.naturalHeight * s);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        URL.revokeObjectURL(url);
        var dataUrl = c.toDataURL('image/jpeg', 0.85);
        resolve({ dataUrl: dataUrl, b64: dataUrl.split(',')[1], mime: 'image/jpeg' });
      };
      img.onerror = function () { URL.revokeObjectURL(url); reject(new Error('Não consegui abrir essa imagem.')); };
      img.src = url;
    });
  }

  function photoInput(input) {
    var file = input.files && input.files[0];
    input.value = '';
    if (!file) return;
    if (!/^image\//.test(file.type || 'image/')) return Promise.reject(new Error('Escolha um arquivo de imagem.'));
    var out = document.getElementById('label-out');
    out.innerHTML = '<div class="label-scan-body"><div class="muted">Preparando a foto…</div></div>';
    return shrink(file).then(function (p) {
      photo = p;
      out.innerHTML = '<div class="label-scan-body"><img class="label-thumb" alt="Foto do rótulo" src="' + p.dataUrl + '">' +
        '<div class="label-scan-main"><div id="label-ocr"><div class="muted">Lendo o rótulo…</div></div><div id="label-ai-out"></div></div></div>';
      return API.call('label.read', { image: p.b64, mime: p.mime });
    }).then(function (r) {
      photo.text = r.text || '';
      document.getElementById('label-ocr').innerHTML = block(r, 'ocr');
    }).catch(function (e) {
      var el = document.getElementById('label-ocr') || out;
      el.innerHTML = '<div class="callout warn">' + esc(e.message || String(e)) + '</div>' + aiButton();
    });
  }

  function aiButton() {
    if (!photo) return '';
    if (!Store.lookups.ai_enabled) return '<p class="small muted" style="margin-top:10px">Para buscar a ficha técnica na web com IA, configure a chave do Claude em Configurações.</p>';
    return '<div class="btn-row" style="margin-top:10px"><button type="button" class="btn" data-action="label-ai">✦ Buscar ficha técnica com IA</button>' +
      '<span class="small muted">custa alguns centavos de dólar; os dados entram como “IA · não verificado”</span></div>';
  }

  /** Bloco de revisão: uma linha por campo sugerido, marcada por padrão quando o campo do formulário está vazio. */
  function block(r, kind) {
    var f = form();
    var keys = ORDER.filter(function (k) { return r.fields && r.fields[k]; });
    var h = '';
    if (kind === 'ean') {
      h += '<h3 style="margin-top:0">Encontrado pelo código ' + esc(r.code) + ' ' + Components.src('pesquisado') + '</h3>' +
        (r.image ? '<img class="label-thumb" style="width:90px;float:right;margin:0 0 8px 12px" alt="" src="' + esc(r.image) + '" referrerpolicy="no-referrer">' : '') +
        '<p class="small muted">Fonte: <a href="' + esc(r.url) + '" target="_blank" rel="noopener">Open Food Facts</a> (base colaborativa: confira com o rótulo).</p>';
    } else if (kind === 'ocr') {
      if (!r.text) return '<div class="callout warn">Não encontrei texto na foto. Tente outra com o rótulo reto, bem iluminado e sem reflexo.</div>' + aiButton();
      h += '<h3 style="margin-top:0">Lido no rótulo</h3>';
    } else {
      h += '<h3>Ficha encontrada pela IA ' + Components.src('ia_nao_verificada') + '</h3>' +
        '<p class="small muted">Confira com o rótulo e a fonte antes de usar como gabarito. Custo desta busca: US$ ' + fmtNum(r.cost_usd || 0, 2) + '.</p>';
    }
    if (!keys.length && !(r.grapes || []).length) h += '<p class="muted">Nenhum dado reconhecido' + (kind === 'ocr' ? ' na enciclopédia.' : '.') + '</p>';
    h += '<div class="label-rows" data-kind="' + kind + '">';
    keys.forEach(function (k) {
      var s = r.fields[k];
      var how = kind === 'ai' ? 'ia_nao_verificada' : (s.how === 'enciclopedia' ? 'pesquisado' : 'rotulo');
      var cur = f && f.elements[k] ? f.elements[k].value : '';
      var checked = (s.value !== '' && s.value !== null) && !cur;
      h += '<label class="label-row"><input type="checkbox" data-f="' + k + '" data-how="' + how + '" data-ref="' + esc(s.ref || '') + '"' + (checked ? ' checked' : '') + '>' +
        '<span class="label-row-name">' + esc(LABELS[k]) + '</span>' + valueInput(k, s) +
        '<span class="small muted label-row-ev">' + esc(s.evidence || '') + (cur ? ' · atual: ' + esc(cur) : '') + '</span></label>';
    });
    (r.grapes || []).forEach(function (g) {
      h += '<label class="label-row"><input type="checkbox" data-grape="' + esc(g.name) + '" data-pct="' + esc(g.percent || '') + '" data-how="' + (kind === 'ai' ? 'ia_nao_verificada' : kind === 'ean' ? 'pesquisado' : 'rotulo') + '" checked>' +
        '<span class="label-row-name">Uva</span><span>' + esc(g.name) + (g.percent ? ' · ' + g.percent + '%' : '') + '</span></label>';
    });
    h += '</div>';
    if (kind === 'ocr' && (r.lines || []).length) {
      h += '<div class="small muted" style="margin-top:12px">Nome do vinho: toque na linha do rótulo que é o nome.</div><div class="chips" style="margin-top:6px">' +
        r.lines.filter(function (l) { return l.length <= 70; }).slice(0, 14).map(function (l) {
          return '<button type="button" class="chip" data-action="label-name" data-v="' + esc(l) + '">' + esc(l) + '</button>';
        }).join('') + '</div>';
    }
    if (kind === 'ai' && r.not_found) h += '<p class="small muted">Não encontrado: ' + esc(r.not_found) + '</p>';
    if (keys.length || (r.grapes || []).length) {
      h += '<div class="btn-row" style="margin-top:12px"><button type="button" class="btn small" data-action="label-apply" data-kind="' + kind + '">Aplicar marcados ao formulário</button></div>';
    }
    if (kind === 'ocr') {
      h += '<details style="margin-top:12px"><summary class="small muted">Texto lido</summary><pre class="label-text">' + esc(r.text) + '</pre></details>' + aiButton();
    }
    return h;
  }

  function valueInput(k, s) {
    var opts = (s.options || []).map(String);
    if (k === 'color' || k === 'type') {
      var map = k === 'color' ? COLOR_LABELS : TYPE_LABELS;
      return '<select class="in" data-v>' + Object.keys(map).map(function (x) {
        return '<option value="' + x + '"' + (x === s.value ? ' selected' : '') + '>' + esc(map[x]) + '</option>'; }).join('') + '</select>';
    }
    if (opts.length > 1) {
      return '<select class="in" data-v>' + (s.value === '' ? '<option value="">— escolha —</option>' : '') + opts.map(function (x) {
        return '<option' + (x === String(s.value) ? ' selected' : '') + '>' + esc(x) + '</option>'; }).join('') + '</select>';
    }
    return '<input class="in" data-v value="' + esc(s.value) + '">';
  }

  function mark(f, k, how, ref) {
    var el = f.elements[k];
    if (!el) return;
    var st = state();
    st.origins[k] = how;
    if (ref) st.refs[k] = ref; else delete st.refs[k];
    var holder = el.parentNode;
    var old = holder.querySelector('.src[data-label-src]');
    if (old) old.remove();
    var lab = holder.querySelector('label.f');
    if (lab) lab.insertAdjacentHTML('beforeend', ' ' + Components.src(how).replace('<span ', '<span data-label-src '));
  }

  function apply(btn) {
    var f = form();
    var rows = btn.closest('#label-ocr, #label-ai-out').querySelector('.label-rows');
    var n = 0;
    rows.querySelectorAll('input[type=checkbox]:checked').forEach(function (cb) {
      var how = cb.getAttribute('data-how');
      if (cb.hasAttribute('data-grape')) { n += addGrape(cb.getAttribute('data-grape'), cb.getAttribute('data-pct'), how); return; }
      var k = cb.getAttribute('data-f');
      var v = cb.closest('.label-row').querySelector('[data-v]').value;
      if (v === '' || !f.elements[k]) return;
      f.elements[k].value = v;
      mark(f, k, how, cb.getAttribute('data-ref'));
      n++;
    });
    f.dispatchEvent(new Event('labelapplied'));
    UI.toast(n ? n + ' campo(s) preenchido(s). Revise e salve.' : 'Nada marcado para aplicar.');
  }

  function addGrape(name, pct, how) {
    var box = document.getElementById('grape-rows');
    var rows = box.querySelectorAll('.grape-row');
    for (var i = 0; i < rows.length; i++) {
      var inp = rows[i].querySelector('[data-g=name]');
      if (inp.value.trim().toLowerCase() === name.toLowerCase()) return 0;
    }
    var empty = Array.prototype.filter.call(rows, function (r) { return !r.querySelector('[data-g=name]').value.trim(); })[0];
    if (empty) empty.remove();
    box.insertAdjacentHTML('beforeend', grapeRow({ name: name, percent: pct, source: how }));
    return 1;
  }

  function setName(btn) {
    var f = form();
    var v = btn.getAttribute('data-v');
    // Linha toda em MAIÚSCULAS ("BAROLO DEL COMUNE") → "Barolo del Comune".
    if (v === v.toUpperCase() && /[A-Z]/.test(v)) {
      v = v.toLowerCase().replace(/(^|[\s'’(-])([a-zà-ÿ])/g, function (m, a, b) { return a + b.toUpperCase(); })
        .replace(/ (Di|Da|De|Del|Della|Dei|Do|Dos|Das|Du|Des|La|Le|E|Et|Y|Von|Van) /g, function (m) { return m.toLowerCase(); });
    }
    f.elements.name.value = v;
    mark(f, 'name', 'rotulo', '');
  }

  /** Edição manual depois de aplicar → a origem volta a ser "usuario". */
  function touched(f, el) {
    if (!el || el.closest('#label-scan')) return;
    var row = el.closest('.grape-row');
    if (row && row.hasAttribute('data-source')) {
      row.removeAttribute('data-source');
      var b = row.querySelector('.src');
      if (b) b.remove();
      return;
    }
    var k = el.name;
    if (!k || !state().origins[k]) return;
    delete state().origins[k];
    delete state().refs[k];
    var badge = el.parentNode.querySelector('.src[data-label-src]');
    if (badge) badge.remove();
  }

  function ai(btn) {
    if (!photo) return Promise.resolve();
    UI.busy(btn, true);
    var out = document.getElementById('label-ai-out');
    out.innerHTML = '<p class="muted">Lendo a foto e buscando a ficha técnica… (pode levar até 1 minuto)</p>';
    return API.call('label.ai', { image: photo.b64, mime: photo.mime, text: photo.text || '' }).then(function (r) {
      UI.busy(btn, false);
      btn.closest('.btn-row').remove();
      out.innerHTML = block(r, 'ai');
    }).catch(function (e) { UI.busy(btn, false); out.innerHTML = ''; throw e; });
  }

  // ---------- Código de barras ----------
  function eanOpen() {
    var box = document.getElementById('ean-box');
    box.hidden = !box.hidden;
    if (!box.hidden) document.getElementById('ean-code').focus();
  }

  /** Lê o código numa foto: BarcodeDetector (Chrome/Android) ou ZXing (Safari/iPhone). */
  function decode(file) {
    if ('BarcodeDetector' in window) {
      return createImageBitmap(file).then(function (img) {
        return new window.BarcodeDetector({ formats: ['ean_13', 'ean_8', 'upc_a', 'upc_e'] }).detect(img);
      }).then(function (res) { if (res[0]) return res[0].rawValue; throw new Error('sem código'); });
    }
    return loadZxing().then(function () {
      var url = URL.createObjectURL(file);
      return new ZXing.BrowserMultiFormatReader().decodeFromImageUrl(url).then(function (r) { URL.revokeObjectURL(url); return r.getText(); });
    });
  }
  function loadZxing() {
    if (window.ZXing) return Promise.resolve();
    return new Promise(function (resolve, reject) {
      var sc = document.createElement('script');
      sc.src = 'https://cdn.jsdelivr.net/npm/@zxing/library@0.21.3/umd/index.min.js';
      sc.onload = resolve; sc.onerror = reject;
      document.head.appendChild(sc);
    });
  }

  function eanPhoto(input) {
    var file = input.files && input.files[0];
    input.value = '';
    if (!file) return;
    UI.toast('Lendo o código de barras…');
    return decode(file).then(function (code) {
      document.getElementById('ean-code').value = code;
      return eanSearch();
    }).catch(function () { UI.toast('Não consegui ler o código na foto. Aproxime a câmera ou digite os números.', true); });
  }

  function eanSearch(btn) {
    var code = (document.getElementById('ean-code').value || '').replace(/\D/g, '');
    if (!/^\d{8,14}$/.test(code)) return Promise.reject(new Error('Digite de 8 a 14 números.'));
    var f = form();
    if (f.elements.barcode && !f.elements.barcode.value) { f.elements.barcode.value = code; }
    var out = document.getElementById('label-out');
    out.innerHTML = '<div class="label-scan-body"><div class="label-scan-main" id="label-ocr"><p class="muted">Buscando o código ' + esc(code) + '…</p></div></div>';
    if (btn) UI.busy(btn, true);
    return API.call('barcode.lookup', { code: code }).then(function (r) {
      if (btn) UI.busy(btn, false);
      var curId = f.elements.id && f.elements.id.value;
      var dup = r.existing && r.existing.id !== curId ? '<div class="callout" style="margin-bottom:12px">Este código já está no catálogo: <a href="#/vinhos/' + esc(r.existing.id) + '">' + esc(r.existing.name) + '</a>. Abra esse vinho em vez de cadastrar de novo.</div>' : '';
      document.getElementById('label-ocr').innerHTML = dup + (r.found ? block(r, 'ean')
        : '<div class="callout warn">Não encontrei o código ' + esc(code) + ' na base pública. Preencha o que souber, ou fotografe o rótulo; ao salvar, o código fica guardado e a rotina de fichas técnicas tenta de novo depois.</div>');
    }).catch(function (e) { if (btn) UI.busy(btn, false); out.innerHTML = ''; throw e; });
  }

  return { html: html, photo: photoInput, apply: apply, ai: ai, setName: setName, touched: touched,
    eanOpen: eanOpen, eanSearch: eanSearch, eanPhoto: eanPhoto };
})();
</script>

  <script>
/* ============================== MINHA ADEGA ============================== */
var BOTTLE_STATUS = { disponivel: 'Disponível', reservada: 'Reservada p/ degustação', utilizada: 'Utilizada', descartada: 'Descartada' };

Pages.cellar = {
  // Modo discreto: esconde o conteúdo das garrafinhas (preserva o "às cegas").
  discreet: (function () { try { return localStorage.getItem('wsl.discreet') !== '0'; } catch (e) { return true; } })(),
  filter: 'ativas',
  selected: {},
  render: function () {
    return Promise.all([API.call('bottles.list'), API.call('bottles.batches')]).then(function (r) {
      Pages.cellar.data = r[0];
      Pages.cellar.batches = r[1];
      Pages.cellar.selected = {};
      var list = r[0];
      var n = function (s) { return list.filter(function (b) { return b.status === s; }).length; };
      var html = '<div class="page-head"><div><div class="eyebrow">Minha Adega</div><h1>Adega de degustação</h1>' +
        '<p class="sub">' + n('disponivel') + ' disponíveis · ' + n('reservada') + ' reservadas · ' + n('utilizada') + ' utilizadas</p></div>' +
        '<div class="btn-row"><a class="btn" href="#/adega/fracionar">Fracionar garrafa</a><a class="btn primary" href="#/degustacao/nova">Nova degustação</a></div></div>' +
        '<p class="callout small" style="margin-bottom:16px">Toque nas garrafinhas para selecionar; com as selecionadas, use <b>Degustar às cegas</b> na barra que aparece embaixo.</p>';
      if (!list.length) return html + Components.empty('Nenhuma garrafinha cadastrada.', 'Fracione uma garrafa ou sincronize a planilha.', '<a class="btn primary" href="#/adega/fracionar">Fracionar garrafa</a>');
      html += '<div class="btn-row" style="justify-content:space-between;margin-bottom:18px">' +
        '<div class="seg" id="cellar-filter">' + [['ativas', 'Ativas'], ['disponivel', 'Disponíveis'], ['reservada', 'Reservadas'], ['utilizada', 'Utilizadas'], ['descartada', 'Descartadas'], ['todas', 'Todas']].map(function (f) {
          return '<button type="button" data-action="filter" data-f="' + f[0] + '" class="' + (Pages.cellar.filter === f[0] ? 'on' : '') + '">' + f[1] + '</button>';
        }).join('') + '</div>' +
        '<label class="small"><input type="checkbox" data-change="discreet"' + (Pages.cellar.discreet ? ' checked' : '') + '> Modo discreto (esconde o conteúdo)</label></div>' +
        '<div id="cellar-grid"></div>' +
        '<div id="cellar-bar" class="panel" style="display:none;position:sticky;bottom:16px;margin-top:18px;box-shadow:var(--shadow)"></div>';

      html += '<h2>Fracionamentos</h2><div class="list">' + r[1].map(function (b) {
        return '<div class="row"><div><div class="t">' + esc(b.wine_name) + '</div><div class="m">' + (b.date ? fmtDate(b.date) + ' · ' : '') +
          (b.original_volume_ml ? fmtNum(b.original_volume_ml, 0) + ' ml → ' : '') + plural(b.total, 'garrafinha', 'garrafinhas') + (b.bottle_volume_ml ? ' de ~' + fmtNum(b.bottle_volume_ml, 0) + ' ml' : '') +
          ' · numeração ' + esc(b.numbering || '') + ' ' + Components.src(b.source) + '</div></div><div class="m nowrap">' + b.available + ' disponíveis</div></div>';
      }).join('') + '</div>';
      return html;
    });
  },
  mount: function () { Pages.cellar.draw(); },
  draw: function () {
    var f = Pages.cellar.filter, d = Pages.cellar.discreet;
    var rows = Pages.cellar.data.filter(function (b) {
      return f === 'todas' || (f === 'ativas' ? (b.status === 'disponivel' || b.status === 'reservada') : b.status === f);
    });
    document.getElementById('cellar-grid').innerHTML = rows.length ? '<div class="cellar">' + rows.map(function (b) {
      return '<button class="btl' + (b.status === 'utilizada' || b.status === 'descartada' ? ' dim' : '') + (Pages.cellar.selected[b.id] ? ' sel' : '') + '" data-action="pick" data-id="' + b.id + '" title="' + esc(BOTTLE_STATUS[b.status]) + '">' +
        Components.bottle(b.number, { status: b.status }) + '<span class="n">#' + b.number + '</span>' +
        (d ? '' : '<span class="w">' + esc(b.wine_name) + '</span>') + '</button>';
    }).join('') + '</div>' : Components.empty('Nenhuma garrafinha neste filtro.');

  },
  drawBar: function () {
    var ids = Object.keys(Pages.cellar.selected);
    var bar = document.getElementById('cellar-bar');
    if (!ids.length) { bar.style.display = 'none'; return; }
    bar.style.display = '';
    var byId = {};

    var allAvail = ids.every(function (id) { return byId[id] && byId[id].status === 'disponivel'; });
    bar.innerHTML = '<div class="btn-row" style="justify-content:space-between"><span><b>' + ids.length + '</b> selecionada(s)</span><span class="btn-row">' +
      (allAvail && ids.length <= 12 ? '<button class="btn primary small" data-action="blind">Degustar às cegas</button>'
        : '<span class="small muted">Para degustar às cegas, escolha só garrafinhas disponíveis (até 12).</span>') +
      (ids.length === 1 ? '<button class="btn small" data-action="details">Ver detalhes</button>' : '') +
      '<button class="btn small" data-action="set-status" data-s="disponivel">Disponível</button>' +
      '<button class="btn small" data-action="set-status" data-s="utilizada">Utilizada</button>' +
      '<button class="btn small" data-action="set-status" data-s="descartada">Descartada</button>' +
      '<button class="btn small ghost" data-action="clear">Limpar</button></span></div>';
  },
  actions: {
    blind: function (btn) {
      var ids = Object.keys(Pages.cellar.selected);
      UI.busy(btn, true);
      return API.call('tastings.create', { bottle_ids: ids }).then(function (r) {
        UI.toast('Degustação criada com ' + ids.length + ' garrafinha(s). Bom trabalho às cegas!');
        Router.go('/degustacao/' + r.id);
      }).catch(function (e) { UI.busy(btn, false); throw e; });
    },
    filter: function (btn) {
      Pages.cellar.filter = btn.getAttribute('data-f');
      btn.parentNode.querySelectorAll('button').forEach(function (b) { b.classList.toggle('on', b === btn); });
      Pages.cellar.draw();
    },
    discreet: function (cb) {
      Pages.cellar.discreet = cb.checked;
      try { localStorage.setItem('wsl.discreet', cb.checked ? '1' : '0'); } catch (e) { /* sem storage */ }
      Pages.cellar.draw();
    },
    pick: function (btn) {
      var id = btn.getAttribute('data-id');
      if (Pages.cellar.selected[id]) delete Pages.cellar.selected[id]; else Pages.cellar.selected[id] = true;
      btn.classList.toggle('sel');
      Pages.cellar.drawBar();
    },
    clear: function () { Pages.cellar.selected = {}; Pages.cellar.draw(); },
    details: function () {
      var id = Object.keys(Pages.cellar.selected)[0];
      var b = Pages.cellar.data.filter(function (x) { return x.id === id; })[0];
      var show = function () {
        UI.modal('<h2>Garrafinha #' + b.number + '</h2><div class="fields">' +
          Components.field('Vinho', '<a href="#/vinhos/' + b.wine_id + '">' + esc(b.wine_name) + '</a>', { html: true }) +
          Components.field('Safra', b.vintage) + Components.field('Uva(s)', b.grapes) +
          Components.field('Volume', b.volume_ml ? fmtNum(b.volume_ml, 0) + ' ml' : '') +
          Components.field('Status', BOTTLE_STATUS[b.status]) + Components.field('Observações', b.notes, { wide: true }) +
          '</div><div class="btn-row" style="justify-content:flex-end;margin-top:20px"><button class="btn" data-action="close-modal">Fechar</button></div>');
      };
      if (!Pages.cellar.discreet) return show();
      return UI.confirm('Mostrar o conteúdo?', 'O modo discreto está ligado. Ver o conteúdo desta garrafinha pode estragar uma futura degustação às cegas.', 'Mostrar').then(function (ok) { if (ok) show(); });
    },
    'set-status': function (btn) {
      var ids = Object.keys(Pages.cellar.selected), s = btn.getAttribute('data-s');
      var reserved = Pages.cellar.data.filter(function (b) { return ids.indexOf(b.id) >= 0 && b.status === 'reservada'; });
      var go = function () {
        return API.call('bottles.setStatus', { ids: ids, status: s }).then(function (n) { UI.toast(plural(n, 'garrafinha atualizada', 'garrafinhas atualizadas') + '.'); Router.render(); });
      };
      if (reserved.length) {
        return UI.confirm('Garrafinhas reservadas', reserved.length + ' delas estão reservadas numa degustação em andamento. Alterar mesmo assim?', 'Alterar').then(function (ok) { if (ok) return go(); });
      }
      return go();
    }
  }
};

Pages.fractionate = {
  render: function (p) {
    return API.call('wines.list').then(function (wines) {
      var html = '<div class="page-head"><div><div class="eyebrow"><a href="#/adega">Minha Adega</a></div><h1>Fracionar uma garrafa</h1>' +

        '<div><label class="f">Quantidade de garrafinhas *</label><input class="in" type="number" name="count" value="22" min="1" max="100" required data-input="calc"></div>' +
        '<div><label class="f">Volume por garrafinha (ml)</label><input class="in" type="number" name="bottle_volume_ml" value="30" data-input="calc"></div>' +

        '<label style="display:block;margin:6px 0"><input type="radio" name="numbering" value="aleatoria" checked> <b>Aleatória</b> — o sistema sorteia números livres. Recomendado: você não consegue deduzir o vinho pelo número.</label>' +
        '<label style="display:block;margin:6px 0"><input type="radio" name="numbering" value="sequencial"> Sequencial — números em sequência depois do maior número ativo.</label></div>' +
        '<div class="wide"><label class="f">Observações</label><textarea class="in" name="notes"></textarea></div>' +
        '</div><p class="muted small" id="calc-hint"></p><div class="btn-row" style="justify-content:flex-end"><a class="btn" href="#/adega">Cancelar</a><button class="btn primary">Registrar e numerar</button></div></form>';
      return html;
    });
  },
  mount: function () { Pages.fractionate.actions.calc(); },
  actions: {
    calc: function () {
      var f = document.querySelector('form[data-action="save"]');
      if (!f) return;
      var total = (+f.count.value || 0) * (+f.bottle_volume_ml.value || 0);
      var orig = +f.original_volume_ml.value || 0;
      document.getElementById('calc-hint').textContent = total ? 'Total: ' + total + ' ml de ' + orig + ' ml' + (total > orig ? ' — mais do que a garrafa!' : ' (sobram ~' + (orig - total) + ' ml)') : '';
    },
    save: function (form) {
      var d = formData(form);
      var btn = form.querySelector('button.primary');
      UI.busy(btn, true);
      return API.call('bottles.fractionate', d).then(function (r) {
        document.getElementById('view').innerHTML =
          '<div class="page-head"><div><div class="eyebrow">Fracionamento registrado</div><h1>' + esc(r.wine_name) + '</h1>' +
          '<p class="sub">Etiquete as garrafinhas com estes números. Guarde esta lista longe de quem vai degustar — inclusive de você.</p></div>' +
          '<div class="btn-row"><button class="btn" onclick="window.print()">Imprimir</button><a class="btn primary" href="#/adega">Ir para a adega</a></div></div>' +
          '<div class="panel"><div class="cellar">' + r.numbers.map(function (n) {
            return '<div class="btl">' + Components.bottle(n, { status: 'disponivel' }) + '<span class="n">#' + n + '</span></div>';
          }).join('') + '</div><p class="serif" style="font-size:1.3rem;margin-top:18px">' + r.numbers.join(' · ') + '</p></div>';
      }).catch(function (e) { UI.busy(btn, false); throw e; });
    }
  }
};

  <script>
/* ============================== NOVA DEGUSTAÇÃO ============================== */
var DIFFICULTY = {
  facil: ['Fácil', 'Na hipótese, a lista de uvas traz as uvas desta sessão misturadas a algumas outras.'],
  medio: ['Médio', 'A lista de uvas traz todas as uvas que existem na sua adega.'],
  dificil: ['Difícil', 'A lista de uvas traz todas as uvas cadastradas no sistema.']
};

Pages.tastingNew = {
  render: function () {
    return Promise.all([API.call('bottles.list'), API.call('wines.list')]).then(function (r) {
      var bottles = r[0].filter(function (b) { return b.status === 'disponivel'; });
      var wines = r[1].filter(function (w) { return w.bottles_available > 0; });

      var L = Store.lookups;
      var html = '<div class="page-head"><div><div class="eyebrow">Degustação</div><h1>Nova degustação às cegas</h1>' +
        '<p class="sub">' + plural(bottles.length, 'garrafinha disponível', 'garrafinhas disponíveis') + ' de ' + plural(wines.length, 'vinho', 'vinhos') + '.</p></div></div>';
      if (!bottles.length) return html + Components.empty('Não há garrafinhas disponíveis.', 'Fracione uma garrafa para começar.', '<a class="btn primary" href="#/adega/fracionar">Fracionar garrafa</a>');
      var usedGrapes = L.grapes.filter(function (g) { return wines.some(function (w) { return w.grapes.some(function (x) { return x.id === g.id; }); }); });
      var usedCountries = L.countries.filter(function (c) { return wines.some(function (w) { return w.country_id === c.id; }); });
      var usedRegions = L.regions.filter(function (c) { return wines.some(function (w) { return w.region_id === c.id; }); });

      // Opção 1: escolher as garrafinhas (só os números aparecem, para continuar às cegas).
      Pages.tastingNew.picked = {};
      html += '<section class="panel" style="margin-bottom:18px"><h3 style="margin-top:0">Escolher as garrafinhas</h3>' +
        '<p class="muted small">Toque nos números das garrafinhas que vão para a mesa (até 12). Só aparecem as disponíveis.</p>' +
        '<div class="pick-grid">' + bottles.slice().sort(function (a, b) { return a.number - b.number; }).map(function (b) {
          return '<button type="button" class="pick-btl" data-action="pick-bottle" data-id="' + esc(b.id) + '">#' + b.number + '</button>';
        }).join('') + '</div>' +
        '<div class="btn-row" style="justify-content:flex-end;margin-top:12px"><span class="small muted" id="pick-count">Nenhuma escolhida</span>' +
        '<button type="button" class="btn primary" data-action="start-picked" disabled>Começar com as escolhidas</button></div></section>' +
        '<div class="eyebrow" style="margin:0 0 8px">Ou sorteie</div>';
      html += '<form class="panel" data-action="create">' +
        '<h3 style="margin-top:0">Quantos vinhos?</h3><div class="seg" data-seg="count">' + [1, 2, 3, 4, 5, 6].map(function (n) {
          return '<button type="button" data-action="seg-pick" data-v="' + n + '" class="' + (n === Math.min(3, wines.length) ? 'on' : '') + '">' + n + '</button>';
        }).join('') + '</div>' +
        '<h3>Dificuldade</h3><div class="grid three">' + Object.keys(DIFFICULTY).map(function (k) {
          return '<label class="panel" style="cursor:pointer;padding:14px 16px"><input type="radio" name="difficulty" value="' + k + '"' + (k === 'medio' ? ' checked' : '') + '> <b>' + DIFFICULTY[k][0] + '</b><div class="small muted" style="margin-top:4px">' + DIFFICULTY[k][1] + '</div></label>';
        }).join('') + '</div>' +
        '<h3>Tema (opcional)</h3><p class="muted small">Sem filtros = sorteio entre todas as garrafinhas disponíveis.</p><div class="form-grid">' +
        '<div><label class="f">Cor</label><select class="in" name="color">' + Components.options(Object.keys(COLOR_LABELS).map(function (k) { return { v: k, t: COLOR_LABELS[k] }; }), '', 'Qualquer') + '</select></div>' +
        '<div><label class="f">Uvas</label><select class="in" name="grape_ids" multiple size="4">' + Components.options(usedGrapes, []) + '</select></div>' +
        '<div><label class="f">Países</label><select class="in" name="country_ids" multiple size="4">' + Components.options(usedCountries, []) + '</select></div>' +
        '<div><label class="f">Regiões</label><select class="in" name="region_ids" multiple size="4">' + Components.options(usedRegions, []) + '</select></div>' +
        '<div class="wide"><label class="f">Título (opcional)</label><input class="in" name="title" placeholder="Degustação às cegas — 3 vinhos"></div>' +
        '<div class="wide"><label><input type="checkbox" name="allow_repeat"> Permitir o mesmo vinho mais de uma vez (útil para treinar consistência)</label></div>' +
        '</div><p class="small muted">Dica: segure Ctrl/⌘ para selecionar várias uvas, países ou regiões.</p>' +
        '<div class="btn-row" style="justify-content:flex-end;margin-top:10px"><button class="btn primary">Sortear garrafinhas e começar</button></div></form>';
      return html;
    });
  },
  actions: {
    'pick-bottle': function (btn) {
      var id = btn.getAttribute('data-id'), P = Pages.tastingNew.picked;
      if (P[id]) delete P[id];
      else if (Object.keys(P).length >= 12) { UI.toast('No máximo 12 garrafinhas.', true); return; }
      else P[id] = true;
      btn.classList.toggle('on', !!P[id]);
      var n = Object.keys(P).length;
      document.getElementById('pick-count').textContent = n ? n + ' escolhida(s)' : 'Nenhuma escolhida';
      document.querySelector('[data-action=start-picked]').disabled = !n;
    },
    'start-picked': function (btn) {
      var ids = Object.keys(Pages.tastingNew.picked);
      if (!ids.length) return;
      UI.busy(btn, true);
      return API.call('tastings.create', { bottle_ids: ids }).then(function (r) { Router.go('/degustacao/' + r.id); })
        .catch(function (e) { UI.busy(btn, false); throw e; });
    },
    create: function (form) {
      var d = formData(form);
      var count = Components.readSeg(form, 'count') || '3';
      var btn = form.querySelector('button.primary');
      UI.busy(btn, true);
      return API.call('tastings.create', {
        count: count, difficulty: d.difficulty, title: d.title, allow_repeat: d.allow_repeat,
        filters: { color: d.color, grape_ids: d.grape_ids, country_ids: d.country_ids, region_ids: d.region_ids }
      }).then(function (r) { Router.go('/degustacao/' + r.id); })
        .catch(function (e) { UI.busy(btn, false); throw e; });

/* ============================== MODO JOGO ============================== */
var STEPS = [
  { key: 'visual', t: 'Visual', lead: 'Incline a taça contra um fundo branco.' },
  { key: 'nose', t: 'Nariz', lead: 'Primeiro sem girar. Depois, gire e cheire de novo.' },
  { key: 'palate', t: 'Boca', lead: 'Um gole generoso. Percorra toda a boca.' },
  { key: 'structure', t: 'Estrutura', lead: 'Intensidade, persistência e textura.' },
  { key: 'hypothesis', t: 'Hipótese', lead: 'Junte as pistas. O que é este vinho?' },
  { key: 'confirm', t: 'Confirmação', lead: 'Revise sua análise antes de seguir.' }
];

Pages.tastingPlay = {
  fullscreen: true,
  render: function (p) {
    return API.call('tastings.play', { id: p.id }).then(function (d) {
      if (d.revealed) { setTimeout(function () { Router.go('/degustacao/' + p.id + '/resultado'); }, 0); return ''; }
      var S = Pages.tastingPlay.state = { data: d, idx: 0, step: 0, answers: {}, saving: null };
      d.samples.forEach(function (s) { S.answers[s.id] = s.answers || {}; });
      var firstOpen = d.samples.findIndex(function (s) { return !s.completed; });
      S.idx = firstOpen < 0 ? 0 : firstOpen;
      return '<div class="tasting-mode" id="tm"><div class="t-wrap">' +
        '<div class="t-top"><div><div class="eyebrow">Blind tasting</div><div class="serif" style="font-size:1.2rem">' + esc(d.title) + '</div></div>' +
        '<div class="btn-row"><span class="small muted" id="t-saved"></span><button class="t-exit" data-action="exit">Sair e continuar depois</button></div></div>' +
        '<div class="t-rail" id="t-rail"></div><div id="t-hero"></div><div class="t-steps" id="t-steps"></div><div id="t-card"></div><div id="t-reveal"></div>' +
        '</div></div>';
    });
  },
  mount: function () {
    var S = Pages.tastingPlay.state;
    if (!S) return;
    Pages.tastingPlay.drawAll();
  },
  sample: function () { var S = Pages.tastingPlay.state; return S.data.samples[S.idx]; },
  drawAll: function () {
    var P = Pages.tastingPlay;
    P.drawRail(); P.drawHero(); P.drawSteps(); P.drawCard(); P.drawReveal();
  },
  drawRail: function () {
    var S = Pages.tastingPlay.state;

      return '<button class="' + (i === S.idx ? 'cur ' : '') + (s.completed ? 'done' : '') + '" data-action="sample" data-i="' + i + '" title="Garrafa #' + s.number + '">' +
        Components.bottle(s.number, { fill: s.completed ? '#d4b07a' : '#c24d5f', stroke: '#a8958c', label: '', uid: 'r' }) + '#' + s.number + '</button>';
    }).join('');
  },
  drawHero: function () {
    var S = Pages.tastingPlay.state, s = Pages.tastingPlay.sample();
    document.getElementById('t-hero').innerHTML = '<div class="t-hero">' +
      '<svg class="big" viewBox="0 0 40 92"><defs><linearGradient id="gl" x1="0" x2="1"><stop offset="0" stop-color="#5a1522"/><stop offset=".45" stop-color="#9b2c3f"/><stop offset="1" stop-color="#3d0e17"/></linearGradient></defs>' +
      '<path d="M16 3h8v14c0 3 8 6 8 16v52a4 4 0 0 1-4 4H12a4 4 0 0 1-4-4V33c0-10 8-13 8-16z" fill="url(#gl)" stroke="#d4b07a" stroke-width=".6"/>' +
      '<rect x="15" y="0" width="10" height="5" rx="1.5" fill="#d4b07a"/><rect x="11" y="46" width="18" height="26" rx="1.5" fill="#f3e9e1"/>' +
      '<text x="20" y="63" text-anchor="middle" font-family="Cormorant Garamond, serif" font-size="11" fill="#2b1f20">' + s.number + '</text>' +
      '<path d="M13 22c2-2 3-3 3-6" stroke="#fff" stroke-opacity=".25" stroke-width="1.2" fill="none"/></svg>' +
      '<div class="round">Rodada ' + String(S.idx + 1).padStart(2, '0') + ' de ' + String(S.data.samples.length).padStart(2, '0') + '</div>' +
      '<div class="num">Garrafa #' + s.number + '</div><div class="motto">Observe. Cheire. Prove.</div></div>';
  },
  drawSteps: function () {
    var S = Pages.tastingPlay.state;
    document.getElementById('t-steps').innerHTML = STEPS.map(function (st, i) {
      return '<button class="' + (i === S.step ? 'cur' : '') + '" data-action="step" data-i="' + i + '"><span class="i">' + (i + 1) + '</span>' + st.t + '</button>';
    }).join('');
  },
  val: function (c) { var a = Pages.tastingPlay.state.answers[Pages.tastingPlay.sample().id][c]; return a ? a.value : ''; },
  list: function (c) { var a = Pages.tastingPlay.state.answers[Pages.tastingPlay.sample().id][c]; return a && a.value_json ? a.value_json : []; },
  drawCard: function () {
    var P = Pages.tastingPlay, S = P.state, st = STEPS[S.step], v = P.val, L = P.list, s = P.sample();
    function q(label, inner) { return '<div class="t-q"><div class="l">' + esc(label) + '</div>' + inner + '</div>'; }

    var body = '';
    switch (st.key) {
      case 'visual':
        body = q('Limpidez', seg('clarity')) + q('Intensidade da cor', seg('color_intensity')) + q('Tonalidade', seg('color_hue')) +
          q('Descreva o visual', text('visual_text', 'Reflexos, halo, lágrimas…'));
        break;
      case 'nose':
        body = q('Aromas', Components.aromaPicker('aromas', L('aromas'))) + q('Descreva o nariz', text('nose_text', 'Intensidade, evolução, o que vem primeiro…'));
        break;
      case 'palate':
        body = q('Dulçor', seg('sweetness')) + q('Acidez', seg('acidity')) + q('Tanino', seg('tannin')) + q('Álcool', seg('alcohol')) + q('Corpo', seg('body'));
        break;

        body = q('Intensidade de sabor', seg('intensity')) + q('Persistência', seg('finish')) +
          q('Textura', Components.seg('texture', 'texture', L('texture'), { multi: true })) + q('Descreva a boca', text('palate_text', 'Sabores, equilíbrio, final…'));
        break;
      case 'hypothesis':
        var grapes = S.data.options.grapes;
        var gl = L('grape');
        var countries = Store.lookups.countries;
        var country = v('country');
        body = (S.data.options.grapes_restricted ? '<div class="callout small" style="margin-bottom:10px">Dificuldade ' + esc(DIFFICULTY[S.data.difficulty][0].toLowerCase()) + ': a lista de uvas é limitada. ' + esc(DIFFICULTY[S.data.difficulty][1]) + '</div>' : '') +
          '<div class="form-grid">' +
          '<div><label class="f">Uva — hipótese principal</label><select class="in" data-grape="0">' + Components.options(grapes, gl[0] || '', '—') + '</select></div>' +
          '<div><label class="f">Alternativa 1</label><select class="in" data-grape="1">' + Components.options(grapes, gl[1] || '', '—') + '</select></div>' +
          '<div><label class="f">Alternativa 2</label><select class="in" data-grape="2">' + Components.options(grapes, gl[2] || '', '—') + '</select></div>' +
          '<div><label class="f">País</label><select class="in" data-q="country" id="t-country">' + Components.options(countries, country, '—') + '</select></div>' +
          '<div><label class="f">Região</label><select class="in" id="t-region">' + Geo.regionOptions(country, Geo.top(v('region'))) + '</select></div>' +
          '<div><label class="f">Sub-região (opcional)</label><select class="in" id="t-subregion">' + Geo.subOptions(Geo.top(v('region')), Geo.isSub(v('region')) ? v('region') : '', country) + '</select>' +
          '<input type="hidden" data-q="region" id="t-region-val" value="' + esc(v('region')) + '"></div>' +
          '<div><label class="f">Safra</label><input class="in" type="number" data-q="vintage" value="' + esc(v('vintage')) + '" placeholder="ex.: 2021"></div>' +
          '<div><label class="f">Teor alcoólico estimado (%)</label><input class="in" type="number" step="0.5" data-q="abv" value="' + esc(v('abv')) + '" placeholder="ex.: 13,5"></div>' +
          '<div><label class="f">Estilo</label><input class="in" data-q="style" value="' + esc(v('style')) + '" placeholder="ex.: tinto jovem, sem madeira"></div>' +
          '<div><label class="f">Produtor (opcional)</label><input class="in" data-q="producer" value="' + esc(v('producer')) + '"></div>' +
          '</div><p class="small muted" style="margin-top:12px">O 1º palpite de uva vale ACERTO; um palpite alternativo certo vale PRÓXIMO.</p>';
        break;
      case 'confirm':
        body = '<div class="t-summary">' + summary() + '</div>' +
          q('Conclusão', text('conclusion', 'Por que você chegou a essa hipótese?'));
        break;
    }
    var last = S.step === STEPS.length - 1;
    document.getElementById('t-card').innerHTML = '<div class="t-card" id="t-form"><h2>' + esc(st.t) + '</h2><p class="lead">' + esc(st.lead) + '</p>' + body +
      '<div class="t-nav"><button class="btn" data-action="prev"' + (S.step === 0 ? ' disabled' : '') + '>← Anterior</button>' +
      (last ? '<button class="btn primary" data-action="complete">' + (s.completed ? 'Salvar' : 'Concluir garrafa #' + s.number) + '</button>'
        : '<button class="btn primary" data-action="next">Próximo →</button>') + '</div></div>';
    // País → só as regiões dele; região → só as sub-regiões dela. A resposta guardada é a mais específica.
    var c = document.getElementById('t-country'), rg = document.getElementById('t-region'), sb = document.getElementById('t-subregion');
    function sync() { document.getElementById('t-region-val').value = (sb && sb.value) || (rg && rg.value) || ''; }
    if (c) c.addEventListener('change', function () { rg.innerHTML = Geo.regionOptions(c.value, ''); sb.innerHTML = Geo.subOptions('', '', c.value); sync(); });
    if (rg) rg.addEventListener('change', function () { sb.innerHTML = Geo.subOptions(rg.value, '', c.value); sync(); });
    if (sb) sb.addEventListener('change', sync);
    function summary() {
      var a = S.answers[s.id];
      function lab(c, scale) { return a[c] && a[c].value ? Store.scaleLabel(scale || c, a[c].value) : '—'; }
      function item(k, val) { return '<div><div class="k">' + esc(k) + '</div><div class="v">' + (val || '—') + '</div></div>'; }
      var aro = (a.aromas && a.aromas.value_json || []).map(function (id) { return Store.name('aromas', id); }).join(', ');
      var gr = (a.grape && a.grape.value_json || []).map(function (id) { return Store.name('grapes', id); });
      return item('Cor', [lab('color_intensity'), lab('color_hue')].filter(function (x) { return x !== '—'; }).join(', ')) +
        item('Aromas', esc(aro)) + item('Acidez', lab('acidity')) + item('Tanino', lab('tannin')) + item('Corpo', lab('body')) +
        item('Álcool', lab('alcohol')) + item('Dulçor', lab('sweetness')) + item('Persistência', lab('finish')) +
        item('Uva', esc(gr.length ? gr[0] + (gr.length > 1 ? ' (ou ' + gr.slice(1).join(', ') + ')' : '') : '')) +
        item('Origem', esc([a.region && Store.name('regions', a.region.value), a.country && Store.name('countries', a.country.value)].filter(Boolean).join(', '))) +
        item('Safra', esc(a.vintage && a.vintage.value)) + item('Álcool estimado', a.abv && a.abv.value ? esc(a.abv.value) + '%' : '');
    }
  },
  drawReveal: function () {
    var S = Pages.tastingPlay.state;
    var pending = S.data.samples.filter(function (s) { return !s.completed; }).length;
    document.getElementById('t-reveal').innerHTML = '<div class="t-reveal">' + (pending
      ? '<p class="muted">' + (pending === 1 ? 'Falta 1 garrafa' : 'Faltam ' + pending + ' garrafas') + ' para concluir a sessão.</p><button class="btn small" data-action="reveal">Revelar mesmo assim</button>'
      : '<div class="serif" style="font-size:1.6rem;margin-bottom:6px">Todas as garrafas foram analisadas.</div><p class="muted">Quando estiver pronta, revele os vinhos e compare com suas respostas.</p><button class="btn gold" data-action="reveal">Revelar vinhos</button>') +
      '<div style="margin-top:22px"><button class="t-exit" data-action="cancel">Cancelar degustação</button></div></div>';
  },
  /** Lê o passo atual para a memória. */
  collect: function () {
    var P = Pages.tastingPlay, S = P.state, form = document.getElementById('t-form');
    if (!form) return;
    var a = S.answers[P.sample().id];
    form.querySelectorAll('[data-seg]').forEach(function (seg) {
      var name = seg.getAttribute('data-seg'), v = Components.readSeg(form, name);
      a[name] = Array.isArray(v) ? { value: '', value_json: v } : { value: v, value_json: null };
    });
    form.querySelectorAll('[data-q]').forEach(function (el) { a[el.getAttribute('data-q')] = { value: el.value.trim(), value_json: null }; });
    if (form.querySelector('.aroma-picker')) a.aromas = { value: '', value_json: Components.readAromas(form) };
    var gs = form.querySelectorAll('[data-grape]');
    if (gs.length) {
      var list = [];
      gs.forEach(function (g) { if (g.value && list.indexOf(g.value) < 0) list.push(g.value); });
      a.grape = { value: '', value_json: list };
    }
  },
  save: function (completed) {
    var P = Pages.tastingPlay, S = P.state, s = P.sample();
    P.collect();
    var el = document.getElementById('t-saved');
    if (el) el.textContent = 'salvando…';
    var args = { sample_id: s.id, answers: S.answers[s.id] };
    if (completed !== undefined) args.completed = completed;
    S.saving = API.call('tastings.saveAnswers', args).then(function () {
      if (completed !== undefined) s.completed = completed;
      if (el) el.textContent = 'salvo ✓';
    }).catch(function (e) { if (el) el.textContent = ''; UI.error(e); throw e; });
    return S.saving;
  },
  actions: {
    step: function (btn) {
      var P = Pages.tastingPlay;
      P.save();
      P.state.step = +btn.getAttribute('data-i');
      P.drawSteps(); P.drawCard();
    },
    next: function () { var P = Pages.tastingPlay; P.save(); P.state.step++; P.drawSteps(); P.drawCard(); document.getElementById('t-steps').scrollIntoView({ behavior: 'smooth' }); },
    prev: function () { var P = Pages.tastingPlay; P.save(); P.state.step--; P.drawSteps(); P.drawCard(); },
    sample: function (btn) {
      var P = Pages.tastingPlay;
      P.save();
      P.state.idx = +btn.getAttribute('data-i');
      P.state.step = 0;
      P.drawAll();
      document.getElementById('tm').scrollTo({ top: 0, behavior: 'smooth' });
    },
    complete: function () {
      var P = Pages.tastingPlay, S = P.state;
      return P.save(true).then(function () {
        var next = S.data.samples.findIndex(function (s, i) { return i !== S.idx && !s.completed; });
        if (next >= 0) {
          UI.toast('Garrafa #' + P.sample().number + ' concluída.');
          S.idx = next; S.step = 0;
          P.drawAll();
          document.getElementById('tm').scrollTo({ top: 0, behavior: 'smooth' });
        } else {
          P.drawRail(); P.drawCard(); P.drawReveal();
          document.getElementById('t-reveal').scrollIntoView({ behavior: 'smooth' });
        }
      });
    },
    reveal: function () {
      var P = Pages.tastingPlay, S = P.state;
      return P.save().then(function () {
        return UI.confirm('Você deseja revelar os vinhos?', 'Depois de revelar, as respostas ficam travadas e as garrafinhas são marcadas como utilizadas.', 'Revelar');
      }).then(function (ok) {
        if (!ok) return;
        document.getElementById('t-reveal').innerHTML = '<div class="t-reveal"><div class="serif" style="font-size:1.6rem;font-style:italic">Tirando as etiquetas…</div></div>';
        return API.call('tastings.reveal', { id: S.data.id }).then(function () {
          return Store.refreshLookups();
        }).then(function () { Router.go('/degustacao/' + S.data.id + '/resultado'); });
      });
    },
    exit: function () {
      var P = Pages.tastingPlay;
      return P.save().then(function () { Router.go('/degustacao/historico'); }, function () { Router.go('/degustacao/historico'); });
    },
    cancel: function () {
      var S = Pages.tastingPlay.state;
      return UI.confirm('Cancelar a degustação?', 'As garrafinhas voltam a ficar disponíveis e as respostas desta sessão são descartadas do histórico.', 'Cancelar degustação').then(function (ok) {
        if (!ok) return;
        return API.call('tastings.cancel', { id: S.data.id }).then(function () { UI.toast('Degustação cancelada.'); Router.go('/degustacao/historico'); });
      });
    }
  }
};

/* ============================== RELATÓRIO ============================== */
Pages.tastingReport = {
  render: function (p) {
    return API.call('tastings.report', { id: p.id }).then(function (r) {
      var agg = {};
      r.aggregate.forEach(function (a) { agg[a.criterion] = a; });
      function tally(icon, label, c) {
        var a = agg[c];
        if (!a) return '';
        return '<div>' + icon + ' ' + esc(label) + ': <b>' + a.hit + '/' + a.total + '</b>' + (a.near ? ' <span class="muted small">(+' + a.near + ' próx.)</span>' : '') + '</div>';
      }
      var html = '<div class="page-head"><div><div class="eyebrow"><a href="#/degustacao/historico">Histórico</a> · ' + fmtDate(r.date) + ' · ' + esc(DIFFICULTY[r.difficulty] ? DIFFICULTY[r.difficulty][0] : '') + '</div>' +
        '<h1>Resultado da degustação</h1><p class="sub">' + esc(r.title) + '</p></div><div class="btn-row"><a class="btn" href="#/quiz?degustacao=' + esc(r.id) + '">Fazer o quiz destes vinhos</a><a class="btn primary" href="#/degustacao/nova">Nova degustação</a></div></div>' +
        '<div class="callout" style="margin-bottom:16px">Para fixar o que você provou: <a href="#/quiz?degustacao=' + esc(r.id) + '"><b>faça o quiz</b></a> com perguntas sobre estas uvas, regiões e as diferenças entre elas.</div>';

      html += '<section class="panel score-hero"><div class="eyebrow">' + plural(r.samples.length, 'vinho analisado', 'vinhos analisados') + '</div>' +
        '<div class="big">' + (r.score === '' || r.score === null ? '—' : fmtNum(r.score, 0)) + '<small>/100</small></div>' +
        '<div class="tally">' + tally('🍇', 'Uvas', 'grape') + tally('🌎', 'Regiões', 'region') + tally('🏳️', 'Países', 'country') + tally('👃', 'Aromas', 'aromas') +
        tally('👅', 'Acidez', 'acidity') + tally('🍂', 'Tanino', 'tannin') + tally('⚖️', 'Corpo', 'body') + '</div>';
      html += '<div class="grid two" style="text-align:left;margin-top:22px;border-top:1px solid var(--line);padding-top:18px">' +
        '<div><div class="eyebrow">Seus pontos fortes</div><div class="serif" style="font-size:1.35rem">' + (r.strengths.length ? esc(r.strengths.join(' · ')) : '<span class="muted">—</span>') + '</div></div>' +
        '<div><div class="eyebrow">Para estudar</div><div class="serif" style="font-size:1.35rem">' + (r.weaknesses.concat(r.to_study).length ? esc(r.weaknesses.concat(r.to_study).join(' · ')) : '<span class="muted">—</span>') + '</div></div></div>';
      var weighted = {};
      (Store.lookups.rules || []).forEach(function (x) { if (x.active && Number(x.weight) > 0) weighted[x.criterion] = true; });
      var noRef = r.samples.some(function (s) { return s.results.some(function (x) { return x.state === 'no_ref' && weighted[x.criterion]; }); });
      if (noRef) html += '<div class="callout" style="text-align:left;margin-top:18px">Alguns critérios aparecem como <b>sem gabarito</b>: o vinho ainda não tem um perfil de referência verificado. ' +
        'Eles não entraram na nota. Cadastre o perfil na página do vinho para que passem a contar.</div>';
      html += '</section>';

      r.samples.forEach(function (s) {
        var w = s.wine;
        html += '<article class="reveal-card"><div class="hd">' + Components.bottle(s.number, { status: 'disponivel', uid: 'rv' }) +
          '<div><div class="eyebrow">Garrafa #' + s.number + '</div><div class="serif" style="font-size:1.6rem;line-height:1.1"><a href="#/vinhos/' + w.id + '">' + esc(w.name) + '</a> <span class="muted">' + esc(w.vintage || '') + '</span></div>' +
          '<div class="small muted">' + esc([w.producer, w.region, w.country].filter(Boolean).join(' · ')) + (w.grapes.length ? ' — ' + esc(w.grapes.map(function (g) { return g.name; }).join(', ')) : '') + (w.abv ? ' · ' + fmtNum(w.abv) + '%' : '') + '</div></div>' +
          '<div class="serif" style="font-size:2.2rem">' + (s.score === '' || s.score === null ? '—' : fmtNum(s.score, 0)) + '</div></div>' +
          '<div class="bd"><div class="tbl-wrap"><table class="tbl"><thead><tr><th>Critério</th><th>Seu palpite</th><th>Resposta</th><th></th><th style="text-align:right">Pontos</th></tr></thead><tbody>' +
          s.results.filter(function (x) { return !(x.state === 'no_ref' && !x.given); }).map(function (x) {
            return '<tr' + (x.state === 'no_ref' ? ' class="muted"' : '') + '><td>' + esc(x.label) + '</td><td>' + (esc(x.given) || '<span class="missing">sem resposta</span>') + '</td>' +
              '<td>' + (x.state === 'no_ref' ? '<span class="missing">sem gabarito</span>' : esc(x.expected)) + '</td><td>' + Components.state(x.state) + '</td>' +
              '<td style="text-align:right" class="nowrap">' + (x.max_points ? fmtNum(x.points) + ' / ' + x.max_points : '—') + '</td></tr>';
          }).join('') + '</tbody></table></div>' +
          (s.free.conclusion ? '<p class="small"><b>Sua conclusão:</b> ' + esc(s.free.conclusion) + '</p>' : '') +
          (s.lessons && s.lessons.length ? '<div class="lessons"><div class="eyebrow">O que aprender com esta garrafa</div>' + s.lessons.map(function (l) {
            return '<div class="lesson ' + esc(l.kind) + '"><b>' + esc(l.title) + '</b><p>' + esc(l.text) + '</p></div>';
          }).join('') + '<p class="small muted">Com base na enciclopédia (uvas, regiões e seus perfis, com fontes nas páginas de cada uma).</p></div>' : '') +
          '</div></article>';
      });

      if (r.samples.length > 1) {
        var rows = [['Uva', function (w) { return w.grapes.map(function (g) { return g.name; }).join(', '); }],
          ['Acidez', prof('acidity')], ['Tanino', prof('tannin')], ['Corpo', prof('body')],
          ['Aromas', function (w) { return w.aromas.slice(0, 5).join(', '); }],
          ['Álcool', function (w) { return w.abv ? fmtNum(w.abv) + '%' : ''; }]];
        html += '<h2>Comparação entre os vinhos</h2><div class="panel tbl-wrap"><table class="tbl cmp"><thead><tr><th></th>' +
          r.samples.map(function (s) { return '<th>#' + s.number + ' · ' + esc(s.wine.name) + '</th>'; }).join('') + '</tr></thead><tbody>' +
          rows.map(function (row) {
            var vals = r.samples.map(function (s) { return row[1](s.wine) || ''; });
            var differ = vals.some(function (v) { return v !== vals[0]; });
            return '<tr><td class="muted">' + row[0] + '</td>' + vals.map(function (v) { return '<td class="' + (differ ? 'hl' : '') + '">' + (v ? esc(v) : '<span class="missing">—</span>') + '</td>'; }).join('') + '</tr>';
          }).join('') + '</tbody></table>' +
          '<p class="small muted">Em negrito: características que diferem entre os vinhos. Valores vêm do perfil de referência de cada vinho' +
          (r.samples.some(function (s) { return s.wine.profile && !s.wine.profile_trusted; }) ? ' (alguns ainda <b>não verificados</b>)' : '') + '.</p></div>';
      }
      return html;
      function prof(k) { return function (w) { return w.profile && w.profile[k] ? Store.scaleLabel(k, w.profile[k]) + (w.profile_trusted ? '' : ' *') : ''; }; }
    });
  }
};

Pages.tastingHistory = {
  render: function () {
    return API.call('tastings.list').then(function (list) {
      var html = '<div class="page-head"><div><div class="eyebrow">Degustação</div><h1>Histórico</h1><p class="sub">' + plural(list.length, 'sessão', 'sessões') + '.</p></div>' +
        '<a class="btn primary" href="#/degustacao/nova">Nova degustação</a></div>';
      if (!list.length) return html + Components.empty('Nenhuma degustação ainda.', 'Sua primeira degustação às cegas aparece aqui.');
      html += '<div class="list">' + list.map(function (t) {
        var href = t.status === 'revelada' ? '#/degustacao/' + t.id + '/resultado' : t.status === 'cancelada' ? null : '#/degustacao/' + t.id;
        var inner = '<div><div class="t">' + esc(t.title) + '</div><div class="m">' + fmtDate(t.date, true) + ' · ' + plural(t.count, 'vinho', 'vinhos') + ' · ' +
          esc(DIFFICULTY[t.difficulty] ? DIFFICULTY[t.difficulty][0] : '') + ' · ' + statusLabel(t.status) + '</div></div>' +
          '<div class="serif" style="font-size:1.6rem">' + (t.status === 'revelada' && t.score !== '' ? fmtNum(t.score, 0) : '') + '</div>';
        return href ? '<a class="row" href="' + href + '">' + inner + '</a>' : '<div class="row muted">' + inner + '</div>';
      }).join('') + '</div>';
      return html;
    });
  }
};

  <script>
/* ============================================================
   IA: pesquisa com fontes + fila de revisão.
   Nada da IA entra no sistema sem passar por Pages.review.
   ============================================================ */
var FIELD_LABELS = {
  color: 'cor', origin: 'origem', synonyms: 'sinônimos', main_countries: 'países principais', main_regions: 'regiões principais',
  general_profile: 'perfil geral', ripening: 'ciclo de maturação', skin_thickness: 'espessura da casca', bunch_size: 'tamanho do cacho',
  berry_size: 'tamanho da baga', vigor: 'vigor / produtividade', disease_sensitivity: 'sensibilidade a doenças', climate: 'clima',
  soils: 'solos', how_to_recognize: 'como reconhecer', description: 'descrição', confusions_text: 'uvas parecidas',
  type: 'tipo', classification: 'classificação', production_method: 'método de produção', aging: 'estágio / maturação',
  oak: 'madeira', aging_time: 'tempo de envelhecimento', abv: 'teor alcoólico', residual_sugar: 'açúcar residual',
  acidity_gl: 'acidez total', serving_temp: 'temperatura de serviço', pairing: 'harmonização', curiosities: 'curiosidades'
};
var SCALE_LABELS = { acidity: 'Acidez', tannin: 'Tanino', body: 'Corpo', alcohol: 'Álcool', sweetness: 'Dulçor', intensity: 'Intensidade', finish: 'Persistência' };

var AiUI = {
  /** Roda uma pesquisa mostrando progresso; ao final oferece ir para a revisão. */
  run: function (method, args, what) {
    var m = UI.modal('<div class="eyebrow">Pesquisa com IA</div><h2>' + esc(what) + '</h2>' +
      '<p class="serif" style="font-size:1.2rem;font-style:italic" id="ai-progress">Buscando fontes de referência…</p>' +
      '<p class="muted small">A pesquisa consulta a web e costuma levar de 30 segundos a 2 minutos. Nada é gravado sem a sua revisão.</p>', { sticky: true });
    var msgs = ['Buscando fontes de referência…', 'Lendo as páginas encontradas…', 'Conferindo cada dado com a fonte…', 'Organizando as propostas…'];
    var i = 0;
    var timer = setInterval(function () { var el = document.getElementById('ai-progress'); if (el) el.textContent = msgs[Math.min(++i, msgs.length - 1)]; }, 12000);
    return API.call(method, args).then(function (r) {
      clearInterval(timer);
      AiUI.setBadge(null);
      m.querySelector('.modal').innerHTML = '<div class="eyebrow">Pesquisa concluída</div><h2>' + plural(r.proposals, 'proposta', 'propostas') + ' para revisar</h2>' +
        '<p class="muted small">' + plural(r.searches || 0, 'busca', 'buscas') + ' · custo estimado US$ ' + fmtNum(r.cost_usd, 2) + '</p>' +
        (r.not_found ? '<div class="callout" style="margin:12px 0"><b>Sem fonte encontrada:</b> ' + esc(r.not_found) + '</div>' : '') +
        '<div class="btn-row" style="justify-content:flex-end;margin-top:18px"><button class="btn" data-action="close-modal">Fechar</button>' +
        (r.proposals ? '<button class="btn primary" data-action="close-modal-go" data-to="/revisao">Revisar agora</button>' : '') + '</div>';
      return r;
    }).catch(function (e) {
      clearInterval(timer);
      UI.closeModal();
      throw e;
    });
  },
  setBadge: function (n) {
    var apply = function (count) {
      var a = document.querySelector('.nav a.item[href="#/revisao"]');
      if (!a) return;
      var b = a.querySelector('.badge');
      if (!b) { b = document.createElement('span'); b.className = 'badge'; a.appendChild(b); }
      b.textContent = count || '';
      b.style.display = count ? '' : 'none';
    };
    if (n !== null && n !== undefined) return apply(n);
    API.call('ai.pending').then(function (list) { apply(list.length); }).catch(function () {});
  },
  /** Painel de configuração (usado em Pages.settings). */
  panel: function (s) {
    return '<section class="panel" id="ai-panel"><h2 style="margin-top:0">Inteligência artificial</h2>' +
      '<p class="muted">O Claude pesquisa na web e propõe dados com o link da fonte. Nada é gravado sem a sua revisão em <a href="#/revisao">Revisão da IA</a>.</p>' +

  <script>
/* ============================================================
   Uvas — Fase 2: comparação lado a lado e genealogia.
   Tudo é derivado dos dados cadastrados; o que falta aparece como "—".

var GrapeCompare = {
  SCALES: [['acidity', 'Acidez'], ['tannin', 'Tanino'], ['body', 'Corpo'], ['alcohol', 'Álcool'], ['intensity', 'Intensidade'], ['finish', 'Persistência']],

  /** Posição média de um valor de escala ("media..alta" → 4). */
  pos: function (scale, v) {
    if (blank(v)) return null;
    var levels = Store.scale(scale), parts = String(v).split('..'), ps = [];
    parts.forEach(function (k) { levels.forEach(function (l) { if (l.key === k) ps.push(l.position); }); });
    return ps.length ? ps.reduce(function (a, b) { return a + b; }, 0) / ps.length : null;
  },

  scaleText: function (scale, v) {
    return blank(v) ? '' : String(v).split('..').map(function (k) { return Store.scaleLabel(scale, k); }).join(' a ');
  },

  fruit: function (g) {
    var c = {};
    g.aromas.forEach(function (a) { if (a.category === 'Frutas') c[a.subcategory] = (c[a.subcategory] || 0) + 1; });
    var keys = Object.keys(c).sort(function (a, b) { return c[b] - c[a]; });
    return keys.slice(0, 2).join(' / ');
  },

  /** Diferenças calculadas: escalas com 2+ níveis de distância e aromas exclusivos. */
  differences: function (data) {
    var G = data.grapes, out = [];
    GrapeCompare.SCALES.forEach(function (s) {
      var vals = G.map(function (g) { return { g: g, p: GrapeCompare.pos(s[0], g.profile && g.profile[s[0]]) }; }).filter(function (x) { return x.p !== null; });
      if (vals.length < 2) return;
      var levels = Store.scale(s[0]).length;
      var gap = levels >= 5 ? 2 : 1;
      vals.sort(function (a, b) { return b.p - a.p; });
      if (vals[0].p - vals[vals.length - 1].p >= gap) {
        out.push('<b>' + esc(s[1]) + '</b>: ' + vals.map(function (x) { return esc(x.g.name) + ' (' + esc(GrapeCompare.scaleText(s[0], x.g.profile[s[0]])) + ')'; }).join(' › '));
      }
    });
    if (G.every(function (g) { return g.aromas.length; })) {
      G.forEach(function (g) {
        var others = {};
        G.forEach(function (o) { if (o !== g) o.aromas.forEach(function (a) { others[a.id] = true; }); });
        var only = g.aromas.filter(function (a) { return !others[a.id]; });
        if (only.length) out.push('<b>Só em ' + esc(g.name) + '</b>: ' + esc(only.map(function (a) { return a.name; }).join(', ')));
      });
    }
    return out;
  },

  table: function (data, opts) {
    opts = opts || {};
    var G = data.grapes;
    var shared = {};
    if (G.length > 1) {
      G[0].aromas.forEach(function (a) { if (G.every(function (g) { return g.aromas.some(function (x) { return x.id === a.id; }); })) shared[a.id] = true; });
    }
    function cell(v) { return blank(v) ? '<span class="missing">—</span>' : esc(v); }
    function row(label, fn) { return '<tr><td class="muted nowrap">' + esc(label) + '</td>' + G.map(function (g) { return '<td>' + fn(g) + '</td>'; }).join('') + '</tr>'; }
    var html = '<div class="tbl-wrap"><table class="tbl cmp"><thead><tr><th>Característica</th>' +
      G.map(function (g) { return '<th><a href="#/uvas/' + g.id + '">' + esc(g.name) + '</a></th>'; }).join('') + '</tr></thead><tbody>';
    if (!opts.compact) {
      html += row('Cor', function (g) { return cell(g.color); }) + row('Origem', function (g) { return cell(g.origin); }) +
        row('Regiões principais', function (g) { return cell(g.main_regions); }) + row('Clima', function (g) { return cell(g.climate); });
    }
    GrapeCompare.SCALES.forEach(function (s) {
      var vals = G.map(function (g) { return GrapeCompare.pos(s[0], g.profile && g.profile[s[0]]); });
      var known = vals.filter(function (v) { return v !== null; });
      var spread = known.length > 1 ? Math.max.apply(null, known) - Math.min.apply(null, known) : 0;
      html += '<tr><td class="muted nowrap">' + esc(s[1]) + '</td>' + G.map(function (g, i) {
        var v = g.profile && g.profile[s[0]];
        var hl = spread >= (Store.scale(s[0]).length >= 5 ? 2 : 1) && (vals[i] === Math.max.apply(null, known) || vals[i] === Math.min.apply(null, known));
        return '<td class="' + (hl ? 'hl' : '') + '">' + (blank(v) ? '<span class="missing">—</span>' :
          '<div class="bar" style="max-width:120px;margin-bottom:4px">' + Store.scale(s[0]).map(function (l) {
            var p = GrapeCompare.pos(s[0], v);
            var parts = String(v).split('..');
            var on = parts.some(function (k) { return k === l.key; }) || (parts.length === 2 && l.position > GrapeCompare.pos(s[0], parts[0]) && l.position < GrapeCompare.pos(s[0], parts[1]));
            return '<i class="' + (on ? 'on' : '') + '"></i>';
          }).join('') + '</div>' + esc(GrapeCompare.scaleText(s[0], v))) + '</td>';
      }).join('') + '</tr>';
    });
    html += row('Fruta', function (g) { return cell(GrapeCompare.fruit(g)); });
    html += row('Aromas', function (g) {
      return g.aromas.length ? '<div class="chips">' + g.aromas.map(function (a) {
        return '<span class="chip"' + (shared[a.id] ? ' style="border-color:var(--wine);color:var(--wine)" title="Em comum"' : '') + '>' + esc(a.name) + '</span>';
      }).join('') + '</div>' : '<span class="missing">—</span>';
    });
    if (!opts.compact) html += row('Como reconhecer', function (g) { return '<span class="small">' + cell(g.how_to_recognize) + '</span>'; });
    html += '</tbody></table></div>';
    return html;
  },

  howTo: function (data) {
    if (!data.pairs.length) return '';
    return '<h3>Como diferenciar</h3><div class="list">' + data.pairs.map(function (p) {
      return '<div class="row"><div><div class="t" style="font-size:1.05rem">' + esc(p.a) + ' × ' + esc(p.b) + ' ' + Components.src(p.source) + '</div>' +
        '<div class="m" style="color:var(--ink-2)">' + (p.how ? esc(p.how) : Components.missing('Não cadastrado')) + '</div></div><div></div></div>';
    }).join('') + '</div>';
  }
};

/* ============================== GENEALOGIA ============================== */
Pages.genealogy = {
  render: function (p) {
    return API.call('grapes.genealogy').then(function (data) {
      Pages.genealogy.data = data;
      var html = '<div class="page-head"><div><div class="eyebrow">Estudar</div><h1>Genealogia das uvas</h1>' +
        '<p class="sub">Somente relações de parentesco cadastradas, cada uma com a sua fonte.</p></div></div>';
      if (!data.edges.length) {
        return html + Components.empty('Nenhuma relação genética cadastrada ainda.',
          'Use “Pesquisar com IA” na página de uma uva: os pais confirmados por DNA chegam com fonte e passam pela sua revisão.', '<a class="btn" href="#/uvas">Ir para Uvas</a>');
      }
      var degree = {};
      data.edges.forEach(function (e) { degree[e.parent] = (degree[e.parent] || 0) + 1; degree[e.child] = (degree[e.child] || 0) + 1; });
      var focus = p.query.id && degree[p.query.id] ? p.query.id : Object.keys(degree).sort(function (a, b) { return degree[b] - degree[a]; })[0];
      Pages.genealogy.focus = focus;
      html += '<div class="grid" style="grid-template-columns:minmax(0,1fr) 300px;align-items:start" id="gen-grid">' +
        '<section class="panel" style="padding:10px"><div id="gen-svg"></div></section>' +
        '<aside><div class="panel" id="gen-info"></div>' +
        '<div class="panel"><label class="f">Ir para</label><select class="in" data-change="focus">' +
        Components.options(data.nodes.slice().sort(function (a, b) { return a.name.localeCompare(b.name, 'pt'); }), focus) + '</select>' +
        '<p class="small muted" style="margin-top:10px">' + plural(data.nodes.length, 'uva', 'uvas') + ' · ' + plural(data.edges.length, 'relação', 'relações') + '</p></div></aside></div>';
      return html;
    });
  },
  mount: function () {
    if (!Pages.genealogy.data || !Pages.genealogy.data.edges.length) return;
    if (window.innerWidth < 900) document.getElementById('gen-grid').style.gridTemplateColumns = '1fr';
    Pages.genealogy.draw();
  },
  draw: function () {
    var D = Pages.genealogy.data, f = Pages.genealogy.focus;
    var byId = {};
    D.nodes.forEach(function (n) { byId[n.id] = n; });
    function parentsOf(id) { return D.edges.filter(function (e) { return e.child === id; }).map(function (e) { return e.parent; }); }
    function childrenOf(id) { return D.edges.filter(function (e) { return e.parent === id; }).map(function (e) { return e.child; }); }

    var parents = parentsOf(f);
    var grand = [];
    parents.forEach(function (pId) { parentsOf(pId).forEach(function (g) { grand.push({ id: g, of: pId }); }); });
    var kids = childrenOf(f).sort(function (a, b) { return byId[a].name.localeCompare(byId[b].name, 'pt'); });

    var host = document.getElementById('gen-svg');
    var W = Math.max(340, host.clientWidth || 760), nodeW = W < 520 ? 112 : 132, nodeH = 40, rowH = 100;
    var perRow = Math.max(2, Math.floor(W / (nodeW + 24)));
    var kidRows = Math.max(1, Math.ceil(kids.length / perRow));
    var levels = (grand.length ? 1 : 0) + (parents.length ? 1 : 0) + 1 + (kids.length ? kidRows : 0);
    var H = levels * rowH + 20;
    var y = 20, pos = {};
    function place(list, yy, keyFn) {
      var n = list.length, gap = Math.min(nodeW + 40, (W - 20) / Math.max(n, 1));
      var x0 = W / 2 - gap * (n - 1) / 2;
      list.forEach(function (item, i) { pos[keyFn ? keyFn(item) : item] = { x: x0 + i * gap, y: yy }; });
    }
    if (grand.length) { place(grand, y, function (g) { return 'g:' + g.id + ':' + g.of; }); y += rowH; }
    if (parents.length) { place(parents, y); y += rowH; }
    pos[f] = { x: W / 2, y: y };
    var focusY = y;
    y += rowH;
    for (var r = 0; r < kidRows; r++) { place(kids.slice(r * perRow, (r + 1) * perRow), y); y += rowH; }

    function node(id, key, isFocus) {
      var n = byId[id], p = pos[key || id];

      '<div class="serif" style="font-size:1.8rem;line-height:1.1;margin:4px 0">' + esc(n.name) + '</div>' +

      }).join('') + '</div>' +

    var sel = document.querySelector('[data-change="focus"]');

      return '<div class="page-head"><div><div class="eyebrow">Estudar</div><h1>' + esc(r.title) + '</h1>' +
        '<p class="sub">' + (tid ? 'Perguntas sobre as uvas, regiões e vinhos desta degustação.' : 'Perguntas sorteadas da enciclopédia: uvas, regiões, aromas, estrutura e confusões clássicas.') + '</p></div>' +
        '<div class="btn-row">' + (tid ? '<a class="btn" href="#/degustacao/' + esc(tid) + '/resultado">Voltar ao resultado</a>' : '') +
        '<button class="btn" data-action="restart">Novo quiz</button></div></div><div id="quiz-box"></div>';
    });
  },
  mount: function () { Pages.quiz.draw(); },
  draw: function () {
    var S = Pages.quiz.state, box = document.getElementById('quiz-box');
    if (!box) return;
    var qs = S.data.questions;
    if (!qs.length) { box.innerHTML = Components.empty('Ainda não há dados suficientes para montar perguntas.', 'Preencha fichas de uvas e regiões.'); return; }
    if (S.i >= qs.length) {
      var pct = Math.round(S.score / qs.length * 100);
      box.innerHTML = '<section class="panel score-hero"><div class="eyebrow">Resultado</div><div class="big">' + S.score + '<small>/' + qs.length + '</small></div>' +
        '<p class="muted">' + (pct >= 80 ? 'Excelente! Você domina estes vinhos.' : pct >= 50 ? 'Bom caminho — revise as explicações das que errou.' : 'Vale estudar as fichas destas uvas e regiões e tentar de novo.') + '</p>' +
        '<div class="btn-row" style="justify-content:center"><button class="btn primary" data-action="restart">Fazer outro quiz</button>' +
        '<a class="btn" href="#/uvas">Ver fichas das uvas</a></div></section>';
      return;
    }
    var q = qs[S.i];
    box.innerHTML = '<section class="panel quiz-card"><div class="eyebrow">Pergunta ' + (S.i + 1) + ' de ' + qs.length + ' · ' + S.score + ' acerto(s)</div>' +
      Components.meter(Math.round(S.i / qs.length * 100)) +
      '<h2 class="serif" style="margin:16px 0">' + esc(q.question) + '</h2><div class="quiz-options">' +
      q.options.map(function (o, k) { return '<button class="quiz-opt" data-action="answer" data-k="' + k + '">' + esc(o) + '</button>'; }).join('') +
      '</div><div id="quiz-feedback"></div></section>';
  },
  actions: {
    answer: function (btn) {
      var S = Pages.quiz.state;
      if (S.answered) return;
      S.answered = true;
      var q = S.data.questions[S.i], k = Number(btn.getAttribute('data-k')), ok = k === q.answer;
      if (ok) S.score++;
      document.querySelectorAll('.quiz-opt').forEach(function (b, idx) {
        b.disabled = true;
        if (idx === q.answer) b.classList.add('right');
        else if (idx === k) b.classList.add('wrong');
      });
      var src = q.source && /^https?:/.test(q.source) ? ' <a href="' + esc(q.source) + '" target="_blank" rel="noopener">fonte ↗</a>' : '';
      document.getElementById('quiz-feedback').innerHTML = '<div class="lesson ' + (ok ? 'faz-sentido' : 'confusao') + '" style="margin-top:16px"><b>' + (ok ? 'Acertou!' : 'Resposta: ' + esc(q.options[q.answer])) + '</b>' +
        (q.explanation ? '<p>' + esc(q.explanation) + src + '</p>' : '') + '</div>' +
        '<div class="btn-row" style="justify-content:flex-end;margin-top:12px"><button class="btn primary" data-action="next">' + (S.i + 1 < S.data.questions.length ? 'Próxima →' : 'Ver resultado') + '</button></div>';
    },
    next: function () { var S = Pages.quiz.state; S.i++; S.answered = false; Pages.quiz.draw(); window.scrollTo(0, 0); },
    restart: function () { Router.render(); }
  }
};
</script>

  <script>App.start();</script>
</body>
</html>
