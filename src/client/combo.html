<script>
/* ============================================================
   Busca ao escolher de uma lista (todas as telas).
   - Lista de escolha única com 7+ opções: vira um campo onde se digita a 1ª letra (ou o nome inteiro) e a lista filtra;
     começa-com vem primeiro, depois palavra-que-começa, depois contém; sem diferenciar acentos/maiúsculas.
   - Lista de seleção múltipla com 7+ opções: ganha um campo "Filtrar…" acima (o que já está marcado nunca some).
   O <select> original continua no lugar, escondido, e é ele quem guarda o valor: o resto do app não muda.
   Opt-out: data-nocombo no <select>.
   ============================================================ */
var Combo = (function () {
  var MIN = 7;
  function E(s) { return String(s === null || s === undefined ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function norm(s) { return String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().trim(); }

  /** Pontuação: 0 começa com · 1 uma palavra começa · 2 contém · -1 não bate. */
  function rank(text, q) {
    var t = norm(text);
    if (!q) return 0;
    if (t.indexOf(q) === 0) return 0;
    if (new RegExp('(^|[^a-z0-9])' + q.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')).test(t)) return 1;
    return t.indexOf(q) >= 0 ? 2 : -1;
  }
  function filter(items, q) {
    q = norm(q);
    return items.map(function (it, i) { return { it: it, r: rank(it.t, q), i: i }; })
      .filter(function (x) { return x.r >= 0; })
      .sort(function (a, b) { return a.r - b.r || a.i - b.i; }).map(function (x) { return x.it; });
  }
  function itemsOf(sel) {
    return [].map.call(sel.options, function (o) { return { v: o.value, t: o.text, on: o.selected }; });
  }
  function selText(sel) {
    var o = sel.options[sel.selectedIndex];
    return o && o.value !== '' ? o.text : '';
  }

  /* ---------- Escolha única ---------- */
  function single(sel) {
    sel.setAttribute('data-combo', '1');
    var wrap = document.createElement('div'); wrap.className = 'combo';
    var input = document.createElement('input');
    input.type = 'text'; input.className = 'in combo-in'; input.autocomplete = 'off'; input.spellcheck = false;
    input.setAttribute('role', 'combobox'); input.setAttribute('aria-autocomplete', 'list');
    var empty = sel.querySelector('option[value=""]');
    input.placeholder = empty ? empty.text : 'Digite para buscar…';
    if (sel.required) { input.required = true; sel.required = false; }
    var list = document.createElement('div'); list.className = 'combo-list'; list.hidden = true; list.setAttribute('role', 'listbox');
    wrap.appendChild(input); wrap.appendChild(list);
    sel.parentNode.insertBefore(wrap, sel);
    sel.style.display = 'none';
    if (sel.style.maxWidth) wrap.style.maxWidth = sel.style.maxWidth;
    input.value = selText(sel);
    var shown = [], hi = -1;

    function draw(q) {
      var items = itemsOf(sel), blank = items.filter(function (x) { return x.v === ''; })[0];
      var rest = items.filter(function (x) { return x.v !== ''; });
      shown = filter(rest, q);
      if (blank && !norm(q)) shown.unshift(blank);
      hi = shown.length ? 0 : -1;
      if (norm(q) === norm(selText(sel)) && shown.length > 1) { var k = shown.findIndex(function (x) { return x.on; }); if (k >= 0) hi = k; }
      list.innerHTML = shown.length ? shown.map(function (x, k) {
        return '<div class="combo-opt' + (k === hi ? ' hi' : '') + (x.on ? ' on' : '') + '" role="option" data-k="' + k + '">' + (x.v === '' ? '<span class="muted">' + E(x.t) + '</span>' : E(x.t)) + '</div>';
      }).join('') : '<div class="combo-none">Nada encontrado</div>';
      var cur = list.querySelector('.hi'); if (cur) cur.scrollIntoView({ block: 'nearest' });
    }
    function open() { if (!list.hidden) return; list.hidden = false; draw(''); input.select(); }
    function close() { list.hidden = true; input.value = selText(sel); }
    function pick(k) {
      var x = shown[k]; if (!x) return;
      sel.value = x.v;
      list.hidden = true; input.value = selText(sel); input.blur();
      sel.dispatchEvent(new Event('input', { bubbles: true }));
      sel.dispatchEvent(new Event('change', { bubbles: true }));
    }
    input.addEventListener('focus', open);
    input.addEventListener('click', open);
    input.addEventListener('input', function () { list.hidden = false; draw(input.value); });
    input.addEventListener('keydown', function (e) {
      if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
        e.preventDefault(); if (list.hidden) open();
        if (!shown.length) return;
        hi = (hi + (e.key === 'ArrowDown' ? 1 : -1) + shown.length) % shown.length;
        [].forEach.call(list.querySelectorAll('.combo-opt'), function (n, k) { n.classList.toggle('hi', k === hi); });
        var cur = list.querySelector('.hi'); if (cur) cur.scrollIntoView({ block: 'nearest' });
      } else if (e.key === 'Enter') { if (!list.hidden) { e.preventDefault(); pick(hi); } }
      else if (e.key === 'Escape') { close(); input.blur(); }
      else if (e.key === 'Tab') { if (!list.hidden && shown.length && norm(input.value) && norm(input.value) !== norm(selText(sel))) pick(hi); }
    });
    // pointerdown (e não click): senão o campo perde o foco antes e a lista some.
    var lastPick = 0;
    function pickOnce(e) {
      var n = e.target.closest('.combo-opt'); if (!n) return;
      e.preventDefault();
      if (Date.now() - lastPick < 400) return;
      lastPick = Date.now(); pick(Number(n.getAttribute('data-k')));
    }
    list.addEventListener('pointerdown', pickOnce);
    list.addEventListener('mousedown', function (e) { e.preventDefault(); });   // não tira o foco do campo
    list.addEventListener('click', pickOnce);                                  // reserva, se o navegador não enviar pointerdown
    input.addEventListener('blur', function () { setTimeout(function () { if (document.activeElement !== input) close(); }, 120); });
    // Acompanha mudanças feitas pelo código (opções trocadas, valor definido).
    sel.__comboSync = function () {
      if (document.activeElement === input) return;
      var t = selText(sel); if (input.value !== t) input.value = t;
      var e2 = sel.querySelector('option[value=""]'); var ph = e2 ? e2.text : 'Digite para buscar…'; if (input.placeholder !== ph) input.placeholder = ph;
    };
  }

  /* ---------- Seleção múltipla ---------- */
  function multi(sel) {
    sel.setAttribute('data-combo', '1');
    var input = document.createElement('input');
    input.type = 'search'; input.className = 'in combo-filter'; input.placeholder = 'Filtrar…'; input.autocomplete = 'off';
    sel.parentNode.insertBefore(input, sel);
    var all = itemsOf(sel), chosen = {};
    all.forEach(function (x) { if (x.on) chosen[x.v] = true; });
    sel.addEventListener('change', function () { [].forEach.call(sel.options, function (o) { chosen[o.value] = o.selected; }); });
    input.addEventListener('input', function () {
      var q = input.value, match = filter(all, q), ids = {};
      match.forEach(function (x) { ids[x.v] = true; });
      var extra = all.filter(function (x) { return chosen[x.v] && !ids[x.v]; });
      sel.innerHTML = match.concat(extra).map(function (x) { return '<option value="' + E(x.v) + '"' + (chosen[x.v] ? ' selected' : '') + '>' + E(x.t) + '</option>'; }).join('');
    });
  }

  function scan(root) {
    [].forEach.call((root || document).querySelectorAll('select:not([data-combo]):not([data-nocombo])'), function (sel) {
      if (sel.options.length < MIN || !sel.parentNode) return;
      if (sel.multiple) multi(sel); else single(sel);
    });
  }

  var timer = null;
  function schedule() { if (timer) return; timer = setTimeout(function () { timer = null; scan(document); }, 30); }
  function init() {
    new MutationObserver(schedule).observe(document.body, { childList: true, subtree: true });
    setInterval(function () { [].forEach.call(document.querySelectorAll('select[data-combo]'), function (s) { if (s.__comboSync) s.__comboSync(); }); }, 500);
    document.addEventListener('pointerdown', function (e) {
      if (e.target.closest && e.target.closest('.combo')) return;
      [].forEach.call(document.querySelectorAll('.combo-list:not([hidden])'), function (l) { var i = l.parentNode.querySelector('.combo-in'); if (i) i.blur(); });
    });
    scan(document);
  }
  return { init: init, scan: scan, rank: rank, norm: norm };
})();
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', Combo.init); else Combo.init();
</script>
