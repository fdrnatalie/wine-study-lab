<script>
/* ============================================================
   Núcleo do front-end: API, estado, roteador, utilidades.
   Páginas se registram em Pages[nome] = { render(params), mount?(root, params), actions? }.
   ============================================================ */

/**
 * Chamadas ao servidor.
 * - Site (GitHub Pages): window.WSL_CONFIG.apiUrl → POST para o Apps Script (doPost) com o token da sessão.
 * - Dentro do Apps Script (interface antiga / demonstração): google.script.run.api.
 */
var SessionStore = {
  KEY: 'wsl-session',
  token: function () { try { return localStorage.getItem(SessionStore.KEY) || ''; } catch (e) { return ''; } },
  set: function (t) { try { if (t) localStorage.setItem(SessionStore.KEY, t); else localStorage.removeItem(SessionStore.KEY); } catch (e) { /* sem armazenamento */ } }
};

var API = {
  remote: function () { return !!(window.WSL_CONFIG && window.WSL_CONFIG.apiUrl); },
  call: function (method, args) {
    if (API.remote()) return API.post_(method, args);
    return new Promise(function (resolve, reject) {
      google.script.run
        .withSuccessHandler(function (s) {
          var r;
          try { r = JSON.parse(s); } catch (e) { return reject(new Error('Resposta inválida do servidor.')); }
          if (r.ok) resolve(r.data); else reject(new Error(r.error));
        })
        .withFailureHandler(function (e) { reject(e instanceof Error ? e : new Error(String(e && e.message || e))); })
        .api(method, args || {});
    });
  },
  post_: function (method, args) {
    // text/plain evita a checagem prévia de CORS (o Apps Script não responde a OPTIONS).
    return fetch(window.WSL_CONFIG.apiUrl, {
      method: 'POST', redirect: 'follow', headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ method: method, args: args || {}, token: SessionStore.token() })
    }).then(function (res) {
      if (!res.ok) throw new Error('Servidor indisponível (' + res.status + '). Tente de novo.');
      return res.json();
    }, function () { throw new Error('Sem conexão com o servidor.'); }).then(function (r) {
      if (r.ok) return r.data;
      if (r.auth) { SessionStore.set(''); Login.show(r.error); }
      throw new Error(r.error || 'Erro no servidor.');
    });
  }
};

/** Tela de login (só no site). Usa o botão oficial "Fazer login com o Google". */
var Login = {
  shown: false,
  show: function (msg) {
    if (Login.shown) { Login.message(msg); return; }
    Login.shown = true;
    var el = document.createElement('div');
    el.id = 'login';
    el.className = 'login-screen';
    el.innerHTML = '<div class="login-card"><svg class="mark" viewBox="0 0 32 32" aria-hidden="true"><path d="M9 3h14c0 7-2 12-7 13-5-1-7-6-7-13Z" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M10.2 8h11.6c-.5 4.3-2.4 6.7-5.8 7.3-3.4-.6-5.3-3-5.8-7.3Z" fill="var(--wine)"/><path d="M16 16v10M11 28h10" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>' +
      '<h1 class="serif">Wine Study Lab</h1><p class="muted">Laboratório de degustação e estudo de vinhos. Entre com a sua conta Google: suas garrafinhas, degustações e anotações ficam só para você.</p>' +
      '<div id="login-btn" class="login-btn"></div><p class="small muted" id="login-msg"></p>' +
      '<p class="small muted">Não guardamos senha. Usamos só seu nome e e-mail do Google para identificar sua conta.</p></div>';
    document.body.appendChild(el);
    Login.message(msg);
    Login.loadGis_().then(function () {
      google.accounts.id.initialize({ client_id: window.WSL_CONFIG.clientId, callback: Login.onCredential_, ux_mode: 'popup' });
      google.accounts.id.renderButton(document.getElementById('login-btn'), { theme: 'outline', size: 'large', text: 'signin_with', shape: 'pill', locale: 'pt-BR' });
    }).catch(function () { Login.message('Não consegui carregar o login do Google. Verifique a conexão.'); });
  },
  message: function (msg) { var m = document.getElementById('login-msg'); if (m) m.textContent = msg || ''; },
  loadGis_: function () {
    if (window.google && google.accounts && google.accounts.id) return Promise.resolve();
    return new Promise(function (resolve, reject) {
      var sc = document.createElement('script');
      sc.src = 'https://accounts.google.com/gsi/client';
      sc.async = true; sc.onload = resolve; sc.onerror = reject;
      document.head.appendChild(sc);
    });
  },
  onCredential_: function (resp) {
    Login.message('Entrando…');
    API.call('auth.login', { credential: resp.credential, user_agent: navigator.userAgent.slice(0, 200) }).then(function (r) {
      SessionStore.set(r.token);
      var el = document.getElementById('login');
      if (el) el.remove();
      Login.shown = false;
      App.start();
    }).catch(function (e) { Login.message(e.message); });
  },
  logout: function () {
    var t = SessionStore.token();
    SessionStore.set('');
    if (API.remote() && t) {
      fetch(window.WSL_CONFIG.apiUrl, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ method: 'auth.logout', token: t }) }).catch(function () {});
    }
    try { google.accounts.id.disableAutoSelect(); } catch (e) { /* sem GIS */ }
    location.hash = '';
    location.reload();
  }
};

/** País → regiões → sub-regiões (listas em cascata nos formulários). */
var Geo = {
  byId: function (id) { var L = Store.lookups.regions; for (var i = 0; i < L.length; i++) if (L[i].id === id) return L[i]; return null; },
  isSub: function (id) { var r = id && Geo.byId(id); return !!(r && r.parent_id); },
  top: function (id) { var r = id && Geo.byId(id); return r ? (r.parent_id || r.id) : ''; },
  regions: function (countryId) {
    return Store.lookups.regions.filter(function (r) { return !r.parent_id && (!countryId || r.country_id === countryId); });
  },
  subs: function (regionId, countryId) {
    return Store.lookups.regions.filter(function (r) { return r.parent_id && (regionId ? r.parent_id === regionId : (!countryId || r.country_id === countryId)); });
  },
  label_: function (r, withCountry) { return { id: r.id, name: r.name + (withCountry ? ' (' + Store.name('countries', r.country_id) + ')' : '') }; },
  regionOptions: function (countryId, sel) {
    var regs = Geo.regions(countryId);
    return Components.options(regs.map(function (r) { return Geo.label_(r, !countryId); }), sel, regs.length ? '—' : 'Nenhuma região cadastrada');
  },
  subOptions: function (regionId, sel, countryId) {
    if (!regionId) return '<option value="">Escolha a região primeiro</option>';
    var subs = Geo.subs(regionId, countryId);
    return Components.options(subs.map(function (r) { return Geo.label_(r, false); }), sel, subs.length ? '—' : 'Sem sub-regiões cadastradas');
  }
};

/** Estado compartilhado: dados de apoio (listas para selects) carregados uma vez. */
var Store = {
  lookups: null,
  app: {},
  dashboard: null,
  refreshLookups: function () {
    return API.call('lookups').then(function (l) { Store.lookups = l; return l; });
  },
  name: function (kind, id) {
    var list = Store.lookups && Store.lookups[kind] || [];
    for (var i = 0; i < list.length; i++) if (list[i].id === id) return list[i].name;
    return '';
  },
  scale: function (name) { return (Store.lookups && Store.lookups.scales[name]) || []; },
  scaleLabel: function (name, key) {
    var s = Store.scale(name);
    for (var i = 0; i < s.length; i++) if (s[i].key === key) return s[i].label;
    return key || '';
  }
};

var Pages = {};

var Router = {
  routes: [
    [/^\/?$/, 'dashboard'],
    [/^\/dashboard$/, 'dashboard'],
    [/^\/busca$/, 'search'],
    [/^\/vinhos$/, 'wines'],
    [/^\/vinhos\/novo$/, 'wineEdit'],
    [/^\/vinhos\/([A-Z]{3}_[0-9A-Z]+)\/editar$/, 'wineEdit', ['id']],
    [/^\/vinhos\/([A-Z]{3}_[0-9A-Z]+)$/, 'wine', ['id']],
    [/^\/uvas$/, 'grapes'],
    [/^\/uvas\/nova$/, 'grapeEdit'],
    [/^\/uvas\/comparar$/, 'grapeCompare'],
    [/^\/genealogia$/, 'genealogy'],
    [/^\/regioes$/, 'regions'],
    [/^\/regioes\/pais\/([A-Z]{3}_[0-9A-Z]+)$/, 'country', ['id']],
    [/^\/regioes\/([A-Z]{3}_[0-9A-Z]+)$/, 'region', ['id']],
    [/^\/uvas\/([A-Z]{3}_[0-9A-Z]+)\/editar$/, 'grapeEdit', ['id']],
    [/^\/uvas\/([A-Z]{3}_[0-9A-Z]+)$/, 'grape', ['id']],
    [/^\/adega$/, 'cellar'],
    [/^\/adega\/fracionar$/, 'fractionate'],
    [/^\/degustacao\/nova$/, 'tastingNew'],
    [/^\/degustacao\/historico$/, 'tastingHistory'],
    [/^\/degustacao\/([A-Z]{3}_[0-9A-Z]+)\/resultado$/, 'tastingReport', ['id']],
    [/^\/degustacao\/([A-Z]{3}_[0-9A-Z]+)$/, 'tastingPlay', ['id']],
    [/^\/caderno$/, 'notes'],
    [/^\/usuarios$/, 'users'],
    [/^\/config$/, 'settings'],
    [/^\/revisao$/, 'review']
  ],
  current: null,
  parse: function () {
    var h = Router.hash || '';
    var parts = h.split('?');
    var path = parts[0] || '/';
    var query = {};
    (parts[1] || '').split('&').forEach(function (kv) {
      if (!kv) return;
      var p = kv.split('=');
      query[decodeURIComponent(p[0])] = decodeURIComponent((p[1] || '').replace(/\+/g, ' '));
    });
    for (var i = 0; i < Router.routes.length; i++) {
      var r = Router.routes[i], m = path.match(r[0]);
      if (m) {
        var params = { query: query };
        (r[2] || []).forEach(function (k, j) { params[k] = m[j + 1]; });
        return { page: r[1], params: params, path: path };
      }
    }
    return { page: 'dashboard', params: { query: query }, path: '/' };
  },
  // No Apps Script o app roda num iframe: a navegação usa google.script.history
  // (atualiza a URL da janela principal e o botão Voltar). Fora dele, usa o hash.
  hash: '/',
  gas: !!(window.google && google.script && google.script.history),
  go: function (path) {
    if (Router.gas) {
      Router.hash = path;
      google.script.history.push({ path: path }, null, path);
      Router.render();
    } else {
      location.hash = '#' + path;
    }
  },
  init: function () {
    if (Router.gas) {
      google.script.history.setChangeHandler(function (e) {
        Router.hash = (e.state && e.state.path) || (e.location && e.location.hash) || '/';
        Router.render();
      });
      google.script.url.getLocation(function (loc) {
        Router.hash = loc.hash || '/';
        Router.render();
      });
    } else {
      var sync = function () { Router.hash = location.hash.replace(/^#/, '') || '/'; Router.render(); };
      window.addEventListener('hashchange', sync);
      sync();
    }
  },
  render: function () {
    var route = Router.parse();
    var page = Pages[route.page];
    Router.current = { name: route.page, page: page, params: route.params };
    UI.closeLayer();
    UI.closeModal();
    Nav.highlight(route.path);
    document.getElementById('nav').classList.remove('open');
    var view = document.getElementById('view');
    var token = Router.token = (Router.token || 0) + 1;
    if (!page.fullscreen) view.innerHTML = '<div class="loading">Carregando…</div>';
    Promise.resolve(page.render(route.params)).then(function (html) {
      if (token !== Router.token) return;           // o usuário navegou antes de terminar
      if (page.fullscreen) { UI.openLayer(html); }
      else { view.innerHTML = html; window.scrollTo(0, 0); }
      if (page.mount) page.mount(page.fullscreen ? document.getElementById('layer') : view, route.params);
    }).catch(function (e) {
      if (token !== Router.token) return;
      view.innerHTML = '<div class="empty"><span class="serif">Algo deu errado.</span>' + esc(e.message) + '</div>';
    });
  }
};

/* ---------- Utilidades ---------- */
function esc(s) {
  if (s === null || s === undefined) return '';
  return String(s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; });
}
function blank(v) { return v === null || v === undefined || String(v).trim() === '' || (Array.isArray(v) && !v.length); }
function fmtDate(iso, withTime) {
  if (!iso) return '';
  var d = new Date(iso);
  if (isNaN(d)) return esc(iso);
  var s = d.toLocaleDateString('pt-BR', { day: '2-digit', month: 'short', year: 'numeric' });
  return withTime ? s + ' · ' + d.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' }) : s;
}
function fmtNum(n, digits) {
  if (n === null || n === undefined || n === '') return '';
  return Number(n).toLocaleString('pt-BR', { maximumFractionDigits: digits === undefined ? 1 : digits });
}
function plural(n, one, many) { return n + ' ' + (n === 1 ? one : many); }
function formData(form) {
  var o = {};
  Array.prototype.forEach.call(form.elements, function (el) {
    if (!el.name || el.disabled) return;
    if (el.type === 'checkbox') o[el.name] = el.checked;
    else if (el.type === 'radio') { if (el.checked) o[el.name] = el.value; }
    else if (el.multiple) o[el.name] = Array.prototype.filter.call(el.options, function (op) { return op.selected; }).map(function (op) { return op.value; });
    else o[el.name] = el.value;
  });
  return o;
}

var UI = {
  toast: function (msg, isErr) {
    var t = document.createElement('div');
    t.className = 'toast' + (isErr ? ' err' : '');
    t.textContent = msg;
    document.body.appendChild(t);
    setTimeout(function () { t.remove(); }, isErr ? 6000 : 2800);
  },
  error: function (e) { UI.toast(e && e.message ? e.message : String(e), true); },
  openLayer: function (html) {
    var l = document.getElementById('layer');
    l.innerHTML = html;
    document.body.style.overflow = 'hidden';
  },
  closeLayer: function () {
    document.getElementById('layer').innerHTML = '';
    document.body.style.overflow = '';
  },
  /** Modal simples. Retorna o elemento; fecha com UI.closeModal(). */
  modal: function (html, opts) {
    UI.closeModal();
    var bg = document.createElement('div');
    bg.className = 'modal-bg';
    bg.id = 'modal';
    bg.innerHTML = '<div class="modal" role="dialog" aria-modal="true">' + html + '</div>';
    bg.addEventListener('click', function (e) { if (e.target === bg && !(opts && opts.sticky)) UI.closeModal(); });
    var host = document.querySelector('.tasting-mode') || document.body;
    host.appendChild(bg);
    return bg;
  },
  closeModal: function () { var m = document.getElementById('modal'); if (m) m.remove(); },
  confirm: function (title, text, okLabel) {
    return new Promise(function (resolve) {
      var m = UI.modal('<h2>' + esc(title) + '</h2><p>' + esc(text || '') + '</p>' +
        '<div class="btn-row" style="justify-content:flex-end;margin-top:22px">' +
        '<button class="btn" data-x="no">Cancelar</button><button class="btn primary" data-x="yes">' + esc(okLabel || 'Confirmar') + '</button></div>', { sticky: true });
      m.addEventListener('click', function (e) {
        var b = e.target.closest('[data-x]');
        if (!b) return;
        UI.closeModal();
        resolve(b.getAttribute('data-x') === 'yes');
      });
    });
  },
  busy: function (btn, on) {
    if (!btn) return;
    if (on) { btn.dataset.label = btn.innerHTML; btn.disabled = true; btn.innerHTML = 'Aguarde…'; }
    else { btn.disabled = false; if (btn.dataset.label) btn.innerHTML = btn.dataset.label; }
  }
};

/* ---------- Navegação lateral ---------- */
var Nav = {
  icons: {
    home: '<path d="M3 10.5 10 4l7 6.5V17H3z" stroke-linejoin="round"/>',
    wine: '<path d="M6 2h8c0 5-1.5 8-4 8.5C7.5 10 6 7 6 2ZM10 10.5V17M7 17.5h6"/>',
    grape: '<circle cx="8" cy="8" r="2.2"/><circle cx="12.2" cy="8" r="2.2"/><circle cx="10.1" cy="11.6" r="2.2"/><circle cx="10.1" cy="15.2" r="2"/><path d="M10 3.5V6M10 3.5c1.5-1.3 3.5-1.3 4.5-.5"/>',
    bottle: '<path d="M8.5 2h3v4c2 1 2.5 2.5 2.5 4v8H6v-8c0-1.5.5-3 2.5-4z"/><path d="M6 11h8"/>',
    split: '<path d="M10 2v5M10 7 5 12v6M10 7l5 5v6M10 7v11"/>',
    users: '<circle cx="7.5" cy="7" r="2.8"/><path d="M2.5 16.5c.6-3 2.6-4.5 5-4.5s4.4 1.5 5 4.5"/><circle cx="14" cy="7.5" r="2.2"/><path d="M13.5 12c2 .1 3.5 1.4 4 4"/>',
    eye: '<path d="M2 10s3-5.5 8-5.5S18 10 18 10s-3 5.5-8 5.5S2 10 2 10z"/><circle cx="10" cy="10" r="2.3"/>',
    target: '<circle cx="10" cy="10" r="7"/><circle cx="10" cy="10" r="3.5"/><circle cx="10" cy="10" r=".8" fill="currentColor"/>',
    history: '<path d="M3.5 10a6.5 6.5 0 1 0 2-4.7M3 3v3.5h3.5"/><path d="M10 6.5V10l2.5 1.5"/>',
    note: '<path d="M5 2.5h7l3 3V17.5H5z"/><path d="M8 9h5M8 12h5M8 6h2"/>',
    spark: '<path d="M10 2.5l1.6 4.4 4.4 1.6-4.4 1.6L10 14.5l-1.6-4.4L4 8.5l4.4-1.6z"/><path d="M15.5 13l.7 1.8 1.8.7-1.8.7-.7 1.8-.7-1.8-1.8-.7 1.8-.7z"/>',
    map: '<path d="M2.5 5l5-2 5 2 5-2v12l-5 2-5-2-5 2z"/><path d="M7.5 3v12M12.5 5v12"/>',
    compare: '<path d="M4 4h5v12H4zM11 4h5v12h-5z"/><path d="M4 8h5M11 11h5"/>',
    tree: '<circle cx="5" cy="4" r="2"/><circle cx="15" cy="4" r="2"/><circle cx="10" cy="16" r="2"/><path d="M5 6v2c0 2 5 2 5 6M15 6v2c0 2-5 2-5 6"/>',
    gear: '<circle cx="10" cy="10" r="2.6"/><path d="M10 2v2.2M10 15.8V18M2 10h2.2M15.8 10H18M4.3 4.3l1.6 1.6M14.1 14.1l1.6 1.6M4.3 15.7l1.6-1.6M14.1 5.9l1.6-1.6"/>'
  },
  groups: [
    [null, [['#/', 'home', 'Dashboard', /^\/?$|^\/dashboard/]]],
    ['Estudar', [['#/vinhos', 'wine', 'Vinhos', /^\/vinhos/], ['#/uvas', 'grape', 'Uvas', /^\/uvas(?!\/comparar)/], ['#/regioes', 'map', 'Regiões', /^\/regioes/], ['#/uvas/comparar', 'compare', 'Comparar uvas', /^\/uvas\/comparar/], ['#/genealogia', 'tree', 'Genealogia', /^\/genealogia/], ['#/revisao', 'spark', 'Revisão da IA', /^\/revisao/]]],
    ['Minha Adega', [['#/adega', 'bottle', 'Garrafinhas', /^\/adega$/], ['#/adega/fracionar', 'split', 'Fracionar garrafa', /^\/adega\/fracionar/]]],
    ['Degustação', [['#/degustacao/nova', 'target', 'Nova degustação', /^\/degustacao\/nova/], ['#/degustacao/historico', 'history', 'Histórico', /^\/degustacao\/(historico|[A-Z])/],
      // Jogo em outra aba (mantém o formato próprio dele); o endereço vem do servidor.
      ['@game', 'eye', 'Degustação às cegas (jogo) ↗', /^$^/]]],
    [null, [['#/caderno', 'note', 'Meu Caderno', /^\/caderno/], ['#/usuarios', 'users', 'Usuários', /^\/usuarios/], ['#/config', 'gear', 'Configurações', /^\/config/]]]
  ],
  render: function () {
    var html = '';
    var ai = Store.lookups && (Store.lookups.ai_enabled || (Store.dashboard && Store.dashboard.counts.ai_pending));
    Nav.groups.forEach(function (g) {
      if (g[0]) html += '<div class="nav-group eyebrow">' + g[0] + '</div>';
      else html += '<div style="height:10px"></div>';
      g[1].forEach(function (it) {
        if (it[0] === '#/revisao' && !ai) return;
        if (it[0] === '#/usuarios' && !(Store.lookups && Store.lookups.is_admin)) return;
        var ext = it[0] === '@game';
        var gameUrl = (window.WSL_CONFIG && window.WSL_CONFIG.gameUrl) || Store.app.game_url;
        if (ext && !gameUrl) return;
        html += '<a class="item" href="' + esc(ext ? gameUrl : it[0]) + '"' + (ext ? ' target="_blank" rel="noopener"' : '') + ' data-match="' + it[3].source + '">' +
          '<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round">' + Nav.icons[it[1]] + '</svg>' + it[2] + '</a>';
      });
    });
    document.getElementById('nav-items').innerHTML = html;
  },
  highlight: function (path) {
    document.querySelectorAll('.nav a.item').forEach(function (a) {
      a.classList.toggle('active', new RegExp(a.getAttribute('data-match')).test(path));
    });
  },
  foot: function () {
    var d = Store.dashboard;
    var me = Store.lookups && Store.lookups.me;
    var s = Store.lookups && Store.lookups.is_admin ? (d && d.last_sync_at ? 'Sincronizado em ' + fmtDate(d.last_sync_at, true) : 'Ainda não sincronizado') : '';
    document.getElementById('nav-foot').innerHTML = (me ? '<div class="nav-user">' + (me.picture ? '<img src="' + esc(me.picture) + '" alt="" referrerpolicy="no-referrer">' : '') +
      '<span>' + esc(me.name || me.email) + '</span>' + (API.remote() ? '<button class="btn ghost small" data-action="logout">Sair</button>' : '') + '</div>' : '') + esc(s);
  }
};

/* ---------- Eventos (delegação) ---------- */
var GlobalActions = {
  'nav-toggle': function () { document.getElementById('nav').classList.toggle('open'); },
  'go': function (el) { Router.go(el.getAttribute('data-to')); },
  'close-modal': function () { UI.closeModal(); },
  'logout': function () { Login.logout(); }
};

function dispatch(el, ev) {
  var name = el.getAttribute('data-action');
  var page = Router.current && Router.current.page;
  var fn = (page && page.actions && page.actions[name]) || GlobalActions[name] || (Components.actions && Components.actions[name]);
  if (!fn) return false;
  ev.preventDefault();
  var r = fn(el, ev);
  if (r && r.catch) r.catch(UI.error);
  return true;
}

document.addEventListener('click', function (ev) {
  // Links internos ("#/vinhos") passam pelo roteador em vez de navegar a página.
  var link = ev.target.closest('a[href^="#/"]');
  if (link && !ev.metaKey && !ev.ctrlKey) {
    ev.preventDefault();
    Router.go(link.getAttribute('href').slice(1));
    return;
  }
  var el = ev.target.closest('[data-action]');
  if (el && el.tagName !== 'FORM') dispatch(el, ev);
});
document.addEventListener('submit', function (ev) {
  var el = ev.target.closest('form[data-action]');
  if (el) dispatch(el, ev);
});
document.addEventListener('change', function (ev) {
  var el = ev.target.closest('[data-change]');
  if (!el) return;
  var name = el.getAttribute('data-change');
  var page = Router.current && Router.current.page;
  var fn = page && page.actions && page.actions[name];
  if (fn) { var r = fn(el, ev); if (r && r.catch) r.catch(UI.error); }
});
document.addEventListener('input', function (ev) {
  var el = ev.target.closest('[data-input]');
  if (!el) return;
  var name = el.getAttribute('data-input');
  var page = Router.current && Router.current.page;
  var fn = (page && page.actions && page.actions[name]) || (Components.actions && Components.actions[name]);
  if (fn) fn(el, ev);
});

GlobalActions['global-search'] = function (form) {
  var q = form.q.value.trim();
  if (q) Router.go('/busca?q=' + encodeURIComponent(q));
};

var App = {
  start: function () {
    Nav.render();
    if (API.remote() && !SessionStore.token()) { Login.show(); return; }
    API.call('bootstrap').then(function (b) {
      Store.lookups = b.lookups;
      Store.dashboard = b.dashboard;
      Store.app = b.app || {};
      Nav.render();
      Nav.foot();
      AiUI.setBadge(b.dashboard.counts.ai_pending);
      Router.init();
    }).catch(function (e) {
      if (Login.shown) return;
      document.getElementById('view').innerHTML = '<div class="empty"><span class="serif">Não foi possível abrir o laboratório.</span>' + esc(e.message) + '</div>';
    });
  }
};
</script>
