<script>
/* ============================== MINHA ADEGA ============================== */
var BOTTLE_STATUS = { disponivel: 'Disponível', reservada: 'Reservada p/ degustação', utilizada: 'Utilizada', descartada: 'Descartada' };

Pages.cellar = {
  // Modo discreto: esconde o conteúdo das garrafinhas (preserva o "às cegas").
  discreet: (function () { try { return localStorage.getItem('wsl.discreet') !== '0'; } catch (e) { return true; } })(),
  filter: 'ativas',
  selected: {},
  render: function () {
    return Promise.all([API.call('bottles.list'), API.call('bottles.batches')]).then(function (r) {
      Pages.cellar.data = r[0];
      Pages.cellar.batches = r[1];
      Pages.cellar.selected = {};
      var list = r[0];
      var n = function (s) { return list.filter(function (b) { return b.status === s; }).length; };
      var html = '<div class="page-head"><div><div class="eyebrow">Minha Adega</div><h1>Adega de degustação</h1>' +
        '<p class="sub">' + n('disponivel') + ' disponíveis · ' + n('reservada') + ' reservadas · ' + n('utilizada') + ' utilizadas</p></div>' +
        '<div class="btn-row"><a class="btn" href="#/adega/fracionar">Fracionar garrafa</a><a class="btn primary" href="#/degustacao/nova">Nova degustação</a></div></div>' +
        '<p class="callout small" style="margin-bottom:16px">Toque nas garrafinhas para selecionar; com as selecionadas, use <b>Degustar às cegas</b> na barra que aparece embaixo.</p>';
      if (!list.length) return html + Components.empty('Nenhuma garrafinha cadastrada.', 'Fracione uma garrafa ou sincronize a planilha.', '<a class="btn primary" href="#/adega/fracionar">Fracionar garrafa</a>');
      html += '<div class="btn-row" style="justify-content:space-between;margin-bottom:18px">' +
        '<div class="seg" id="cellar-filter">' + [['ativas', 'Ativas'], ['disponivel', 'Disponíveis'], ['reservada', 'Reservadas'], ['utilizada', 'Utilizadas'], ['descartada', 'Descartadas'], ['todas', 'Todas']].map(function (f) {
          return '<button type="button" data-action="filter" data-f="' + f[0] + '" class="' + (Pages.cellar.filter === f[0] ? 'on' : '') + '">' + f[1] + '</button>';
        }).join('') + '</div>' +
        '<label class="small"><input type="checkbox" data-change="discreet"' + (Pages.cellar.discreet ? ' checked' : '') + '> Modo discreto (esconde o conteúdo)</label></div>' +
        '<div id="cellar-grid"></div>' +
        '<div id="cellar-bar" class="panel" style="display:none;position:sticky;bottom:16px;margin-top:18px;box-shadow:var(--shadow)"></div>';

      html += '<h2>Fracionamentos</h2><div class="list">' + r[1].map(function (b) {
        return '<div class="row"><div><div class="t">' + esc(b.wine_name) + '</div><div class="m">' + (b.date ? fmtDate(b.date) + ' · ' : '') +
          (b.original_volume_ml ? fmtNum(b.original_volume_ml, 0) + ' ml → ' : '') + plural(b.total, 'garrafinha', 'garrafinhas') + (b.bottle_volume_ml ? ' de ~' + fmtNum(b.bottle_volume_ml, 0) + ' ml' : '') +
          ' · numeração ' + esc(b.numbering || '') + ' ' + Components.src(b.source) + '</div></div><div class="m nowrap">' + b.available + ' disponíveis</div></div>';
      }).join('') + '</div>';
      return html;
    });
  },
  mount: function () { Pages.cellar.draw(); },
  draw: function () {
    var f = Pages.cellar.filter, d = Pages.cellar.discreet;
    var rows = Pages.cellar.data.filter(function (b) {
      return f === 'todas' || (f === 'ativas' ? (b.status === 'disponivel' || b.status === 'reservada') : b.status === f);
    });
    document.getElementById('cellar-grid').innerHTML = rows.length ? '<div class="cellar">' + rows.map(function (b) {
      return '<button class="btl' + (b.status === 'utilizada' || b.status === 'descartada' ? ' dim' : '') + (Pages.cellar.selected[b.id] ? ' sel' : '') + '" data-action="pick" data-id="' + b.id + '" title="' + esc(BOTTLE_STATUS[b.status]) + '">' +
        Components.bottle(b.number, { status: b.status }) + '<span class="n">#' + b.number + '</span>' +
        (d ? '' : '<span class="w">' + esc(b.wine_name) + '</span>') + '</button>';
    }).join('') + '</div>' : Components.empty('Nenhuma garrafinha neste filtro.');
    Pages.cellar.drawBar();
  },
  drawBar: function () {
    var ids = Object.keys(Pages.cellar.selected);
    var bar = document.getElementById('cellar-bar');
    if (!ids.length) { bar.style.display = 'none'; return; }
    bar.style.display = '';
    var byId = {};
    Pages.cellar.data.forEach(function (b) { byId[b.id] = b; });
    var allAvail = ids.every(function (id) { return byId[id] && byId[id].status === 'disponivel'; });
    bar.innerHTML = '<div class="btn-row" style="justify-content:space-between"><span><b>' + ids.length + '</b> selecionada(s)</span><span class="btn-row">' +
      (allAvail && ids.length <= 12 ? '<button class="btn primary small" data-action="blind">Degustar às cegas</button>'
        : '<span class="small muted">Para degustar às cegas, escolha só garrafinhas disponíveis (até 12).</span>') +
      (ids.length === 1 ? '<button class="btn small" data-action="details">Ver detalhes</button>' : '') +
      '<button class="btn small" data-action="set-status" data-s="disponivel">Disponível</button>' +
      '<button class="btn small" data-action="set-status" data-s="utilizada">Utilizada</button>' +
      '<button class="btn small" data-action="set-status" data-s="descartada">Descartada</button>' +
      '<button class="btn small ghost" data-action="clear">Limpar</button></span></div>';
  },
  actions: {
    blind: function (btn) {
      var ids = Object.keys(Pages.cellar.selected);
      UI.busy(btn, true);
      return API.call('tastings.create', { bottle_ids: ids }).then(function (r) {
        UI.toast('Degustação criada com ' + ids.length + ' garrafinha(s). Bom trabalho às cegas!');
        Router.go('/degustacao/' + r.id);
      }).catch(function (e) { UI.busy(btn, false); throw e; });
    },
    filter: function (btn) {
      Pages.cellar.filter = btn.getAttribute('data-f');
      btn.parentNode.querySelectorAll('button').forEach(function (b) { b.classList.toggle('on', b === btn); });
      Pages.cellar.draw();
    },
    discreet: function (cb) {
      Pages.cellar.discreet = cb.checked;
      try { localStorage.setItem('wsl.discreet', cb.checked ? '1' : '0'); } catch (e) { /* sem storage */ }
      Pages.cellar.draw();
    },
    pick: function (btn) {
      var id = btn.getAttribute('data-id');
      if (Pages.cellar.selected[id]) delete Pages.cellar.selected[id]; else Pages.cellar.selected[id] = true;
      btn.classList.toggle('sel');
      Pages.cellar.drawBar();
    },
    clear: function () { Pages.cellar.selected = {}; Pages.cellar.draw(); },
    details: function () {
      var id = Object.keys(Pages.cellar.selected)[0];
      var b = Pages.cellar.data.filter(function (x) { return x.id === id; })[0];
      var show = function () {
        UI.modal('<h2>Garrafinha #' + b.number + '</h2><div class="fields">' +
          Components.field('Vinho', '<a href="#/vinhos/' + b.wine_id + '">' + esc(b.wine_name) + '</a>', { html: true }) +
          Components.field('Safra', b.vintage) + Components.field('Uva(s)', b.grapes) +
          Components.field('Volume', b.volume_ml ? fmtNum(b.volume_ml, 0) + ' ml' : '') +
          Components.field('Status', BOTTLE_STATUS[b.status]) + Components.field('Observações', b.notes, { wide: true }) +
          '</div><div class="btn-row" style="justify-content:flex-end;margin-top:20px"><button class="btn" data-action="close-modal">Fechar</button></div>');
      };
      if (!Pages.cellar.discreet) return show();
      return UI.confirm('Mostrar o conteúdo?', 'O modo discreto está ligado. Ver o conteúdo desta garrafinha pode estragar uma futura degustação às cegas.', 'Mostrar').then(function (ok) { if (ok) show(); });
    },
    'set-status': function (btn) {
      var ids = Object.keys(Pages.cellar.selected), s = btn.getAttribute('data-s');
      var reserved = Pages.cellar.data.filter(function (b) { return ids.indexOf(b.id) >= 0 && b.status === 'reservada'; });
      var go = function () {
        return API.call('bottles.setStatus', { ids: ids, status: s }).then(function (n) { UI.toast(plural(n, 'garrafinha atualizada', 'garrafinhas atualizadas') + '.'); Router.render(); });
      };
      if (reserved.length) {
        return UI.confirm('Garrafinhas reservadas', reserved.length + ' delas estão reservadas numa degustação em andamento. Alterar mesmo assim?', 'Alterar').then(function (ok) { if (ok) return go(); });
      }
      return go();
    }
  }
};

/* ============================== FRACIONAR ============================== */
/**
 * Fracionamento (usado na página "Fracionar garrafa" e na janela aberta dentro do detalhe do vinho).
 * Numeração: aleatória, sequencial, "preencher lacunas" (menores números livres — repõe os que acabaram)
 * ou escolher os números à mão (ex.: 5, 9, 12-15), com conferência na hora dos que já estão em uso.
 */
var Fractionate = {
  /** Números ocupados (garrafinhas disponíveis ou reservadas), em um objeto {n: true}. */
  usedFrom: function (bottles) {
    var used = {};
    (bottles || []).forEach(function (b) { if (b.status === 'disponivel' || b.status === 'reservada') used[b.number] = true; });
    return used;
  },
  freeLow: function (used, n) {
    var out = [];
    for (var i = 1; out.length < n && i <= 9999; i++) if (!used[i]) out.push(i);
    return out;
  },
  /** "5, 9, 12-15" → { nums: [..], error: '' } */
  parse: function (text) {
    var nums = [], seen = {};
    var parts = String(text || '').split(/[\s,;]+/).filter(Boolean);
    for (var i = 0; i < parts.length; i++) {
      var m = parts[i].match(/^(\d{1,4})\s*[-–]\s*(\d{1,4})$/), list = [];
      if (m) {
        var a = +m[1], b = +m[2];
        if (b < a || b - a > 200) return { nums: [], error: 'Intervalo inválido: ' + parts[i] };
        for (var k = a; k <= b; k++) list.push(k);
      } else if (/^\d{1,4}$/.test(parts[i])) list.push(+parts[i]);
      else return { nums: [], error: 'Use números como 5, 9, 12-15 (separados por vírgula).' };
      for (var j = 0; j < list.length; j++) { if (list[j] < 1) return { nums: [], error: 'Os números começam em 1.' }; if (!seen[list[j]]) { seen[list[j]] = true; nums.push(list[j]); } }
    }
    return { nums: nums, error: '' };
  },

  /** Campos do formulário. wineHtml = seletor do vinho ou campo oculto. */
  fieldsHtml: function (wineHtml) {
    return '<div class="form-grid">' + wineHtml +
      '<div><label class="f">Data do fracionamento</label><input class="in" type="date" name="date" value="' + new Date().toISOString().slice(0, 10) + '"></div>' +
      '<div><label class="f">Volume original (ml)</label><input class="in" type="number" name="original_volume_ml" value="750" data-input="calc"></div>' +
      '<div><label class="f">Quantidade de garrafinhas *</label><input class="in" type="number" name="count" value="22" min="1" max="100" data-input="calc"></div>' +
      '<div><label class="f">Volume por garrafinha (ml)</label><input class="in" type="number" name="bottle_volume_ml" value="30" data-input="calc"></div>' +
      '<div class="wide"><label class="f">Numeração</label>' +
      '<label class="frac-opt"><input type="radio" name="numbering" value="aleatoria" checked data-change="frac-mode"> <b>Aleatória</b> — o sistema sorteia números livres (recomendado: o número não revela o vinho).</label>' +
      '<label class="frac-opt"><input type="radio" name="numbering" value="lacunas" data-change="frac-mode"> <b>Preencher os números livres</b> — usa os menores números disponíveis (repõe os que foram acabando).</label>' +
      '<label class="frac-opt"><input type="radio" name="numbering" value="manual" data-change="frac-mode"> <b>Escolher os números</b> — você digita quais.</label>' +
      '<label class="frac-opt"><input type="radio" name="numbering" value="sequencial" data-change="frac-mode"> Sequencial — em sequência, depois do maior número em uso.</label></div>' +
      '<div class="wide" id="frac-manual" hidden><label class="f">Números das garrafinhas</label>' +
      '<input class="in" name="numbers" placeholder="ex.: 5, 9, 12-15" autocomplete="off" data-input="calc">' +
      '<div class="small muted" id="frac-free" style="margin-top:6px"></div>' +
      '<div class="btn-row" style="margin-top:6px"><button type="button" class="btn small" data-action="frac-fill">Usar os livres mais baixos</button></div></div>' +
      '<div class="wide"><label class="f">Observações</label><textarea class="in" name="notes"></textarea></div>' +
      '</div><p class="muted small" id="calc-hint"></p>';
  },

  /** Liga a conferência ao vivo (chame depois de inserir o formulário). */
  wire: function (form) {
    var self = this;
    form._used = {};
    API.call('bottles.list').then(function (list) { form._used = self.usedFrom(list); self.refresh(form); }).catch(function () {});
    self.refresh(form);
  },

  refresh: function (form) {
    var d = formData(form), manual = d.numbering === 'manual', used = form._used || {};
    document.getElementById('frac-manual').hidden = !manual;
    var countEl = form.count;
    countEl.disabled = manual;
    var hint = '';
    var free = this.freeLow(used, 12);
    var freeEl = document.getElementById('frac-free');
    if (freeEl) freeEl.textContent = 'Livres mais baixos agora: ' + (free.join(', ') || '—') + (Object.keys(used).length ? ' · em uso: ' + Object.keys(used).length + ' garrafinha(s)' : '');
    if (manual) {
      var r = this.parse(d.numbers);
      if (r.error) hint = r.error;
      else if (!r.nums.length) hint = 'Digite os números das garrafinhas.';
      else {
        countEl.value = r.nums.length;
        var taken = r.nums.filter(function (n) { return used[n]; });
        hint = taken.length ? '⚠ Já em uso: ' + taken.join(', ') + '.' : r.nums.length + ' garrafinha(s): ' + r.nums.slice().sort(function (a, b) { return a - b; }).join(', ') + '.';
      }
    }
    var total = (+countEl.value || 0) * (+form.bottle_volume_ml.value || 0), orig = +form.original_volume_ml.value || 0;
    var vol = total ? 'Total: ' + total + ' ml de ' + orig + ' ml' + (total > orig ? ' — mais do que a garrafa!' : ' (sobram ~' + (orig - total) + ' ml)') : '';
    document.getElementById('calc-hint').textContent = [hint, vol].filter(Boolean).join(' · ');
  },

  fill: function (form) {
    var n = Math.max(1, Math.min(100, +form.count.value || 1));
    var d = formData(form), r = this.parse(d.numbers);
    n = r.nums.length || n;
    form.numbers.value = this.freeLow(form._used || {}, n).join(', ');
    this.refresh(form);
  },

  /** Envia; devolve o resultado ({numbers, wine_name}). */
  submit: function (form) {
    var d = formData(form);
    if (d.numbering !== 'manual') delete d.numbers;
    return API.call('bottles.fractionate', d);
  },

  resultHtml: function (r) {
    return '<p class="sub">Etiquete as garrafinhas com estes números. Guarde esta lista longe de quem vai degustar — inclusive de você.</p>' +
      '<div class="cellar">' + r.numbers.map(function (n) {
        return '<div class="btl">' + Components.bottle(n, { status: 'disponivel' }) + '<span class="n">#' + n + '</span></div>';
      }).join('') + '</div><p class="serif" style="font-size:1.3rem;margin-top:14px">' + r.numbers.join(' · ') + '</p>';
  },

  /** Janela dentro do detalhe do vinho: sem trocar de página. */
  openModal: function (wine, done) {
    var html = '<h2>Adicionar garrafinhas</h2><p class="muted small">' + esc(wine.name + (wine.vintage ? ' ' + wine.vintage : '')) + '</p>' +
      '<form data-frac-modal><input type="hidden" name="wine_id" value="' + esc(wine.id) + '">' + Fractionate.fieldsHtml('') +
      '<div class="btn-row" style="justify-content:flex-end;margin-top:14px"><button type="button" class="btn" data-action="close-modal">Cancelar</button><button class="btn primary">Registrar e numerar</button></div></form>' +
      '<div id="frac-result" hidden></div>';
    var m = UI.modal(html, { sticky: true });
    var form = m.querySelector('form');
    form.addEventListener('input', function () { Fractionate.refresh(form); });
    form.addEventListener('change', function () { Fractionate.refresh(form); });
    form.addEventListener('click', function (e) { if (e.target.closest('[data-action=frac-fill]')) { e.stopPropagation(); Fractionate.fill(form); } });
    Fractionate.wire(form);
    form.addEventListener('submit', function (e) {
      e.preventDefault();
      var btn = form.querySelector('button.primary');
      UI.busy(btn, true);
      Fractionate.submit(form).then(function (r) {
        form.hidden = true;
        var box = document.getElementById('frac-result');
        box.hidden = false;
        box.innerHTML = '<h3 style="margin-top:0">Garrafinhas registradas</h3>' + Fractionate.resultHtml(r) +
          '<div class="btn-row" style="justify-content:flex-end;margin-top:14px"><button class="btn" onclick="window.print()">Imprimir</button><button class="btn primary" data-action="frac-done">Concluir</button></div>';
        box.querySelector('[data-action=frac-done]').addEventListener('click', function () { UI.closeModal(); done && done(); });
      }).catch(function (err) { UI.busy(btn, false); UI.error(err); });
    });
  }
};

Pages.fractionate = {
  render: function (p) {
    return API.call('wines.list').then(function (wines) {
      var html = '<div class="page-head"><div><div class="eyebrow"><a href="#/adega">Minha Adega</a></div><h1>Fracionar uma garrafa</h1>' +
        '<p class="sub">Registre a divisão da garrafa em garrafinhas numeradas.</p></div></div>';
      if (!wines.length) return html + Components.empty('Cadastre o vinho primeiro.', '', '<a class="btn primary" href="#/vinhos/novo">Cadastrar vinho</a>');
      var sel = '<div class="wide"><label class="f">Vinho *</label><select class="in" name="wine_id" required>' +
        Components.options(wines.map(function (w) { return { v: w.id, t: w.name + (w.vintage ? ' ' + w.vintage : '') + (w.producer ? ' — ' + w.producer : '') }; }), p.query.wine || '', 'Selecione…') + '</select></div>';
      html += '<form class="panel" data-action="save">' + Fractionate.fieldsHtml(sel) +
        '<div class="btn-row" style="justify-content:flex-end"><a class="btn" href="#/adega">Cancelar</a><button class="btn primary">Registrar e numerar</button></div></form>';
      return html;
    });
  },
  mount: function () {
    var f = document.querySelector('form[data-action="save"]');
    if (f) Fractionate.wire(f);
  },
  actions: {
    calc: function () { var f = document.querySelector('form[data-action="save"]'); if (f) Fractionate.refresh(f); },
    'frac-mode': function () { var f = document.querySelector('form[data-action="save"]'); if (f) Fractionate.refresh(f); },
    'frac-fill': function () { var f = document.querySelector('form[data-action="save"]'); if (f) Fractionate.fill(f); },
    save: function (form) {
      var btn = form.querySelector('button.primary');
      UI.busy(btn, true);
      return Fractionate.submit(form).then(function (r) {
        document.getElementById('view').innerHTML =
          '<div class="page-head"><div><div class="eyebrow">Fracionamento registrado</div><h1>' + esc(r.wine_name) + '</h1></div>' +
          '<div class="btn-row"><button class="btn" onclick="window.print()">Imprimir</button><a class="btn primary" href="#/adega">Ir para a adega</a></div></div>' +
          '<div class="panel">' + Fractionate.resultHtml(r) + '</div>';
      }).catch(function (e) { UI.busy(btn, false); throw e; });
    }
  }
};
</script>
