<script>
/* ============================================================
   Primeiros passos (#/comecar): tutorial de quem acabou de entrar, na mesma ordem do guia em slides.
   Cada passo tem um botão que leva à tela certa e uma caixa para marcar como feito (guardada só neste aparelho).
   ============================================================ */
var StartUI = {
  KEY: 'wsl_start_done',
  STEPS: [
    { id: 'entrar', t: 'Entre com a sua conta Google',
      p: 'Você já fez este passo: o app não tem senha própria e a sua conta de membro foi criada no primeiro acesso. Para sair, use o botão "Sair" no rodapé do menu.' },
    { id: 'explorar', t: 'Conheça o menu', go: ['#/uvas', 'Abrir as uvas'],
      p: 'Em Estudar ficam Vinhos, Uvas, Regiões, Comparar uvas, Genealogia e o Quiz. Cada dado de uma ficha mostra de onde veio (rótulo, pesquisa, sua avaliação) e, quando existe, o link da fonte. O que ninguém sabe fica vazio, em vez de receber um valor inventado.' },
    { id: 'uva', t: 'Abra a ficha de uma uva', go: ['#/uvas', 'Escolher uma uva'],
      p: 'Veja origem, regiões, o perfil aromático (flores, frutas, especiarias…) e a estrutura (acidez, tanino, corpo). No fim da ficha, "Com quais uvas ela pode ser confundida?" compara a uva com as parecidas.' },
    { id: 'comparar', t: 'Compare duas ou mais uvas', go: ['#/uvas/comparar', 'Comparar uvas'],
      p: 'Escolha de 2 a 4 uvas e veja lado a lado origem, regiões, clima, acidez, tanino, corpo e aromas. O quadro "Principais diferenças" resume o que cada uma tem de único.' },
    { id: 'regioes', t: 'Explore uma região no mapa', go: ['#/regioes', 'Abrir as regiões'],
      p: 'Escolha um país, depois uma região: mapa com os limites, clima, solos, altitude, história e as castas principais.' },
    { id: 'vinho', t: 'Cadastre um vinho', go: ['#/vinhos/novo', 'Cadastrar vinho'],
      p: 'Informe o que você sabe: nome, produtor, país, região, safra, uvas. Você pode editar os vinhos que você mesmo cadastrou; os demais só a administração altera. Se uma informação não está no rótulo, deixe em branco.' },
    { id: 'perfil', t: 'Cadastre o perfil de referência do vinho', go: ['#/vinhos', 'Abrir os vinhos'],
      p: 'Na ficha do vinho, toque em "Cadastrar perfil" (ou "Editar perfil") e siga a ordem da degustação: 1 Visual, 2 Nariz (aromas por família), 3 Boca (dulçor, acidez, tanino, álcool, corpo…) e 4 Conclusão. Informe a origem do dado. Este perfil é o gabarito das degustações às cegas. A ficha também mostra o "Perfil aromático das uvas deste vinho", só como apoio.' },
    { id: 'garrafinhas', t: 'Veja as suas garrafinhas', go: ['#/adega', 'Abrir as garrafinhas'],
      p: 'Cada membro começa com as garrafinhas zeradas: ninguém vê as suas. Na ficha do vinho, "Adicionar garrafinhas" cria as numeradas para você degustar.' },
    { id: 'degustar', t: 'Faça uma degustação às cegas', go: ['#/degustacao/nova', 'Nova degustação'],
      p: 'Escolha as garrafinhas ou sorteie, defina a dificuldade e responda: uva, região, país, aromas e estrutura. Ao revelar, o app corrige com o gabarito de cada vinho.' },
    { id: 'resultado', t: 'Entenda o resultado', go: ['#/degustacao/historico', 'Ver o histórico'],
      p: 'Critério "sem gabarito" significa que a ficha do vinho ainda não tem aquele dado confirmado: ele não entra na nota. O aviso na carta do vinho diz o que falta e, quando um dado foi lido por IA e ainda não confirmado, diz isso. Complete a ficha e use "Recalcular resultado".' },
    { id: 'quiz', t: 'Fixe com o quiz', go: ['#/quiz', 'Fazer um quiz'],
      p: 'Perguntas sobre uvas, regiões, aromas e estilo, em níveis Médio, Avançado e Expert. Depois de uma degustação há um quiz com as uvas e regiões dos vinhos provados. No fim, o app diz o que revisar.' },
    { id: 'privacidade', t: 'O que é compartilhado e o que é só seu',
      p: 'Compartilhados: o catálogo de vinhos, as uvas, as regiões e os produtores. Só seus: garrafinhas, degustações e anotações. Áreas ainda em construção aparecem no menu quando forem liberadas.' }
  ],
  done: function () {
    try { return JSON.parse(localStorage.getItem(StartUI.KEY) || '{}') || {}; } catch (e) { return {}; }
  },
  save: function (d) { try { localStorage.setItem(StartUI.KEY, JSON.stringify(d)); } catch (e) { /* sem armazenamento: o passo só não fica marcado */ } }
};

Pages.start = {
  render: function () {
    var d = StartUI.done();
    var n = StartUI.STEPS.filter(function (s) { return d[s.id]; }).length;
    return '<div class="page-head"><div><div class="eyebrow">Para quem acabou de chegar</div><h1>Primeiros passos</h1>' +
      '<p class="sub">Em cerca de dez minutos você passa por tudo o que o app faz. <span id="start-count">' + n + ' de ' + StartUI.STEPS.length + ' passos marcados.</span></p></div></div>' +
      '<ol class="start-steps" style="list-style:none;padding:0;margin:0;display:grid;gap:12px">' + StartUI.STEPS.map(function (s, i) {
        return '<li class="panel" style="margin:0"><label style="display:flex;gap:12px;align-items:flex-start;cursor:pointer">' +
          '<input type="checkbox" data-change="start-toggle" data-id="' + s.id + '"' + (d[s.id] ? ' checked' : '') + ' style="margin-top:6px">' +
          '<span><span class="eyebrow">Passo ' + (i + 1) + '</span><span class="serif" style="display:block;font-size:1.3rem;line-height:1.2">' + esc(s.t) + '</span></span></label>' +
          '<p class="muted" style="margin:8px 0 0 28px">' + esc(s.p) + '</p>' +
          (s.go ? '<div class="btn-row" style="margin:10px 0 0 28px"><a class="btn small" href="' + esc(s.go[0]) + '">' + esc(s.go[1]) + '</a></div>' : '') + '</li>';
      }).join('') + '</ol>';
  },
  actions: {
    'start-toggle': function (el) {
      var d = StartUI.done();
      if (el.checked) d[el.getAttribute('data-id')] = true; else delete d[el.getAttribute('data-id')];
      StartUI.save(d);
      var c = document.getElementById('start-count');
      if (c) c.textContent = StartUI.STEPS.filter(function (s) { return d[s.id]; }).length + ' de ' + StartUI.STEPS.length + ' passos marcados.';
    }
  }
};
</script>
