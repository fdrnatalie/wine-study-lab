<style>
/* ============================================================
   Wine Study Lab — sistema visual
   Papel, tinta, bordô. Serifa para títulos, sans para interface.
   O modo degustação (.tasting-mode) usa uma paleta escura própria.
   ============================================================ */
:root {
  --bg: #f5f0e8;
  --paper: #fbf8f3;
  --paper-2: #f1eadf;
  --ink: #2b1f20;
  --ink-2: #4a3b3a;
  --muted: #86766f;
  --line: #e3d8ca;
  --line-2: #d4c5b3;
  --wine: #6d1f2c;
  --wine-2: #8f2d3d;
  --wine-soft: #f3e4e2;
  --gold: #a8844c;
  --gold-soft: #f3eadb;
  --hit: #3f7350;  --hit-soft: #e5efe5;
  --near: #b3832a; --near-soft: #f6ecd6;
  --miss: #a13b35; --miss-soft: #f5e1de;
  --info: #56697a; --info-soft: #e6ecf0;
  --shadow: 0 1px 2px rgba(43,31,32,.05), 0 8px 24px -12px rgba(43,31,32,.18);
  --radius: 10px;
  --serif: 'Cormorant Garamond', 'Iowan Old Style', Georgia, serif;
  --sans: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --nav-w: 248px;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #1a1415; --paper: #221a1b; --paper-2: #2a2021; --ink: #f1e8e1; --ink-2: #d9ccc4; --muted: #a39088;
    --line: #3a2e2e; --line-2: #4a3a3a; --wine: #d27a86; --wine-2: #e39aa4; --wine-soft: #3a2126;
    --gold: #d0ae78; --gold-soft: #3a3024; --hit: #7fb58d; --hit-soft: #20312a; --near: #e0b25c; --near-soft: #3a3020;
    --miss: #e08079; --miss-soft: #3c2322; --info: #9fb4c6; --info-soft: #232c33;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px -12px rgba(0,0,0,.6);
  }
}

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--sans); font-size: 15px; line-height: 1.55;
  -webkit-font-smoothing: antialiased; font-feature-settings: 'tnum' 1, 'ss01' 1;
}
a { color: var(--wine); text-decoration: none; }
a:hover { text-decoration: underline; text-underline-offset: 3px; }
h1, h2, h3, .serif { font-family: var(--serif); font-weight: 500; letter-spacing: .005em; color: var(--ink); }
h1 { font-size: 2.6rem; line-height: 1.05; margin: 0 0 .3rem; }
h2 { font-size: 1.65rem; margin: 2.2rem 0 .8rem; }
h3 { font-size: 1.25rem; margin: 1.4rem 0 .5rem; }
.eyebrow { font-size: .72rem; letter-spacing: .16em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.muted { color: var(--muted); }
.small { font-size: .85rem; }
.nowrap { white-space: nowrap; }
hr.rule { border: 0; border-top: 1px solid var(--line); margin: 1.6rem 0; }

/* ---------- Layout ---------- */
.shell { display: grid; grid-template-columns: var(--nav-w) 1fr; min-height: 100vh; }
.nav {
  position: sticky; top: 0; height: 100vh; overflow-y: auto; padding: 28px 18px 24px;
  border-right: 1px solid var(--line); background: var(--paper);
}
.brand { display: flex; align-items: center; gap: 10px; margin: 0 6px 22px; }
.brand .mark { width: 30px; height: 30px; }
.brand .name { font-family: var(--serif); font-size: 1.35rem; line-height: 1; }
.brand .name small { display: block; font-family: var(--sans); font-size: .62rem; letter-spacing: .2em; text-transform: uppercase; color: var(--muted); margin-top: 4px; }
.nav .search { margin: 0 4px 18px; }
.nav-group { margin: 16px 0 4px; padding: 0 10px; }
.nav a.item {
  display: flex; align-items: center; gap: 10px; padding: 7px 10px; border-radius: 8px; color: var(--ink-2);
  font-size: .92rem; text-decoration: none;
}
.nav a.item:hover { background: var(--paper-2); }
.nav a.item.active { background: var(--wine-soft); color: var(--wine); font-weight: 600; }
.nav a.item .badge { margin-left: auto; background: var(--wine); color: #fff; font-size: .7rem; font-weight: 600; border-radius: 999px; padding: 1px 7px; }
.nav a.item svg { width: 17px; height: 17px; flex: none; opacity: .75; }
.nav .foot { margin-top: 28px; padding: 12px 10px 0; border-top: 1px solid var(--line); font-size: .78rem; color: var(--muted); }

main.view { padding: 44px 56px 90px; max-width: 1180px; width: 100%; }
.page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 20px; flex-wrap: wrap; margin-bottom: 26px; }
.page-head .sub { color: var(--muted); margin: 0; }

.topbar { display: none; }
@media (max-width: 900px) {
  .shell { grid-template-columns: 1fr; }
  .nav { position: fixed; z-index: 40; left: 0; top: 0; width: 280px; transform: translateX(-100%); transition: transform .25s ease; box-shadow: var(--shadow); }
  .nav.open { transform: none; }
  .topbar { display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; border-bottom: 1px solid var(--line); background: var(--paper); position: sticky; top: 0; z-index: 30; }
  main.view { padding: 26px 16px 80px; }
  h1 { font-size: 2rem; }
}
.scrim { display: none; }
.nav.open + .scrim { display: block; position: fixed; inset: 0; background: rgba(0,0,0,.25); z-index: 35; }

/* ---------- Superfícies ---------- */
.panel { background: var(--paper); border: 1px solid var(--line); border-radius: var(--radius); padding: 22px 24px; }
.panel + .panel { margin-top: 16px; }
.grid { display: grid; gap: 16px; }
.grid.two { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.grid.three { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.grid.auto { grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); }
@media (max-width: 760px) { .grid.two, .grid.three { grid-template-columns: 1fr; } }

/* Linha de indicadores: tipográfica, não "cards" */
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); border-top: 1px solid var(--line-2); border-bottom: 1px solid var(--line); }
.stat { padding: 18px 18px 16px 0; }
.stat + .stat { padding-left: 18px; border-left: 1px solid var(--line); }
.stat .v { font-family: var(--serif); font-size: 2.6rem; line-height: 1; color: var(--ink); }
.stat .v small { font-size: 1.1rem; color: var(--muted); }
.stat .l { font-size: .78rem; color: var(--muted); margin-top: 6px; letter-spacing: .02em; }
@media (max-width: 600px) { .stat + .stat { border-left: 0; padding-left: 0; } .stats { grid-template-columns: repeat(2, 1fr); } }

/* ---------- Controles ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: 1px solid var(--line-2); background: var(--paper);
  color: var(--ink); padding: 9px 16px; border-radius: 999px; font: 500 .9rem var(--sans); cursor: pointer; text-decoration: none;
  transition: background .15s, border-color .15s, transform .05s;
}
.btn:hover { background: var(--paper-2); text-decoration: none; }
.btn:active { transform: translateY(1px); }
.btn.primary { background: var(--wine); border-color: var(--wine); color: #fff; }
.btn.primary:hover { background: var(--wine-2); }
.btn.ghost { border-color: transparent; background: transparent; }
.btn.small { padding: 5px 12px; font-size: .82rem; }
.btn[disabled] { opacity: .5; cursor: not-allowed; }
.btn-row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }

label.f { display: block; font-size: .8rem; color: var(--muted); margin-bottom: 5px; font-weight: 500; }
input.in, select.in, textarea.in {
  width: 100%; font: .95rem var(--sans); color: var(--ink); background: var(--paper); border: 1px solid var(--line-2);
  border-radius: 8px; padding: 9px 11px; outline: none;
}
textarea.in { min-height: 90px; resize: vertical; line-height: 1.5; }
input.in:focus, select.in:focus, textarea.in:focus { border-color: var(--wine); box-shadow: 0 0 0 3px var(--wine-soft); }
.form-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 14px 18px; }
.form-grid .wide { grid-column: 1 / -1; }
.search-in { position: relative; }
.search-in input { padding-left: 32px; border-radius: 999px; background: var(--bg); }
.search-in svg { position: absolute; left: 11px; top: 50%; transform: translateY(-50%); width: 15px; height: 15px; color: var(--muted); }

/* Segmentado (escalas) */
.seg { display: inline-flex; flex-wrap: wrap; border: 1px solid var(--line-2); border-radius: 999px; padding: 3px; gap: 2px; background: var(--paper); }
.seg button { border: 0; background: transparent; padding: 6px 13px; border-radius: 999px; font: 500 .85rem var(--sans); color: var(--ink-2); cursor: pointer; }
.seg button:hover { background: var(--paper-2); }
.seg button.on { background: var(--wine); color: #fff; }

.chip { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 999px; border: 1px solid var(--line-2); font-size: .82rem; color: var(--ink-2); background: var(--paper); cursor: default; }
button.chip { cursor: pointer; font-family: var(--sans); }
button.chip:hover { border-color: var(--wine); }
.chip.on { background: var(--wine); color: #fff; border-color: var(--wine); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }

/* Selo de origem do dado */
.src { display: inline-flex; align-items: center; gap: 5px; font-size: .68rem; letter-spacing: .04em; padding: 1px 8px; border-radius: 999px; white-space: nowrap; vertical-align: middle; font-weight: 600; }
.src::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: currentColor; opacity: .8; }
.src.usuario, .src.rotulo, .src.planilha { color: var(--hit); background: var(--hit-soft); }
.src.pesquisado, .src.ia_revisada { color: var(--info); background: var(--info-soft); }
.src.ia, .src.ia_nao_verificada { color: var(--near); background: var(--near-soft); }
.src.sistema { color: var(--muted); background: var(--paper-2); }

/* Estados de acerto */
.state { display: inline-flex; align-items: center; gap: 6px; font-weight: 600; font-size: .78rem; letter-spacing: .06em; text-transform: uppercase; padding: 3px 10px; border-radius: 999px; }
.state::before { content: ''; width: 8px; height: 8px; border-radius: 50%; background: currentColor; }
.state.hit { color: var(--hit); background: var(--hit-soft); }
.state.near { color: var(--near); background: var(--near-soft); }
.state.miss { color: var(--miss); background: var(--miss-soft); }
.state.no_ref { color: var(--muted); background: var(--paper-2); }

/* Campo com "Informação não cadastrada" */
.fields { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 16px 24px; }
.field .k { font-size: .75rem; color: var(--muted); letter-spacing: .03em; margin-bottom: 2px; display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.field .v { color: var(--ink); white-space: pre-line; }
.field.wide { grid-column: 1 / -1; }
.missing { color: var(--muted); font-style: italic; font-size: .88rem; }

/* Escala sensorial */
.scales { display: grid; gap: 10px; }
.scale-row { display: grid; grid-template-columns: 120px 1fr 110px; align-items: center; gap: 14px; }
.scale-row .name { font-size: .88rem; color: var(--ink-2); }
.scale-row .val { font-size: .82rem; color: var(--muted); text-align: right; }
.bar { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 3px; height: 10px; }
.bar i { display: block; border-radius: 2px; background: var(--line); }
.bar i.on { background: var(--wine); }
.bar i.band { background: color-mix(in srgb, var(--wine) 45%, transparent); }
@media (max-width: 600px) { .scale-row { grid-template-columns: 90px 1fr; } .scale-row .val { grid-column: 2; text-align: left; } }

/* Listas */
.list { border-top: 1px solid var(--line); }
.list .row { display: grid; grid-template-columns: 1fr auto; gap: 12px; align-items: center; padding: 14px 4px; border-bottom: 1px solid var(--line); text-decoration: none; color: inherit; }
a.row:hover { background: var(--paper); text-decoration: none; }
.row .t { font-family: var(--serif); font-size: 1.2rem; line-height: 1.2; }
.row .m { font-size: .84rem; color: var(--muted); }

table.tbl { width: 100%; border-collapse: collapse; font-size: .9rem; }
.tbl th { text-align: left; font-weight: 600; font-size: .72rem; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); padding: 8px 10px; border-bottom: 1px solid var(--line-2); }
.tbl td { padding: 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
.tbl-wrap { overflow-x: auto; }

.empty { text-align: center; padding: 46px 20px; color: var(--muted); }
.empty .serif { font-size: 1.4rem; color: var(--ink-2); display: block; margin-bottom: 6px; }

/* Garrafinhas */
.cellar { display: grid; grid-template-columns: repeat(auto-fill, minmax(62px, 1fr)); gap: 14px 8px; }
.btl { display: flex; flex-direction: column; align-items: center; gap: 4px; background: none; border: 0; padding: 4px 0; cursor: pointer; color: var(--ink); border-radius: 8px; font-family: var(--sans); }
.btl:hover { background: var(--paper); }
.btl.sel { background: var(--wine-soft); }
.btl svg { width: 34px; height: 78px; }
.btl .n { font-size: .78rem; font-weight: 600; letter-spacing: .03em; }
.btl .w { font-size: .66rem; color: var(--muted); max-width: 70px; text-align: center; line-height: 1.2; }
.btl.dim { opacity: .38; }

/* Progresso/sparkline */
.spark { width: 100%; height: 120px; }
.meter { height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; }
.meter i { display: block; height: 100%; background: var(--wine); }

/* Modal */
.modal-bg { position: fixed; inset: 0; background: rgba(26,18,19,.45); display: flex; align-items: center; justify-content: center; z-index: 80; padding: 16px; animation: fade .15s ease; }
.modal { background: var(--paper); border-radius: 14px; max-width: 720px; width: 100%; max-height: 90vh; overflow: auto; padding: 26px 28px; box-shadow: var(--shadow); }
.modal h2 { margin-top: 0; }
@keyframes fade { from { opacity: 0 } to { opacity: 1 } }

.toast { position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%); background: var(--ink); color: var(--paper); padding: 10px 18px; border-radius: 999px; font-size: .9rem; z-index: 99; box-shadow: var(--shadow); animation: fade .2s; max-width: 90vw; }
.toast.err { background: var(--miss); color: #fff; }
.loading { padding: 60px 0; text-align: center; color: var(--muted); font-family: var(--serif); font-size: 1.2rem; font-style: italic; }
.callout { border-left: 3px solid var(--gold); background: var(--gold-soft); padding: 12px 16px; border-radius: 0 8px 8px 0; font-size: .9rem; color: var(--ink-2); }
.callout.warn { border-color: var(--near); background: var(--near-soft); }

/* Aromas */
.aroma-cats { display: grid; gap: 14px; }
.aroma-cat .h { font-size: .74rem; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); margin-bottom: 6px; font-weight: 600; }

/* ============================================================
   MODO DEGUSTAÇÃO — escuro, imersivo
   ============================================================ */
.tasting-mode {
  --t-bg: #140e0f; --t-ink: #f3e9e1; --t-muted: #a8958c; --t-line: #3a2c2d; --t-card: #1d1516; --t-wine: #c24d5f; --t-gold: #d4b07a;
  position: fixed; inset: 0; z-index: 60; overflow-y: auto; color: var(--t-ink);
  background: radial-gradient(1200px 600px at 50% -10%, #3b1820 0%, transparent 60%), var(--t-bg);
  font-family: var(--sans);
}
.tasting-mode h1, .tasting-mode h2, .tasting-mode h3, .tasting-mode .serif { color: var(--t-ink); }
.tasting-mode .muted { color: var(--t-muted); }
.t-wrap { max-width: 980px; margin: 0 auto; padding: 22px 20px 120px; }
.t-top { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.t-top .eyebrow { color: var(--t-gold); }
.t-exit { color: var(--t-muted); background: none; border: 1px solid var(--t-line); border-radius: 999px; padding: 6px 14px; cursor: pointer; font: .85rem var(--sans); }
.t-exit:hover { color: var(--t-ink); border-color: var(--t-muted); }
.t-rail { display: flex; gap: 10px; justify-content: center; margin: 22px 0 8px; flex-wrap: wrap; }
.t-rail button { background: none; border: 1px solid transparent; border-radius: 12px; padding: 6px 10px 4px; cursor: pointer; color: var(--t-muted); display: flex; flex-direction: column; align-items: center; font: 600 .72rem var(--sans); letter-spacing: .06em; }
.t-rail button svg { width: 18px; height: 42px; }
.t-rail button.cur { border-color: var(--t-line); color: var(--t-ink); background: rgba(255,255,255,.03); }
.t-rail button.done { color: var(--t-gold); }
.t-hero { text-align: center; margin: 18px 0 8px; }
.t-hero svg.big { width: 92px; height: 220px; filter: drop-shadow(0 20px 30px rgba(0,0,0,.5)); animation: rise .6s ease; }
.t-hero .round { font-size: .78rem; letter-spacing: .3em; text-transform: uppercase; color: var(--t-gold); margin-top: 16px; }
.t-hero .num { font-family: var(--serif); font-size: 3.4rem; line-height: 1; margin: 4px 0; }
.t-hero .motto { font-family: var(--serif); font-style: italic; color: var(--t-muted); font-size: 1.25rem; }
@keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
.t-steps { display: flex; justify-content: center; gap: 4px; margin: 26px 0 18px; flex-wrap: wrap; }
.t-steps button { background: none; border: 0; border-bottom: 2px solid var(--t-line); color: var(--t-muted); padding: 8px 12px; cursor: pointer; font: 500 .85rem var(--sans); }
.t-steps button .i { font-family: var(--serif); font-size: 1rem; margin-right: 6px; color: var(--t-gold); }
.t-steps button.cur { color: var(--t-ink); border-color: var(--t-wine); }
.t-card { background: var(--t-card); border: 1px solid var(--t-line); border-radius: 16px; padding: 26px 28px; animation: rise .35s ease; }
.t-card h2 { margin: 0 0 4px; font-size: 1.9rem; }
.t-card .lead { color: var(--t-muted); margin: 0 0 22px; font-family: var(--serif); font-style: italic; font-size: 1.1rem; }
.t-q { margin: 20px 0; }
.t-q > .l { font-size: .74rem; letter-spacing: .14em; text-transform: uppercase; color: var(--t-muted); margin-bottom: 8px; font-weight: 600; }
.tasting-mode .seg { background: transparent; border-color: var(--t-line); }
.tasting-mode .seg button { color: var(--t-muted); }
.tasting-mode .seg button:hover { background: rgba(255,255,255,.05); color: var(--t-ink); }
.tasting-mode .seg button.on { background: var(--t-wine); color: #fff; }
.tasting-mode .chip { background: transparent; border-color: var(--t-line); color: var(--t-muted); }
.tasting-mode button.chip:hover { border-color: var(--t-wine); color: var(--t-ink); }
.tasting-mode .chip.on { background: var(--t-wine); border-color: var(--t-wine); color: #fff; }
.tasting-mode .in { background: #120c0d; border-color: var(--t-line); color: var(--t-ink); }
.tasting-mode .in:focus { border-color: var(--t-wine); box-shadow: 0 0 0 3px rgba(194,77,95,.2); }
.tasting-mode label.f { color: var(--t-muted); }
.tasting-mode .btn { background: transparent; color: var(--t-ink); border-color: var(--t-line); }
.tasting-mode .btn:hover { background: rgba(255,255,255,.05); }
.tasting-mode .btn.primary { background: var(--t-wine); border-color: var(--t-wine); }
.tasting-mode .btn.gold { background: var(--t-gold); border-color: var(--t-gold); color: #1a1213; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; padding: 13px 28px; }
.t-nav { display: flex; justify-content: space-between; margin-top: 22px; gap: 10px; }
.t-summary { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 10px 22px; }
.t-summary .k { font-size: .72rem; letter-spacing: .1em; text-transform: uppercase; color: var(--t-muted); }
.t-summary .v { font-size: .95rem; }
.t-reveal { text-align: center; margin-top: 40px; padding-top: 30px; border-top: 1px solid var(--t-line); }
.tasting-mode .aroma-cat .h { color: var(--t-gold); }
.tasting-mode .modal { background: var(--t-card); color: var(--t-ink); border: 1px solid var(--t-line); }
.tasting-mode .callout { background: rgba(212,176,122,.08); color: var(--t-ink); border-color: var(--t-gold); }

/* Relatório */
.score-hero { text-align: center; padding: 30px 0 10px; }
.score-hero .big { font-family: var(--serif); font-size: 5.4rem; line-height: 1; }
.score-hero .big small { font-size: 1.8rem; color: var(--muted); }
.tally { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px 26px; margin: 18px 0 6px; }
.tally div { font-size: .95rem; }
.tally b { font-family: var(--serif); font-size: 1.3rem; font-weight: 500; }
.reveal-card { border: 1px solid var(--line); border-radius: 14px; background: var(--paper); overflow: hidden; margin-top: 18px; }
.reveal-card .hd { display: grid; grid-template-columns: 56px 1fr auto; gap: 18px; align-items: center; padding: 18px 22px; background: var(--paper-2); border-bottom: 1px solid var(--line); }
.reveal-card .hd svg { width: 40px; height: 92px; }
.reveal-card .bd { padding: 8px 22px 18px; }
.cmp td.hl { font-weight: 600; }
.leaflet-container { font-family: var(--sans); background: var(--paper-2); }
.leaflet-tooltip { font-family: var(--sans); }

/* Foto do rótulo */
.label-scan { border: 1px dashed var(--line-2); border-radius: var(--radius); padding: 14px; margin-bottom: 18px; background: var(--paper-2); }
.label-scan-body { display: flex; gap: 16px; align-items: flex-start; margin-top: 14px; }
